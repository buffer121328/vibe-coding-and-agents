  <rect x="377.49216666666666" y="243.8" width="288.703" height="36.900000000000006" rx="0" ry="0" fill="#FCE9E6" stroke="#B65C4A" stroke-width="0.75" />
  <text x="521.8436666666666" y="262.25" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">真正端到端全托管 (人完全不用点鼠标)</text>
