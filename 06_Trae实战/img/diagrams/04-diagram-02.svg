  <rect x="948.8051666666667" y="243.8" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="#F0EBFA" stroke="#7357A6" stroke-width="0.75" />
  <text x="1058.7001666666665" y="262.25" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">支持多智能体并发调度协同</text>
</g>
