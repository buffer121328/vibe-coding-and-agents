  <rect x="361.49216666666666" y="199.8" width="823.103" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="373.49216666666666" y="213.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Solo 模式独特的王炸特权</text>
</g>
<polyline class="edge" data-from="Harmony" data-to="FreeChoice" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="242.41716666666667,312.70000000000005 242.41716666666667,324.70000000000005 598.7225833333332,324.70000000000005 598.7225833333332,336.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="PowerOfSolo" data-to="FreeChoice" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="773.0436666666667,296.70000000000005 773.0436666666667,324.70000000000005 657.1659166666666,324.70000000000005 657.1659166666666,336.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="W1" data-to="Harmony" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.72549999999998,137.8 210.72549999999998,206.8 242.41716666666667,206.8 242.41716666666667,275.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="W2" data-to="Harmony" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="514.5365,137.8 514.5365,206.8 242.41716666666667,206.8 242.41716666666667,275.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Harmony" data-label="工程质量极度稳定可靠" data-shape="rectangle">
