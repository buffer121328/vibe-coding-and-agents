  <text x="147.81599999999997" y="506.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="147.81599999999997" dy="-3.9000000000000012">6.5 阶段三 · AI 原生</tspan><tspan x="147.81599999999997" dy="16.900000000000002">(智能导读 + 自动打标)</tspan></text>
