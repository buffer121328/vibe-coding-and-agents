<polyline class="edge" data-from="C3" data-to="C4" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="147.81599999999997,333.40000000000003 147.81599999999997,379.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
