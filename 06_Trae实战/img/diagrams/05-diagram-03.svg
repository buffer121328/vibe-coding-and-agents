  <text x="147.81599999999997" y="406.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="147.81599999999997" dy="-3.9000000000000012">6.4 阶段二 · 社交</tspan><tspan x="147.81599999999997" dy="16.900000000000002">(点赞防刷 + 楼层 + 分页)</tspan></text>
