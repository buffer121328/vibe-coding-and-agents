<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908.4499999999999 530" width="908.4499999999999" height="530" style="--bg:#0d1117;--fg:#e6edf3;--line:#3d444d;--accent:#4493f8;--muted:#9198a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="F" x1="95.5105" y1="70" x2="95.5105" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="268.7545" y1="70" x2="268.7545" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="434.218" y1="70" x2="434.218" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="L" x1="621.9114999999999" y1="70" x2="621.9114999999999" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="815.1624999999999" y1="70" x2="815.1624999999999" y2="500" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="F" data-to="B" data-label="POST /api/posts (发布文章)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="95.5105" y1="90" x2="268.7545" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="182.1325" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">POST /api/posts (发布文章)</text>
</g>
<g class="message" data-from="B" data-to="B" data-label="立刻返回 201 (毫秒级响应)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="268.7545,130 298.7545,130 298.7545,150 268.7545,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="306.7545" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">立刻返回 201 (毫秒级响应)</text>
</g>
<g class="message" data-from="B" data-to="A" data-label="BackgroundTasks 后台任务 (异步)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="268.7545" y1="200" x2="434.218" y2="200" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="351.48625000000004" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">BackgroundTasks 后台任务 (异步)</text>
</g>
<g class="message" data-from="A" data-to="A" data-label="拼接 System + User 消息 (截断正文前4000字符)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="434.218,240 464.218,240 464.218,260 434.218,260" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="472.218" y="250" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">拼接 System + User 消息 (截断正文前4000字符)</text>
</g>
<g class="message" data-from="A" data-to="L" data-label="chat.completions.create (response_format=json_object)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="434.218" y1="310" x2="621.9114999999999" y2="310" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="528.06475" y="300" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">chat.completions.create (response_format=json_object)</text>
</g>
<g class="message" data-from="L" data-to="A" data-label="返回 JSON 字符串 (summary / tags / 标题建议)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="621.9114999999999" y1="350" x2="434.218" y2="350" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="528.06475" y="340" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回 JSON 字符串 (summary / tags / 标题建议)</text>
</g>
<g class="message" data-from="A" data-to="A" data-label="json.loads 解析 + 兜底校验" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="434.218,390 464.218,390 464.218,410 434.218,410" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="472.218" y="400" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">json.loads 解析 + 兜底校验</text>
</g>
<g class="message" data-from="A" data-to="DB" data-label="按字段独立回填 (summary/tags 非空即跳过)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="434.218" y1="460" x2="815.1624999999999" y2="460" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="624.69025" y="450" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">按字段独立回填 (summary/tags 非空即跳过)</text>
</g>
<g class="actor" data-id="F" data-label="前端 (index.html)" data-type="participant">
  <rect x="30" y="30" width="131.021" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="95.5105" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">前端 (index.html)</text>
</g>
<g class="actor" data-id="B" data-label="FastAPI (main.py)" data-type="participant">
  <rect x="201.02100000000002" y="30" width="135.467" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="268.7545" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">FastAPI (main.py)</text>
</g>
<g class="actor" data-id="A" data-label="ai_service.py" data-type="participant">
  <rect x="376.488" y="30" width="115.46000000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="434.218" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ai_service.py</text>
</g>
<g class="actor" data-id="L" data-label="大模型云端 (DeepSeek)" data-type="participant">
  <rect x="531.948" y="30" width="179.92699999999996" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="621.9114999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">大模型云端 (DeepSeek)</text>
</g>
<g class="actor" data-id="DB" data-label="SQLite (blog.db)" data-type="participant">
  <rect x="751.8749999999999" y="30" width="126.57499999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="815.1624999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">SQLite (blog.db)</text>
</g>
</svg>