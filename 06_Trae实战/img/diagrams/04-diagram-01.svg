<polyline class="edge" data-from="SocialAPI" data-to="T_Comment" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="507.9247499999999,303.6 507.9247499999999,424.50000000000006 576.7814999999999,424.50000000000006 576.7814999999999,545.4000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
