  <text x="120.22925000000004" y="219.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">FastAPI 业务引擎</text>
</g>
<g class="subgraph" data-id="Database" data-label="SQLite 数据持久层">
