<polyline class="edge" data-from="SocialAPI" data-to="T_Comment" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="518.9247499999999,315.6 518.9247499999999,452.50000000000006 592.7814999999999,452.50000000000006 592.7814999999999,589.4000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
