  <rect x="219.35300000000007" y="54" width="350.08425" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="231.35300000000007" y="68" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">业务逻辑层: Service (后厨主厨烹饪团队)</text>
</g>
<g class="subgraph" data-id="Layer3" data-label="数据访问层: DAO / Repository (库房管理员与食材仓库)">
