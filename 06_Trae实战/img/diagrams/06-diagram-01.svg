  <rect x="415.08400000000006" y="317.6" width="587.4639999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="427.08400000000006" y="331.6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">表现层: Controller (前厅领位与服务员)</text>
</g>
