  <rect x="36" y="174.9" width="1236.108" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="188.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">工业界真实开发模式: 持续二次开发</text>
</g>
