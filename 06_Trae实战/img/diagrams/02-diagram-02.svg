<polyline class="edge" data-from="TS" data-to="KG" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="290.31499999999994,106.9 330.45899999999995,106.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="MCP" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="663.9029999999999,283.24999999999994 689.9029999999999,283.24999999999994 689.9029999999999,324.00999999999993 715.9029999999999,324.00999999999993" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="TS" data-label="Tree-sitter 语法解析器
