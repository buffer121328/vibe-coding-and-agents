  <text x="794.6829999999999" y="292.01" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="794.6829999999999" dy="-3.9000000000000012">Trae Agent</tspan><tspan x="794.6829999999999" dy="16.900000000000002">(按需调用图谱查询工具)</tspan></text>
</g>
