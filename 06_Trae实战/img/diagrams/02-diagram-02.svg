<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 949.4629999999999 436.5" width="949.4629999999999" height="436.5" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Build" data-label="① 建图阶段 (codegraph build)">
  <rect x="40" y="40" width="535.2919999999999" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="535.2919999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">① 建图阶段 (codegraph build)</text>
</g>
<g class="subgraph" data-id="Serve" data-label="② 服务阶段 (codegraph serve --mcp)">
  <rect x="363.7969999999999" y="180.35" width="545.6659999999999" height="154.56" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="363.7969999999999" y="180.35" width="545.6659999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="375.7969999999999" y="194.35" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">② 服务阶段 (codegraph serve --mcp)</text>
</g>
<g class="subgraph" data-id="Query" data-label="③ 查询阶段 (零扫描)">
  <rect x="40" y="177.8" width="271.7969999999999" height="218.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="177.8" width="271.7969999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="191.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">③ 查询阶段 (零扫描)</text>
</g>
<polyline class="edge" data-from="Q1" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="307.6529999999999,240.25 675.9029999999999,240.25 675.9029999999999,292.01 695.9029999999999,292.01" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Q2" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="292.83299999999997,301.15000000000003 675.9029999999999,301.15000000000003 675.9029999999999,292.01 695.9029999999999,292.01" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Q3" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="283.941,362.05 675.9029999999999,362.05 675.9029999999999,292.01 695.9029999999999,292.01" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="TS" data-to="KG" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="294.31499999999994,110.9 322.45899999999995,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="MCP" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="655.9029999999999,251.25 675.9029999999999,251.25 675.9029999999999,292.01 695.9029999999999,292.01" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
