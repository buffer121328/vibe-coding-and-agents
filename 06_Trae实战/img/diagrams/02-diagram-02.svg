<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 965.4629999999999 482.50000000000006" width="965.4629999999999" height="482.50000000000006" style="--bg:#0d1117;--fg:#e6edf3;--line:#3d444d;--accent:#4493f8;--muted:#9198a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Build" data-label="① 建图阶段 (codegraph build)">
  <rect x="36" y="36" width="547.2919999999999" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="547.2919999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">① 建图阶段 (codegraph build)</text>
</g>
<g class="subgraph" data-id="Serve" data-label="② 服务阶段 (codegraph serve --mcp)">
  <rect x="371.7969999999999" y="212.34999999999997" width="557.6659999999999" height="154.56" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="371.7969999999999" y="212.34999999999997" width="557.6659999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="383.7969999999999" y="226.34999999999997" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">② 服务阶段 (codegraph serve --mcp)</text>
</g>
<g class="subgraph" data-id="Query" data-label="③ 查询阶段 (零扫描)">
  <rect x="36" y="191.8" width="271.7969999999999" height="254.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="191.8" width="271.7969999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="205.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">③ 查询阶段 (零扫描)</text>
</g>
<polyline class="edge" data-from="Q1" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="303.6529999999999,254.25 689.9029999999999,254.25 689.9029999999999,324.00999999999993 715.9029999999999,324.00999999999993" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Q2" data-to="AGENT" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="288.83299999999997,333.15000000000003 689.9029999999999,333.15000000000003 689.9029999999999,324.00999999999993 715.9029999999999,324.00999999999993" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
