  <rect x="63.85599999999998" y="80" width="226.45899999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="177.08549999999997" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="177.08549999999997" dy="-3.9000000000000012">Tree-sitter 语法解析器</tspan><tspan x="177.08549999999997" dy="16.900000000000002">(把代码拆成抽象语法树 AST)</tspan></text>
</g>
