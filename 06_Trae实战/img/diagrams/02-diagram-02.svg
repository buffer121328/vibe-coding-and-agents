  <text x="517.8499999999999" y="251.25" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="517.8499999999999" dy="-3.9000000000000012">本地 MCP Server</tspan><tspan x="517.8499999999999" dy="16.900000000000002">(暴露 codegraph_explore 等查询工具)</tspan></text>
