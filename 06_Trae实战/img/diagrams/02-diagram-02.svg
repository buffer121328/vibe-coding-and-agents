  <text x="814.6829999999999" y="324.00999999999993" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="814.6829999999999" dy="-3.9000000000000012">Trae Agent</tspan><tspan x="814.6829999999999" dy="16.900000000000002">(按需调用图谱查询工具)</tspan></text>
</g>
