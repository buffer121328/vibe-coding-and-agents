(把代码拆成抽象语法树 AST)" data-shape="rectangle">
  <rect x="67.85599999999998" y="84" width="226.45899999999997" height="53.800000000000004" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="181.08549999999997" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="181.08549999999997" dy="-3.9000000000000012">Tree-sitter 语法解析器</tspan><tspan x="181.08549999999997" dy="16.900000000000002">(把代码拆成抽象语法树 AST)</tspan></text>
</g>
