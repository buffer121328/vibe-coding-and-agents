<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1533.752 563.4" width="1533.752" height="563.4" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="DemoShow" data-label="🎬 培训班结业演示（惊艳 5 分钟）">
  <rect x="36" y="233.25" width="894.664" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="233.25" width="894.664" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="247.25" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🎬 培训班结业演示（惊艳 5 分钟）</text>
</g>
<g class="subgraph" data-id="Interview" data-label="💥 面试官连环追问（溃不成军）">
  <rect x="1091.8339999999998" y="36" width="405.91799999999995" height="491.4" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="1091.8339999999998" y="36" width="405.91799999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="1103.8339999999998" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">💥 面试官连环追问（溃不成军）</text>
</g>
<polyline class="edge" data-from="DemoShow" data-to="Interview" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="一进面试" points="930.664,281.7 1091.8339999999998,281.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D1" data-to="D2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="286.61,295.7 338.61,295.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D2" data-to="D3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="605.8240000000001,295.7 657.8240000000001,295.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="DemoShow" data-to="Interview" data-label="一进面试">
  <rect x="978.664" y="265.7" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1011.249" y="280.84999999999997" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">一进面试</text>
</g>
<g class="node" data-id="D1" data-label="输入一句话，打字机流畅输出" data-shape="rectangle">
  <rect x="52" y="277.25" width="234.60999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="169.305" y="295.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">输入一句话，打字机流畅输出</text>
</g>
<g class="node" data-id="D2" data-label="Markdown 图文渲染 + 多轮对话记忆" data-shape="rectangle">
  <rect x="338.61" y="277.25" width="267.214" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="472.217" y="295.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Markdown 图文渲染 + 多轮对话记忆</text>
</g>
