  <rect x="657.8240000000001" y="277.25" width="256.84" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="786.244" y="295.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&#39;老师你看，我的 AI 项目多智能！&#39;</text>
</g>
<g class="node" data-id="Q1" data-label="'一天扛得住多少并发？线上崩了怎么发现？'" data-shape="rectangle">
