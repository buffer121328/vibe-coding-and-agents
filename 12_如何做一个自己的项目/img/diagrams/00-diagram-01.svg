</g>
<g class="node" data-id="Q3" data-label="'用户连点三次会不会重复下单、重复扣费？'" data-shape="rectangle">
  <rect x="1127.4705" y="80" width="329.45799999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
