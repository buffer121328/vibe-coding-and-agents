</g>
<g class="node" data-id="Q5" data-label="'多轮上下文无限叠加，token 超限爆炸怎么办？'" data-shape="rectangle">
  <rect x="1127.4705" y="474.5" width="349.4649999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1302.203" y="492.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&#39;多轮上下文无限叠加，token 超限爆炸怎么办？&#39;</text>
</g>
<g class="node" data-id="Q6" data-label="'你的数据是真实的吗？有评测集、能度量效果吗？'" data-shape="rectangle">
  <rect x="1127.4705" y="237.8" width="373.91799999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
