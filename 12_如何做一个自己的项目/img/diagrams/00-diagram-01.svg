</g>
<g class="node" data-id="Q4" data-label="'没有鉴权，别人能不能绕过界面白嫖你的 API？'" data-shape="rectangle">
  <rect x="1127.4705" y="395.6" width="352.4289999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
