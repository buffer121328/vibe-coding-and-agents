<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 659.3059999999999 341.6" width="659.3059999999999" height="341.6" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Horizontal" data-label="❌ 横向通用（个人硬刚大厂 = 送死）">
  <rect x="36" y="36" width="520.6159999999999" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="520.6159999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">❌ 横向通用（个人硬刚大厂 = 送死）</text>
</g>
<g class="subgraph" data-id="Vertical" data-label="✅ 纵向垂直（个人以小博大）">
  <rect x="36" y="191.8" width="587.3059999999999" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="191.8" width="587.3059999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="205.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">✅ 纵向垂直（个人以小博大）</text>
</g>
<polyline class="edge" data-from="H1" data-to="H2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="279.19999999999993,106.9 331.19999999999993,106.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="V1" data-to="V2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="323.65999999999997,262.70000000000005 375.65999999999997,262.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="H1" data-label="'我要做一个通用 AI 智能助手'" data-shape="rectangle">
  <rect x="52" y="88.45" width="227.19999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="165.59999999999997" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&#39;我要做一个通用 AI 智能助手&#39;</text>
</g>
<g class="node" data-id="H2" data-label="与豆包 / ChatGPT 正面竞争
无数据、无场景、无壁垒" data-shape="rectangle">
  <rect x="331.19999999999993" y="80" width="209.41599999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="435.9079999999999" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="435.9079999999999" dy="-3.9000000000000012">与豆包 / ChatGPT 正面竞争</tspan><tspan x="435.9079999999999" dy="16.900000000000002">无数据、无场景、无壁垒</tspan></text>
</g>
<g class="node" data-id="V1" data-label="'我要做二手钢琴鉴定的 AI 估价助手'" data-shape="rectangle">
  <rect x="52" y="244.25" width="271.65999999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="187.82999999999998" y="262.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">&#39;我要做二手钢琴鉴定的 AI 估价助手&#39;</text>
</g>
<g class="node" data-id="V2" data-label="垂直行业知识 + 真实交易数据
用户刚需明确、竞品不屑做" data-shape="rectangle">
  <rect x="375.65999999999997" y="235.8" width="231.646" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="491.48299999999995" y="262.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="491.48299999999995" dy="-3.9000000000000012">垂直行业知识 + 真实交易数据</tspan><tspan x="491.48299999999995" dy="16.900000000000002">用户刚需明确、竞品不屑做</tspan></text>
</g>
</svg>