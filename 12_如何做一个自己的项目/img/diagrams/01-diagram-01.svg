<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805.204 447.6" width="805.204" height="447.6" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="WrongWay" data-label="❌ 传统死磕模式：从零造轮子 (耗时 3 个月)">
  <rect x="36" y="36" width="350.34299999999996" height="375.6" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="350.34299999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">❌ 传统死磕模式：从零造轮子 (耗时 3 个月)</text>
</g>
<g class="subgraph" data-id="RightWay" data-label="✅ 现代化二次开发模式：借力开源 (耗时 1 周破局)">
  <rect x="420.34299999999996" y="36" width="348.861" height="282.70000000000005" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="420.34299999999996" y="36" width="348.861" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="432.34299999999996" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">✅ 现代化二次开发模式：借力开源 (耗时 1 周破局)</text>
</g>
<polyline class="edge" data-from="W1" data-to="W2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="211.17149999999998,116.9 211.17149999999998,172.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="W2" data-to="W3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="211.17149999999998,209.8 211.17149999999998,265.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="W3" data-to="W4" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="211.17149999999998,302.70000000000005 211.17149999999998,358.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="R1" data-to="R2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="594.7735,116.9 594.7735,172.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="R2" data-to="R3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="594.7735,209.8 594.7735,265.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="W1" data-label="手写 JWT 登录与权限" data-shape="rectangle">
  <rect x="121.654" y="80" width="179.03499999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="211.17149999999998" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">手写 JWT 登录与权限</text>
</g>
<g class="node" data-id="W2" data-label="手写数据库 CRUD 增删改查" data-shape="rectangle">
  <rect x="103.4995" y="172.9" width="215.34399999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="211.17149999999998" y="191.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">手写数据库 CRUD 增删改查</text>
</g>
<g class="node" data-id="W3" data-label="手写后台表格与分页 UI" data-shape="rectangle">
  <rect x="116.467" y="265.8" width="189.40899999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="211.17149999999998" y="284.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">手写后台表格与分页 UI</text>
</g>
<g class="node" data-id="W4" data-label="精力耗尽，AI 功能只写了个调用 API 文本框" data-shape="rectangle">
  <rect x="52" y="358.70000000000005" width="318.34299999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="211.17149999999998" y="377.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">精力耗尽，AI 功能只写了个调用 API 文本框</text>
</g>
<g class="node" data-id="R1" data-label="挑选成熟优质开源底座 (自带 Auth/DB/UI)" data-shape="rectangle">
  <rect x="447.0875" y="80" width="295.37199999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="594.7735" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">挑选成熟优质开源底座 (自带 Auth/DB/UI)</text>
</g>
<g class="node" data-id="R2" data-label="直接植入 AI Agent 核心意图路由与业务逻辑" data-shape="rectangle">
  <rect x="436.34299999999996" y="172.9" width="316.861" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="594.7735" y="191.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">直接植入 AI Agent 核心意图路由与业务逻辑</text>
</g>
<g class="node" data-id="R3" data-label="专注于杀手级交互创新与真实数据闭环" data-shape="rectangle">
  <rect x="447.82849999999996" y="265.8" width="293.89" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="594.7735" y="284.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">专注于杀手级交互创新与真实数据闭环</text>
</g>
</svg>