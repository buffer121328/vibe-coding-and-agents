<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679.47 612.5" width="679.47" height="612.5" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="ErrorDiag" data-label="错题多维知识图谱诊断">
  <rect x="36" y="36" width="607.47" height="282.70000000000005" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="607.47" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">错题多维知识图谱诊断</text>
</g>
<g class="subgraph" data-id="AdaptiveTutor" data-label="自适应陪练智能体">
  <rect x="132.7005000000001" y="386.70000000000005" width="414.06899999999985" height="189.8" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="132.7005000000001" y="386.70000000000005" width="414.06899999999985" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="144.7005000000001" y="400.70000000000005" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">自适应陪练智能体</text>
</g>
<polyline class="edge" data-from="D2" data-to="T1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="339.735,302.70000000000005 339.735,430.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Q" data-to="D1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="339.735,116.9 339.735,172.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D1" data-to="D2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="339.735,209.8 339.735,265.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="T1" data-to="T2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="339.735,467.6 339.735,523.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Q" data-label="学生做错了一道高一立体几何大题" data-shape="rectangle">
  <rect x="207.61" y="80" width="264.25" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="339.735" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">学生做错了一道高一立体几何大题</text>
</g>
<g class="node" data-id="D1" data-label="AI 深入分析解题草稿步骤" data-shape="rectangle">
  <rect x="237.62050000000005" y="172.9" width="204.22899999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="339.735" y="191.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">AI 深入分析解题草稿步骤</text>
</g>
<g class="node" data-id="D2" data-label="精准定位病灶：并非立体几何定理未掌握，而是初中三角函数诱导公式运用错误！" data-shape="rectangle">
  <rect x="52" y="265.8" width="575.47" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="339.735" y="284.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">精准定位病灶：并非立体几何定理未掌握，而是初中三角函数诱导公式运用错误！</text>
</g>
<g class="node" data-id="T1" data-label="苏格拉底式启发提问：'回忆一下 sin(π - α) 等于多少？'" data-shape="rectangle">
  <rect x="148.7005000000001" y="430.70000000000005" width="382.06899999999985" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="339.735" y="449.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">苏格拉底式启发提问：&#39;回忆一下 sin(π - α) 等于多少？&#39;</text>
</g>
<g class="node" data-id="T2" data-label="智能动态生成 3 道同类型基础变式题靶向巩固" data-shape="rectangle">
  <rect x="172.042" y="523.6" width="335.386" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="339.735" y="542.0500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">智能动态生成 3 道同类型基础变式题靶向巩固</text>
</g>
</svg>