  <line x1="449.03799999999995" y1="185" x2="239.48499999999999" y2="185" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="344.26149999999996" y="175" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回结构化 JSON: {&quot;intent&quot;: &quot;query_logistics&quot;, &quot;keyword&quot;: &quot;耳机&quot;}</text>
</g>
<g class="message" data-from="Gateway" data-to="DB" data-label="2. 直接命中数据库查出运单状态" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="239.48499999999999" y1="225" x2="959.6574999999999" y2="225" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="599.57125" y="215" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">2. 直接命中数据库查出运单状态</text>
</g>
<g class="message" data-from="Gateway" data-to="BigLLM" data-label="3. 仅在需要深度创造时才调用通用大模型" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="239.48499999999999" y1="308" x2="736.7665" y2="308" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="488.12575" y="298" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">3. 仅在需要深度创造时才调用通用大模型</text>
</g>
<g class="message" data-from="BigLLM" data-to="Gateway" data-label="返回高质量长篇回复" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="736.7665" y1="348" x2="239.48499999999999" y2="348" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
