</g>
<g class="note" data-position="over" data-actors="SLM">
  <polygon points="296.91999999999996,138 595.156,138 601.156,144 601.156,161 296.91999999999996,161" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="595.156,138 601.156,144 595.156,144" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="449.03799999999995" y="149.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">本地 GPU/端侧耗时仅 40ms，精准识别为【物流查询】</text>
</g>
<g class="note" data-position="over" data-actors="Gateway">
  <polygon points="113.79999999999997,233 359.17,233 365.17,239 365.17,256 113.79999999999997,256" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="359.17,233 365.17,239 359.17,239" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="239.48499999999999" y="244.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">无需惊动昂贵的超大模型，直接完成闭环！</text>
</g>
<g class="actor" data-id="User" data-label="用户发起请求" data-type="participant">
  <rect x="30.000000000000007" y="30" width="122.86999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="91.435" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">用户发起请求</text>
</g>
<g class="actor" data-id="Gateway" data-label="业务网关" data-type="participant">
