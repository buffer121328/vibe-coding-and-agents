  <rect x="70.525" y="80" width="323.53" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="232.29" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="232.29" dy="-3.9000000000000012">BSD 3-Clause</tspan><tspan x="232.29" dy="16.900000000000002">自由商用，但禁止用原作者名字做商业背书</tspan></text>
</g>
