  <text x="277.491" y="400.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="277.491" dy="-3.9000000000000012">GPL v2 / v3</tspan><tspan x="277.491" dy="16.900000000000002">一旦修改、链接或分发，整个衍生作品必须 100% 全部开源</tspan></text>
</g>
