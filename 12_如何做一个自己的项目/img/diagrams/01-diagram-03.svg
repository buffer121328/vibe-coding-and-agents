  <text x="247.10999999999999" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="247.10999999999999" dy="-3.9000000000000012">Apache 2.0</tspan><tspan x="247.10999999999999" dy="16.900000000000002">自由商用，附带明确专利授权保护，修改需声明</tspan></text>
</g>
