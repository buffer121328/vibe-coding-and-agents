  <rect x="70.525" y="589" width="397.62999999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="269.34" y="615.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="269.34" dy="-3.9000000000000012">SSPL / BSL</tspan><tspan x="269.34" dy="16.900000000000002">个人学习免费，但不可直接打包成竞品云服务对外售卖</tspan></text>
