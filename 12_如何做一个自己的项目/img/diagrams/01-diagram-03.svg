  <rect x="70.525" y="451.20000000000005" width="464.31999999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="302.68499999999995" y="478.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="302.68499999999995" dy="-3.9000000000000012">AGPL v3</tspan><tspan x="302.68499999999995" dy="16.900000000000002">网络传染杀手！即使仅作为云端 SaaS 服务，也必须开源后端源码</tspan></text>
