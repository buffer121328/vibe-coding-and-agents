<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064.0439999999999 398.1" width="1064.0439999999999" height="398.1" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="TraditionalMoat" data-label="🧱 传统业务底座 (坚实确定性地基)">
  <rect x="36" y="36" width="992.0439999999999" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="992.0439999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🧱 传统业务底座 (坚实确定性地基)</text>
</g>
<g class="subgraph" data-id="AIBrain" data-label="🧠 AI 智能体大脑 (柔性意图与理解)">
  <rect x="52.30200000000002" y="265.20000000000005" width="959.4399999999998" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="52.30200000000002" y="265.20000000000005" width="959.4399999999998" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="64.30200000000002" y="279.20000000000005" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🧠 AI 智能体大脑 (柔性意图与理解)</text>
</g>
<polyline class="edge" data-from="TraditionalMoat" data-to="AIBrain" data-style="thick" data-arrow-start="true" data-arrow-end="true" data-label="通过 API 契约与状态机双向赋能" points="532.0219999999999,132.9 532.0219999999999,265.20000000000005" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<g class="edge-label" data-from="TraditionalMoat" data-to="AIBrain" data-label="通过 API 契约与状态机双向赋能">
  <rect x="441.52199999999993" y="183.9" width="180.406" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="531.7249999999999" y="199.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">通过 API 契约与状态机双向赋能</text>
</g>
<g class="node" data-id="T1" data-label="用户鉴权与 RBAC 权限体系" data-shape="rectangle">
  <rect x="442.8749999999999" y="80" width="215.34399999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="550.5469999999999" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">用户鉴权与 RBAC 权限体系</text>
</g>
<g class="node" data-id="T2" data-label="MySQL/PostgreSQL 事务与 ACID 数据一致性" data-shape="rectangle">
  <rect x="692.2189999999998" y="80" width="319.825" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="852.1314999999998" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">MySQL/PostgreSQL 事务与 ACID 数据一致性</text>
</g>
<g class="node" data-id="T3" data-label="库存锁定、秒杀并发控制与微信/支付宝支付网关" data-shape="rectangle">
  <rect x="52" y="80" width="356.87499999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="230.43749999999997" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">库存锁定、秒杀并发控制与微信/支付宝支付网关</text>
</g>
<g class="node" data-id="A1" data-label="自然语言模糊意图理解与槽位提取" data-shape="rectangle">
  <rect x="418.4219999999999" y="309.20000000000005" width="264.25" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="550.5469999999999" y="327.65000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">自然语言模糊意图理解与槽位提取</text>
</g>
<g class="node" data-id="A2" data-label="多轮复杂上下文规划与意图路由分流" data-shape="rectangle">
  <rect x="716.6719999999999" y="309.20000000000005" width="279.06999999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="856.2069999999999" y="327.65000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">多轮复杂上下文规划与意图路由分流</text>
</g>
<g class="node" data-id="A3" data-label="Function Calling 工具调用与结构化数据回填" data-shape="rectangle">
  <rect x="68.30200000000002" y="309.20000000000005" width="316.11999999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="226.362" y="327.65000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Function Calling 工具调用与结构化数据回填</text>
</g>
</svg>