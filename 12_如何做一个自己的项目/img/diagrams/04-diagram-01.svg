  <text x="170.78699999999998" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="170.78699999999998" dy="-3.9000000000000012">&#39;使用 React + OpenAI API</tspan><tspan x="170.78699999999998" dy="16.900000000000002">开发了一个智能问答客服系统&#39;</tspan></text>
