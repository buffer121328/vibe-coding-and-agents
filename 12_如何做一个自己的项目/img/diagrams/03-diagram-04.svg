<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952.5545 355" width="952.5545" height="355" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Sensor" x1="139.22949999999997" y1="70" x2="139.22949999999997" y2="325" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Agent" x1="406.5805" y1="70" x2="406.5805" y2="325" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="UI" x1="647.9965" y1="70" x2="647.9965" y2="325" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Sensor" data-to="Agent" data-label="1. 监测到：明天下午 14:00 目标景区突降特大暴雨" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="139.22949999999997" y1="90" x2="406.5805" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="272.905" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">1. 监测到：明天下午 14:00 目标景区突降特大暴雨</text>
</g>
<g class="message" data-from="Agent" data-to="Agent" data-label="3. 将室外爬山行程调整为室内现代艺术博物馆" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="406.5805,145 436.5805,145 436.5805,165 406.5805,165" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="444.5805" y="155" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">3. 将室外爬山行程调整为室内现代艺术博物馆</text>
</g>
<g class="message" data-from="Agent" data-to="UI" data-label="4. 推送动态警告弹窗与行程变更 Diff 对比卡片" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="406.5805" y1="215" x2="647.9965" y2="215" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="527.2885" y="205" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">4. 推送动态警告弹窗与行程变更 Diff 对比卡片</text>
</g>
<g class="message" data-from="UI" data-to="UI" data-label="5. 3D 路线流光粒子轨迹实时动态重绘变轨！" data-line-style="dashed" data-arrow-head="filled" data-self="true">
  <polyline points="647.9965,255 677.9965,255 677.9965,275 647.9965,275" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="685.9965" y="265" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">5. 3D 路线流光粒子轨迹实时动态重绘变轨！</text>
</g>
<g class="note" data-position="over" data-actors="Agent">
  <polygon points="275.84649999999993,98 531.3145,98 537.3145,104 537.3145,121 275.84649999999993,121" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="531.3145,98 537.3145,104 531.3145,104" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="406.5805" y="109.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">2. 触发紧急避险规则，启动室内行程自愈重排</text>
</g>
<g class="actor" data-id="Sensor" data-label="外部实时监测 (天气/交通 API)" data-type="participant">
  <rect x="29.999999999999986" y="30" width="218.45899999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="139.22949999999997" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">外部实时监测 (天气/交通 API)</text>
</g>
<g class="actor" data-id="Agent" data-label="实时自愈 Agent (Travel Guardian)" data-type="participant">
  <rect x="288.45899999999995" y="30" width="236.243" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="406.5805" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">实时自愈 Agent (Travel Guardian)</text>
</g>
<g class="actor" data-id="UI" data-label="前端 Three.js 3D 大屏" data-type="participant">
  <rect x="564.702" y="30" width="166.589" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="647.9965" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">前端 Three.js 3D 大屏</text>
</g>
</svg>