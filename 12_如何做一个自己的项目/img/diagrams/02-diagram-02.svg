  <text x="306.39" y="400.29999999999995" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="306.39" dy="-3.9000000000000012">2. 结构化 SQL 检索</tspan><tspan x="306.39" dy="16.900000000000002">SELECT * FROM goods WHERE category=&#39;fishing&#39; AND price&lt;=500</tspan></text>
</g>
