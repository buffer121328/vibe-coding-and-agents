推荐高碳素鱼竿+防滑钓鱼手套套装+定制贺卡话术" data-shape="rectangle">
  <rect x="122.39500000000001" y="473.20000000000005" width="367.98999999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="306.39" y="500.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="306.39" dy="-3.9000000000000012">3. 组合礼盒包装</tspan><tspan x="306.39" dy="16.900000000000002">推荐高碳素鱼竿+防滑钓鱼手套套装+定制贺卡话术</tspan></text>
</g>
<g class="node" data-id="F1" data-label="直接以富文本商品卡片形式展示，一键加入购物车" data-shape="rectangle">
  <rect x="122.39500000000001" y="633" width="367.98999999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="306.39" y="651.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">直接以富文本商品卡片形式展示，一键加入购物车</text>
</g>
</svg>