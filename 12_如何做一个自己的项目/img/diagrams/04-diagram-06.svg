<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1214.466 290.70000000000005" width="1214.466" height="290.70000000000005" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="InterviewDefense" data-label="🛡️ 面试官高频连环追问应对策略">
  <rect x="36" y="36" width="1142.466" height="218.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="1142.466" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🛡️ 面试官高频连环追问应对策略</text>
</g>
<polyline class="edge" data-from="Q1" data-to="A1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="385.90399999999994,159.35000000000002 414.34299999999996,159.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Q2" data-to="A2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="371.08399999999995,220.25 414.34299999999996,220.25" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Q3" data-to="A3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="354.782,98.45 414.34299999999996,98.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Q1" data-label="Q: 大模型输出 JSON 格式解析失败怎么办？" data-shape="rectangle">
  <rect x="67.56099999999998" y="140.9" width="318.34299999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="226.73249999999996" y="159.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Q: 大模型输出 JSON 格式解析失败怎么办？</text>
</g>
<g class="node" data-id="A1" data-label="A: 采用 Pydantic 双重校验 + 自动将错误栈回填大模型进行 1 次自愈修复 + 兜底人工规则降级。" data-shape="rectangle">
  <rect x="414.34299999999996" y="140.9" width="632.5269999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="730.6064999999999" y="159.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">A: 采用 Pydantic 双重校验 + 自动将错误栈回填大模型进行 1 次自愈修复 + 兜底人工规则降级。</text>
</g>
<g class="node" data-id="Q2" data-label="Q: 高并发下下游第三方 API 挂了怎么办？" data-shape="rectangle">
  <rect x="67.56099999999998" y="201.8" width="303.52299999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="219.32249999999996" y="220.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Q: 高并发下下游第三方 API 挂了怎么办？</text>
</g>
<g class="node" data-id="A2" data-label="A: 引入熔断器 (Circuit Breaker) 与指数退避重试，同时向用户推送优雅降级友好提示。" data-shape="rectangle">
  <rect x="414.34299999999996" y="201.8" width="588.808" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="708.747" y="220.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">A: 引入熔断器 (Circuit Breaker) 与指数退避重试，同时向用户推送优雅降级友好提示。</text>
</g>
<g class="node" data-id="Q3" data-label="Q: 为什么选用 LoRA 而不是全量微调？" data-shape="rectangle">
  <rect x="67.56099999999998" y="80" width="287.221" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="211.17149999999998" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Q: 为什么选用 LoRA 而不是全量微调？</text>
</g>
<g class="node" data-id="A3" data-label="A: LoRA 仅微调低秩分解矩阵 (rank=8/16)，显存消耗降低 70%，避免了全量微调引发的灾难性遗忘与显存爆炸。" data-shape="rectangle">
  <rect x="414.34299999999996" y="80" width="748.123" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="788.4045" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">A: LoRA 仅微调低秩分解矩阵 (rank=8/16)，显存消耗降低 70%，避免了全量微调引发的灾难性遗忘与显存爆炸。</text>
</g>
</svg>