  <rect x="732" y="56.20997772216796" width="610" height="28" rx="0" ry="0" fill="#c9eecb" stroke="#40a02b" stroke-width="1" />
  <text x="744" y="70.20997772216796" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">🔥 高价值区：掌控 AI 的人</text>
</g>
<polyline class="edge" data-from="R1" data-to="R2" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="197,168.5879364013672 245,168.5879364013672" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="R2" data-to="R3" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="409,168.5879364013672 457,168.5879364013672" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="V1" data-to="V2" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="906,127.10997772216797 954,127.10997772216797" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="V2" data-to="V3" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="1138,127.10997772216797 1186,127.10997772216797" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="R3" data-to="V1" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="656,168.5879364013672 702,168.5879364013672 702,186.00997772216795 827,186.00997772216795 827,154.00997772216795" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="R3" data-to="V1" data-label="补上内功，才有下一步">
