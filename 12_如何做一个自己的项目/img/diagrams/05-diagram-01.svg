  <text x="827" y="127.10997772216797" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="827" dy="-3.8999999999999995">定义问题与验收标准</tspan><tspan x="827" dy="16.9">AI 是放大器不是替身</tspan></text>
