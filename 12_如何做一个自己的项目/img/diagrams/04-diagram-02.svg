  <text x="391.49399999999997" y="1146.445" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="391.49399999999997" dy="-3.9000000000000012">选择 垂直微调 SFT / LoRA</tspan><tspan x="391.49399999999997" dy="16.900000000000002">(专科深造，内化固定推理模式)</tspan></text>
