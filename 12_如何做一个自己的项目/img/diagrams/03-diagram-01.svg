  <rect x="101.64699999999999" y="140.9" width="283.51599999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="243.40499999999997" y="159.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">缺乏极端长尾边界条件 (Corner Cases)</text>
</g>
<g class="node" data-id="S3" data-label="脱离真实用户行为 (无真实点击、退单与投诉)" data-shape="rectangle">
  <rect x="54.223" y="80" width="333.16299999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="220.80449999999996" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">脱离真实用户行为 (无真实点击、退单与投诉)</text>
</g>
<g class="node" data-id="S_Result" data-label="结果：在本地测试很完美，一上线立刻翻车崩溃" data-shape="rectangle">
  <rect x="429.16299999999995" y="140.9" width="353.16999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="605.7479999999999" y="159.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">结果：在本地测试很完美，一上线立刻翻车崩溃</text>
</g>
