<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834.3329999999999 550.3000000000001" width="834.3329999999999" height="550.3000000000001" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="SyntheticTrap" data-label="❌ 纯 AI 生成/假数据陷阱 (理想化温室)">
  <rect x="36" y="36" width="762.3329999999999" height="235.60000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="762.3329999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">❌ 纯 AI 生成/假数据陷阱 (理想化温室)</text>
</g>
<g class="subgraph" data-id="RealWorld" data-label="✅ 真实工业场景 (残酷泥泞现实)">
  <rect x="36" y="295.6" width="414.80999999999995" height="218.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="295.6" width="414.80999999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="309.6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">✅ 真实工业场景 (残酷泥泞现实)</text>
</g>
<polyline class="edge" data-from="S1" data-to="S_Result" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="385.16299999999995,228.70000000000002 408.2745,228.70000000000002 408.2745,159.35000000000002 429.16299999999995,159.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S2" data-to="S_Result" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="385.16299999999995,159.35000000000002 408.2745,159.35000000000002 408.2745,159.35000000000002 429.16299999999995,159.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S3" data-to="S_Result" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="387.38599999999997,98.45 408.2745,98.45 408.2745,159.35000000000002 429.16299999999995,159.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="S1" data-label="数据格式极其规整完美
没有错别字、没有方言网络语" data-shape="rectangle">
  <rect x="150.55299999999997" y="201.8" width="234.60999999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="267.85799999999995" y="228.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="267.85799999999995" dy="-3.9000000000000012">数据格式极其规整完美</tspan><tspan x="267.85799999999995" dy="16.900000000000002">没有错别字、没有方言网络语</tspan></text>
</g>
