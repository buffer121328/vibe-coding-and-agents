  <text x="241.18199999999996" y="418.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">用户输入错乱：&#39;上周买的那个红色的玩意儿能退吗&#39;</text>
</g>
<g class="node" data-id="R2" data-label="业务脏数据：空值、脏字符串、并发冲突、网络丢包" data-shape="rectangle">
  <rect x="54.223" y="461.40000000000003" width="382.80999999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="245.628" y="479.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">业务脏数据：空值、脏字符串、并发冲突、网络丢包</text>
</g>
<g class="node" data-id="R3" data-label="严格多维约束：预算不足、限流限额、营业时间突变" data-shape="rectangle">
  <rect x="54.223" y="339.6" width="382.80999999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="245.628" y="358.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">严格多维约束：预算不足、限流限额、营业时间突变</text>
</g>
</svg>