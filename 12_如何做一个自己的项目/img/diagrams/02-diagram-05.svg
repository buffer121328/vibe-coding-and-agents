<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065.5419999999997 520" width="1065.5419999999997" height="520" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Frontend" x1="103.66149999999999" y1="70" x2="103.66149999999999" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Backend" x1="329.14599999999996" y1="70" x2="329.14599999999996" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Redis" x1="560.5584999999999" y1="70" x2="560.5584999999999" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="LLM" x1="756.4029999999998" y1="70" x2="756.4029999999998" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="954.0999999999998" y1="70" x2="954.0999999999998" y2="490" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Frontend" data-to="Backend" data-label="1. 用户发送自然语言请求" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.66149999999999" y1="90" x2="329.14599999999996" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="216.40374999999997" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">1. 用户发送自然语言请求</text>
</g>
<g class="message" data-from="Backend" data-to="Redis" data-label="2. 检查会话状态锁 (防止重复并发点击)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="329.14599999999996" y1="130" x2="560.5584999999999" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="444.8522499999999" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">2. 检查会话状态锁 (防止重复并发点击)</text>
</g>
<g class="message" data-from="Backend" data-to="LLM" data-label="3. 发起请求并开启 SSE 流式监听" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="329.14599999999996" y1="170" x2="756.4029999999998" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="542.7744999999999" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">3. 发起请求并开启 SSE 流式监听</text>
</g>
<g class="message" data-from="LLM" data-to="Frontend" data-label="4. [SSE 流式] 打字机逐字输出思考过程与自然语言" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="756.4029999999998" y1="210" x2="103.66149999999999" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="430.03224999999986" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">4. [SSE 流式] 打字机逐字输出思考过程与自然语言</text>
</g>
<g class="message" data-from="LLM" data-to="Backend" data-label="5. 触发 Function Calling (如: query_inventory)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="756.4029999999998" y1="250" x2="329.14599999999996" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="542.7744999999999" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">5. 触发 Function Calling (如: query_inventory)</text>
</g>
<g class="message" data-from="Backend" data-to="DB" data-label="6. 查库获取商品最新实时库存与价格" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="329.14599999999996" y1="290" x2="954.0999999999998" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="641.6229999999998" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">6. 查库获取商品最新实时库存与价格</text>
</g>
<g class="message" data-from="DB" data-to="Backend" data-label="7. 返回结构化业务数据" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="954.0999999999998" y1="330" x2="329.14599999999996" y2="330" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="641.6229999999998" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">7. 返回结构化业务数据</text>
</g>
<g class="message" data-from="Backend" data-to="LLM" data-label="8. 回填数据供大模型继续组织语言" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="329.14599999999996" y1="370" x2="756.4029999999998" y2="370" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="542.7744999999999" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">8. 回填数据供大模型继续组织语言</text>
</g>
<g class="message" data-from="Backend" data-to="Frontend" data-label="9. [SSE 混合流] 推送标准 UI 卡片 JSON 与最终结论" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="329.14599999999996" y1="410" x2="103.66149999999999" y2="410" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="216.40374999999997" y="400" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">9. [SSE 混合流] 推送标准 UI 卡片 JSON 与最终结论</text>
</g>
<g class="message" data-from="Backend" data-to="Redis" data-label="10. 释放会话锁并更新会话记忆" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="329.14599999999996" y1="450" x2="560.5584999999999" y2="450" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="444.8522499999999" y="440" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">10. 释放会话锁并更新会话记忆</text>
</g>
<g class="actor" data-id="Frontend" data-label="前端 (Web/小程序)" data-type="participant">
  <rect x="30" y="30" width="147.32299999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="103.66149999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">前端 (Web/小程序)</text>
</g>
<g class="actor" data-id="Backend" data-label="传统业务后端 (FastAPI/Spring)" data-type="participant">
  <rect x="217.32299999999998" y="30" width="223.64599999999996" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="329.14599999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">传统业务后端 (FastAPI/Spring)</text>
</g>
<g class="actor" data-id="Redis" data-label="Redis 会话与状态锁" data-type="participant">
  <rect x="480.9689999999999" y="30" width="159.17899999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="560.5584999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Redis 会话与状态锁</text>
</g>
<g class="actor" data-id="LLM" data-label="大模型 / Agent 引擎" data-type="participant">
  <rect x="680.1479999999998" y="30" width="152.51" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="756.4029999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">大模型 / Agent 引擎</text>
</g>
<g class="actor" data-id="DB" data-label="业务数据库 (MySQL)" data-type="participant">
  <rect x="872.6579999999998" y="30" width="162.88399999999996" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="954.0999999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">业务数据库 (MySQL)</text>
</g>
</svg>