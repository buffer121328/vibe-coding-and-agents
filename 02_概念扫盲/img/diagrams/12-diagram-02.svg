<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1239.48 315.78999999999996" width="1239.48" height="315.78999999999996" style="--bg:#0d1117;--fg:#e6edf3;--line:#3d444d;--accent:#4493f8;--muted:#9198a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Start" data-to="Node1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="107.59,157.89499999999998 159.59,157.89499999999998" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Node1" data-to="Node2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="354.92699999999996,151.74499999999995 394.92699999999996,151.74499999999995 394.92699999999996,117.26333333333332 406.92699999999996,117.26333333333332" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Node2" data-to="Check" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="621.53,117.26333333333332 714.1616666666666,117.26333333333332" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="Node1" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="否：掉头循环修正" points="714.1616666666666,198.52666666666664 504.8399999999999,198.52666666666664 504.8399999999999,164.04499999999996 354.92699999999996,164.04499999999996" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="Finish" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="是：放行出城" points="917.3199999999999,157.89499999999998 1102.25,157.89499999999998" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Check" data-to="Node1" data-label="否：掉头循环修正">
  <rect x="512.8399999999999" y="182.52666666666664" width="112.69000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="569.185" y="197.67666666666665" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">否：掉头循环修正</text>
</g>
<g class="edge-label" data-from="Check" data-to="Finish" data-label="是：放行出城">
  <rect x="965.3199999999999" y="141.89499999999998" width="88.93" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1009.785" y="157.045" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">是：放行出城</text>
</g>
<g class="node" data-id="Start" data-label="开始" data-shape="stadium">
  <rect x="36" y="139.44499999999996" width="71.59" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="71.795" y="157.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">开始</text>
</g>
<g class="node" data-id="Node1" data-label="【节点 1】编写功能代码" data-shape="rectangle">
  <rect x="159.59" y="139.44499999999996" width="195.33699999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="257.25849999999997" y="157.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">【节点 1】编写功能代码</text>
</g>
<g class="node" data-id="Node2" data-label="【节点 2】运行自动化测试" data-shape="rectangle">
  <rect x="406.92699999999996" y="98.81333333333332" width="214.60299999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="514.2284999999999" y="117.26333333333332" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">【节点 2】运行自动化测试</text>
</g>
<g class="node" data-id="Check" data-label="【条件边】测试全绿了吗？" data-shape="diamond">
  <polygon points="795.425,36 917.3199999999999,157.89499999999998 795.425,279.78999999999996 673.53,157.89499999999998" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="795.425" y="157.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">【条件边】测试全绿了吗？</text>
</g>
<g class="node" data-id="Finish" data-label="交付完成" data-shape="stadium">
  <rect x="1102.25" y="139.445" width="101.22999999999999" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1152.865" y="157.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">交付完成</text>
</g>
</svg>