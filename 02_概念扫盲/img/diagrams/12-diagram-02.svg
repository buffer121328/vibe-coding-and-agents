<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1187.48 323.78999999999996" width="1187.48" height="323.78999999999996" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Start" data-to="Node1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="111.59,161.89499999999998 151.59,161.89499999999998" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Node1" data-to="Node2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="346.92699999999996,155.74499999999995 374.92699999999996,155.74499999999995 374.92699999999996,121.26333333333332 386.92699999999996,121.26333333333332" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Node2" data-to="Check" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="601.53,121.26333333333332 682.1616666666666,121.26333333333332" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="Node1" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="否：掉头循环修正" points="682.1616666666666,202.52666666666664 484.8399999999999,202.52666666666664 484.8399999999999,168.04499999999996 346.92699999999996,168.04499999999996" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="Finish" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="是：放行出城" points="885.3199999999999,161.89499999999998 1046.25,161.89499999999998" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Check" data-to="Node1" data-label="否：掉头循环修正">
  <rect x="492.8399999999999" y="186.52666666666664" width="112.69000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="549.185" y="201.67666666666665" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">否：掉头循环修正</text>
</g>
<g class="edge-label" data-from="Check" data-to="Finish" data-label="是：放行出城">
  <rect x="921.3199999999999" y="145.89499999999998" width="88.93" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="965.785" y="161.045" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">是：放行出城</text>
</g>
<g class="node" data-id="Start" data-label="开始" data-shape="stadium">
  <rect x="40" y="143.44499999999996" width="71.59" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="75.795" y="161.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">开始</text>
</g>
<g class="node" data-id="Node1" data-label="【节点 1】编写功能代码" data-shape="rectangle">
  <rect x="151.59" y="143.44499999999996" width="195.33699999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="249.25849999999997" y="161.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">【节点 1】编写功能代码</text>
</g>
<g class="node" data-id="Node2" data-label="【节点 2】运行自动化测试" data-shape="rectangle">
  <rect x="386.92699999999996" y="102.81333333333332" width="214.60299999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="494.22849999999994" y="121.26333333333332" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">【节点 2】运行自动化测试</text>
</g>
<g class="node" data-id="Check" data-label="【条件边】测试全绿了吗？" data-shape="diamond">
  <polygon points="763.425,40 885.3199999999999,161.89499999999998 763.425,283.78999999999996 641.53,161.89499999999998" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="763.425" y="161.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">【条件边】测试全绿了吗？</text>
</g>
<g class="node" data-id="Finish" data-label="交付完成" data-shape="stadium">
  <rect x="1046.25" y="143.445" width="101.22999999999999" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1096.865" y="161.89499999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">交付完成</text>
</g>
</svg>