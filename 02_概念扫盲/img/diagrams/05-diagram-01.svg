  <text x="226.95899999999997" y="254.50000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="226.95899999999997" dy="-3.9000000000000012">3. 背景情况 (Context)</tspan><tspan x="226.95899999999997" dy="16.900000000000002">&#39;家里有两只掉毛的猫咪，地板是实木的&#39;</tspan></text>
</g>
