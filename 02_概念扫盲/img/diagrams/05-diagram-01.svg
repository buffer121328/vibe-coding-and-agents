  <text x="226.95899999999997" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="226.95899999999997" dy="-3.9000000000000012">1. 角色身份 (Role)</tspan><tspan x="226.95899999999997" dy="16.900000000000002">&#39;你是一名五星级酒店保洁主管&#39;</tspan></text>
</g>
