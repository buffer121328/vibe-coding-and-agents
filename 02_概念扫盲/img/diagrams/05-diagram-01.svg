<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445.91799999999995 565" width="445.91799999999995" height="565" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="222.95899999999997,89.80000000000001 222.95899999999997,145.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="222.95899999999997,199.60000000000002 222.95899999999997,255.60000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="222.95899999999997,309.40000000000003 222.95899999999997,365.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="222.95899999999997,419.20000000000005 222.95899999999997,475.20000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="1. 角色身份 (Role)
'你是一名五星级酒店保洁主管'" data-shape="rectangle">
  <rect x="102.69" y="36" width="240.53799999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.95899999999997" y="62.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="222.95899999999997" dy="-3.9000000000000012">1. 角色身份 (Role)</tspan><tspan x="222.95899999999997" dy="16.900000000000002">&#39;你是一名五星级酒店保洁主管&#39;</tspan></text>
</g>
<g class="node" data-id="B" data-label="2. 核心任务 (Task)
'请打扫客厅与主卧'" data-shape="rectangle">
  <rect x="139.73999999999998" y="145.8" width="166.438" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.95899999999997" y="172.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="222.95899999999997" dy="-3.9000000000000012">2. 核心任务 (Task)</tspan><tspan x="222.95899999999997" dy="16.900000000000002">&#39;请打扫客厅与主卧&#39;</tspan></text>
</g>
<g class="node" data-id="C" data-label="3. 背景情况 (Context)
'家里有两只掉毛的猫咪，地板是实木的'" data-shape="rectangle">
  <rect x="73.05000000000001" y="255.60000000000002" width="299.8179999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.95899999999997" y="282.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="222.95899999999997" dy="-3.9000000000000012">3. 背景情况 (Context)</tspan><tspan x="222.95899999999997" dy="16.900000000000002">&#39;家里有两只掉毛的猫咪，地板是实木的&#39;</tspan></text>
</g>
<g class="node" data-id="D" data-label="4. 严苛禁忌 (Constraints)
'严禁使用酸性清洁剂，禁止湿拖把直接拖实木地板'" data-shape="rectangle">
  <rect x="36" y="365.40000000000003" width="373.91799999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.95899999999997" y="392.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="222.95899999999997" dy="-3.9000000000000012">4. 严苛禁忌 (Constraints)</tspan><tspan x="222.95899999999997" dy="16.900000000000002">&#39;严禁使用酸性清洁剂，禁止湿拖把直接拖实木地板&#39;</tspan></text>
</g>
<g class="node" data-id="E" data-label="5. 交付标准 (Output Format)
'打扫完后，列出消耗品补充清单'" data-shape="rectangle">
  <rect x="95.28" y="475.20000000000005" width="255.35799999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="222.95899999999997" y="502.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="222.95899999999997" dy="-3.9000000000000012">5. 交付标准 (Output Format)</tspan><tspan x="222.95899999999997" dy="16.900000000000002">&#39;打扫完后，列出消耗品补充清单&#39;</tspan></text>
</g>
</svg>