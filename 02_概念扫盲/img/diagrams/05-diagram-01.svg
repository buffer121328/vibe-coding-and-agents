  <text x="226.95899999999997" y="348.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="226.95899999999997" dy="-3.9000000000000012">4. 严苛禁忌 (Constraints)</tspan><tspan x="226.95899999999997" dy="16.900000000000002">&#39;严禁使用酸性清洁剂，禁止湿拖把直接拖实木地板&#39;</tspan></text>
</g>
<g class="node" data-id="E" data-label="5. 交付标准 (Output Format)
'打扫完后，列出消耗品补充清单'" data-shape="rectangle">
  <rect x="99.28" y="415.20000000000005" width="255.35799999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="226.95899999999997" y="442.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="226.95899999999997" dy="-3.9000000000000012">5. 交付标准 (Output Format)</tspan><tspan x="226.95899999999997" dy="16.900000000000002">&#39;打扫完后，列出消耗品补充清单&#39;</tspan></text>
</g>
