  <text x="226.95899999999997" y="160.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="226.95899999999997" dy="-3.9000000000000012">2. 核心任务 (Task)</tspan><tspan x="226.95899999999997" dy="16.900000000000002">&#39;请打扫客厅与主卧&#39;</tspan></text>
