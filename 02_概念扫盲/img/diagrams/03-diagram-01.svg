【学到：价值观对齐，安全有益】" data-shape="rectangle">
  <rect x="52" y="423.6" width="471.72999999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="287.865" y="450.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="287.865" dy="-3.9000000000000012">人类专家当裁判给答案打分，好答案给小红花，违规危险答案严惩</tspan><tspan x="287.865" dy="16.900000000000002">【学到：价值观对齐，安全有益】</tspan></text>
</g>
</svg>