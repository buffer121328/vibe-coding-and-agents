  <rect x="52" y="80" width="471.72999999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="287.865" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="287.865" dy="-3.9000000000000012">狂读全人类公开发表的所有书籍、百科、论坛与几十亿行开源代码</tspan><tspan x="287.865" dy="16.900000000000002">【学到：全人类通识知识与语言规律】</tspan></text>
</g>
