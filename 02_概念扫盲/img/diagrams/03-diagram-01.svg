  <text x="287.865" y="278.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="287.865" dy="-3.9000000000000012">刷几万道精选的名师问答题库，学习怎么像个礼貌助手一样答题</tspan><tspan x="287.865" dy="16.900000000000002">【学到：听懂人话，按格式回答】</tspan></text>
</g>
