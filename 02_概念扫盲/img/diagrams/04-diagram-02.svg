  <text x="234.06699999999995" y="248.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="234.06699999999995" dy="-3.9000000000000012">脑内多分支推演</tspan><tspan x="234.06699999999995" dy="16.900000000000002">&#39;下象棋，提前推演 3 种走法，死路及时回头剪枝&#39;</tspan></text>
