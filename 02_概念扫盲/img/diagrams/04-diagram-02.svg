  <text x="195.53499999999997" y="386.5" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="195.53499999999997" dy="-3.9000000000000012">行动与环境试错</tspan><tspan x="195.53499999999997" dy="16.900000000000002">&#39;尝一口汤咸淡 ➔ 加半勺盐 ➔ 再尝一口&#39;</tspan></text>
