'做数学题，写下一道道解题步骤'" data-shape="rectangle">
  <rect x="56" y="84" width="255.35799999999995" height="53.800000000000004" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="183.67899999999997" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="183.67899999999997" dy="-3.9000000000000012">步步推导草稿纸</tspan><tspan x="183.67899999999997" dy="16.900000000000002">&#39;做数学题，写下一道道解题步骤&#39;</tspan></text>
