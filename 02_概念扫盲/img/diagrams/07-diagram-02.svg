  <text x="237.58675" y="266.5" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="237.58675" dy="-3.9000000000000012">2. Resources (只读参考资料)</tspan><tspan x="237.58675" dy="16.900000000000002">如：数据库只读快照、Git 提交日志、产品设计图</tspan></text>
</g>
