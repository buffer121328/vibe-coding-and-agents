<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 459.393 341.40000000000003" width="459.393" height="341.40000000000003" style="--bg:#0d1117;--fg:#e6edf3;--line:#3d444d;--accent:#4493f8;--muted:#9198a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="MCPStructure" data-label="MCP 协议标准的三大核心能力">
  <rect x="36" y="36" width="387.393" height="269.40000000000003" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="387.393" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">MCP 协议标准的三大核心能力</text>
</g>
<g class="node" data-id="P" data-label="1. Prompts (预设任务菜谱)
如：'一键代码安全审查模版'" data-shape="rectangle">
  <rect x="116.8375" y="157.8" width="225.71799999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="229.6965" y="184.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="229.6965" dy="-3.9000000000000012">1. Prompts (预设任务菜谱)</tspan><tspan x="229.6965" dy="16.900000000000002">如：&#39;一键代码安全审查模版&#39;</tspan></text>
</g>
<g class="node" data-id="R" data-label="2. Resources (只读参考资料)
如：数据库只读快照、Git 提交日志、产品设计图" data-shape="rectangle">
  <rect x="55.890249999999995" y="235.60000000000002" width="355.393" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="233.58675" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="233.58675" dy="-3.9000000000000012">2. Resources (只读参考资料)</tspan><tspan x="233.58675" dy="16.900000000000002">如：数据库只读快照、Git 提交日志、产品设计图</tspan></text>
</g>
<g class="node" data-id="T" data-label="3. Tools (可执行动作手脚)
如：发送邮件、重启云服务器、执行 SQL 写入" data-shape="rectangle">
  <rect x="55.890249999999995" y="80" width="339.832" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="225.80624999999998" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="225.80624999999998" dy="-3.9000000000000012">3. Tools (可执行动作手脚)</tspan><tspan x="225.80624999999998" dy="16.900000000000002">如：发送邮件、重启云服务器、执行 SQL 写入</tspan></text>
</g>
</svg>