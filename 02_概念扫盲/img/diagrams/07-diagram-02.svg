如：发送邮件、重启云服务器、执行 SQL 写入" data-shape="rectangle">
  <rect x="59.890249999999995" y="84" width="339.832" height="53.800000000000004" rx="0" ry="0" fill="#FFF4DC" stroke="#B47A1F" stroke-width="0.75" />
  <text x="229.80624999999998" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="229.80624999999998" dy="-3.9000000000000012">3. Tools (可执行动作手脚)</tspan><tspan x="229.80624999999998" dy="16.900000000000002">如：发送邮件、重启云服务器、执行 SQL 写入</tspan></text>
</g>
