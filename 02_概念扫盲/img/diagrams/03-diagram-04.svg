<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446.36 424.5" width="446.36" height="424.5" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Start" data-to="Predict" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="232.86249999999998,76.9 232.86249999999998,116.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Predict" data-to="Pick" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="189.0678333333333,153.8 189.0678333333333,181.8 135.075,181.8 135.075,193.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Pick" data-to="Append" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="135.075,230.70000000000002 135.075,258.70000000000005 201.17083333333332,258.70000000000005 201.17083333333332,270.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Append" data-to="Predict" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="循环往复，直到输出结束符" points="264.5541666666667,270.70000000000005 264.5541666666667,258.70000000000005 330.65,258.70000000000005 330.65,198.4 276.6571666666666,198.4 276.6571666666666,153.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Append" data-to="Done" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="232.86249999999998,307.6 232.86249999999998,347.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Append" data-to="Predict" data-label="循环往复，直到输出结束符">
  <rect x="250.14999999999998" y="205.4" width="160.21" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="330.255" y="220.55" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">循环往复，直到输出结束符</text>
</g>
<g class="node" data-id="Start" data-label="输入一段文字" data-shape="rectangle">
  <rect x="167.42749999999998" y="40" width="130.87" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="232.86249999999998" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">输入一段文字</text>
</g>
<g class="node" data-id="Predict" data-label="模型预测下一个 Token 的概率分布" data-shape="rectangle">
  <rect x="101.47849999999997" y="116.9" width="262.76800000000003" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="232.86249999999998" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">模型预测下一个 Token 的概率分布</text>
</g>
<g class="node" data-id="Pick" data-label="挑出最合理的下一个字" data-shape="rectangle">
  <rect x="40" y="193.8" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="135.075" y="212.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">挑出最合理的下一个字</text>
</g>
<g class="node" data-id="Append" data-label="把新字拼接到原文末尾" data-shape="rectangle">
  <rect x="137.7875" y="270.70000000000005" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="232.86249999999998" y="289.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">把新字拼接到原文末尾</text>
</g>
<g class="node" data-id="Done" data-label="最终生成完整回答" data-shape="rectangle">
  <rect x="152.6075" y="347.6" width="160.51" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="232.86249999999998" y="366.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">最终生成完整回答</text>
</g>
</svg>