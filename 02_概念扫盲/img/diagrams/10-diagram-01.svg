<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330.17099999999994 364.8" width="330.17099999999994" height="364.8" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Pretrain" data-to="SFT" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="喂入数千条医疗/金融/特定格式真题" points="165.08549999999997,93.80000000000001 165.08549999999997,194.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="SFT" data-to="Expert" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="165.08549999999997,231 165.08549999999997,271" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Pretrain" data-to="SFT" data-label="喂入数千条医疗/金融/特定格式真题">
  <rect x="64.0855" y="128.8" width="201.79000000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="164.9805" y="143.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">喂入数千条医疗/金融/特定格式真题</text>
</g>
<g class="node" data-id="Pretrain" data-label="预训练大模型
(博学通才大学生)" data-shape="rectangle">
  <rect x="88.53549999999998" y="40" width="153.1" height="53.800000000000004" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="165.08549999999997" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="165.08549999999997" dy="-3.9000000000000012">预训练大模型</tspan><tspan x="165.08549999999997" dy="16.900000000000002">(博学通才大学生)</tspan></text>
</g>
<g class="node" data-id="SFT" data-label="监督微调 (Fine-Tuning)" data-shape="rectangle">
  <rect x="73.71549999999999" y="194.1" width="182.73999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="165.08549999999997" y="212.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">监督微调 (Fine-Tuning)</text>
</g>
<g class="node" data-id="Expert" data-label="专业领域专家模型
(严谨专科医生 / 专属格式生成器)" data-shape="rectangle">
  <rect x="40" y="271" width="250.17099999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="165.08549999999997" y="297.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="165.08549999999997" dy="-3.9000000000000012">专业领域专家模型</tspan><tspan x="165.08549999999997" dy="16.900000000000002">(严谨专科医生 / 专属格式生成器)</tspan></text>
</g>
</svg>