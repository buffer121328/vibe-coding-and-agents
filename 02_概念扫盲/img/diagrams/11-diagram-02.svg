<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980.9069999999999 253.8" width="980.9069999999999" height="253.8" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="TreeSearch" data-label="迷宫探索大比喻：树状搜索与剪枝 (Tree Search)">
  <rect x="40" y="40" width="900.9069999999999" height="173.8" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="900.9069999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">迷宫探索大比喻：树状搜索与剪枝 (Tree Search)</text>
</g>
<polyline class="edge" data-from="Root" data-to="PathA" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="489.15675,120.9 489.15675,140.9 265.92999999999995,140.9 265.92999999999995,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Root" data-to="PathB" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="489.15675,120.9 489.15675,140.9 712.3834999999999,140.9 712.3834999999999,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Root" data-label="起点：解决一个高难度 Bug" data-shape="rectangle">
  <rect x="381.11424999999997" y="84" width="216.08499999999998" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="489.15675" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">起点：解决一个高难度 Bug</text>
</g>
<g class="node" data-id="PathA" data-label="分支 A：修改数据库配置 ➔ (测试报错 500) ➔ 及时剪枝放弃！" data-shape="rectangle">
  <rect x="56" y="160.9" width="419.85999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="265.92999999999995" y="179.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">分支 A：修改数据库配置 ➔ (测试报错 500) ➔ 及时剪枝放弃！</text>
</g>
<g class="node" data-id="PathB" data-label="分支 B：重写权限校验中间件 ➔ (测试通过！) ➔ 继续向前推进" data-shape="rectangle">
  <rect x="499.86" y="160.9" width="425.0469999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="712.3834999999999" y="179.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">分支 B：重写权限校验中间件 ➔ (测试通过！) ➔ 继续向前推进</text>
</g>
</svg>