  <text x="763.719" y="191.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">🏛️ 架构师 Agent</text>
</g>
<g class="node" data-id="Coder" data-label="💻 研发工程师 Agent" data-shape="rectangle">
  <rect x="516.1996666666666" y="265.8" width="169.402" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="600.9006666666667" y="284.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">💻 研发工程师 Agent</text>
</g>
<g class="node" data-id="QA" data-label="🔍 严苛测试 Agent" data-shape="rectangle">
  <rect x="497.846" y="80" width="154.582" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="575.137" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">🔍 严苛测试 Agent</text>
</g>
</svg>