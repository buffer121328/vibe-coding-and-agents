<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584.0704999999999 331" width="584.0704999999999" height="331" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Q" data-to="Agent" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="145.8195,76.9 145.8195,108.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Agent" data-to="Search" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="需要" points="145.8195,145.8 145.8195,246.10000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Search" data-to="Check" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="193.357,246.10000000000002 193.35699999999997,165.8 323.1765,165.8 323.1765,145.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="Search" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="不够，需要再查" points="370.71399999999994,145.8 370.71399999999994,165.8 358.86549999999994,165.8 358.86549999999994,226.10000000000002 240.8945,226.10000000000002 240.8945,246.10000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="Answer" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="够了" points="418.25149999999996,145.8 418.25149999999996,165.8 434.17549999999994,165.8 434.17549999999994,246.10000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Agent" data-to="Search" data-label="需要">
  <rect x="124.81949999999999" y="188.8" width="41.41" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="145.5245" y="203.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">需要</text>
</g>
<g class="edge-label" data-from="Check" data-to="Search" data-label="不够，需要再查">
  <rect x="308.36549999999994" y="172.8" width="100.81000000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="358.77049999999997" y="187.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">不够，需要再查</text>
</g>
<g class="edge-label" data-from="Check" data-to="Answer" data-label="够了">
  <rect x="413.17549999999994" y="172.8" width="41.41" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="433.8804999999999" y="187.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">够了</text>
</g>
<g class="node" data-id="Q" data-label="用户提问" data-shape="rectangle">
  <rect x="95.2045" y="40" width="101.22999999999999" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="145.8195" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">用户提问</text>
</g>
<g class="node" data-id="Agent" data-label="Agent 判断：需要检索吗？" data-shape="rectangle">
  <rect x="40" y="108.9" width="211.63899999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="145.8195" y="127.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent 判断：需要检索吗？</text>
</g>
<g class="node" data-id="Search" data-label="调用检索工具查知识库" data-shape="rectangle">
  <rect x="98.28200000000001" y="246.10000000000002" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="193.357" y="264.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">调用检索工具查知识库</text>
</g>
<g class="node" data-id="Check" data-label="评估结果够不够回答？" data-shape="rectangle">
  <rect x="275.639" y="108.9" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="370.714" y="127.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">评估结果够不够回答？</text>
</g>
<g class="node" data-id="Answer" data-label="结合检索结果生成最终答案" data-shape="rectangle">
  <rect x="324.28049999999996" y="246.10000000000002" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="434.17549999999994" y="264.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">结合检索结果生成最终答案</text>
</g>
</svg>