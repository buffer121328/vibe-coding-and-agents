<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934.9579999999999 307.8" width="934.9579999999999" height="307.8" style="--bg:#eceff4;--fg:#2e3440;--line:#aab1c0;--accent:#5e81ac;--muted:#7b88a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="FirstRound" data-label="第 1 轮对话 (大厨初次备菜)">
  <rect x="36" y="36" width="855.3909999999998" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="855.3909999999998" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">第 1 轮对话 (大厨初次备菜)</text>
</g>
<g class="subgraph" data-id="SecondRound" data-label="第 2 轮对话 (秒级极速出餐)">
  <rect x="36" y="174.9" width="862.9579999999999" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="174.9" width="862.9579999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="188.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">第 2 轮对话 (秒级极速出餐)</text>
</g>
<polyline class="edge" data-from="Raw" data-to="Calc" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="232.51699999999997,98.45 284.51699999999994,98.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Calc" data-to="Cached" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="557.6589999999999,98.45 609.6589999999999,98.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="NewQ" data-to="Fast" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="322.178,237.35000000000002 374.178,237.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Raw" data-label="1 万字项目背景与代码" data-shape="rectangle">
  <rect x="52" y="80" width="180.51699999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="142.25849999999997" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">1 万字项目背景与代码</text>
</g>
<g class="node" data-id="Calc" data-label="GPU 完整计算注意力矩阵 (耗时较长)" data-shape="rectangle">
  <rect x="284.51699999999994" y="80" width="273.14199999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="421.0879999999999" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">GPU 完整计算注意力矩阵 (耗时较长)</text>
</g>
<g class="node" data-id="Cached" data-label="存入极速内存：KV Cache 预制菜包" data-shape="rectangle">
  <rect x="609.6589999999999" y="80" width="265.73199999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="742.5249999999999" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">存入极速内存：KV Cache 预制菜包</text>
</g>
<g class="node" data-id="NewQ" data-label="你追加问了一句：'把按钮改成蓝色'" data-shape="rectangle">
  <rect x="52" y="218.9" width="270.178" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="187.089" y="237.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">你追加问了一句：&#39;把按钮改成蓝色&#39;</text>
</g>
<g class="node" data-id="Fast" data-label="直接复用现成 KV 缓存，只需计算新的一句话！(毫秒级响应，费用打 1 折)" data-shape="rectangle">
  <rect x="374.178" y="218.9" width="508.77999999999986" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="628.568" y="237.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">直接复用现成 KV 缓存，只需计算新的一句话！(毫秒级响应，费用打 1 折)</text>
</g>
</svg>