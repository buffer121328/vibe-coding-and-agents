  <text x="157.75099999999998" y="394.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="157.75099999999998" dy="-3.9000000000000012">CD 持续部署</tspan><tspan x="157.75099999999998" dy="16.900000000000002">自动发布到云服务器</tspan></text>
</g>
<g class="node" data-id="E" data-label="🌍 全球用户访问" data-shape="rectangle">
  <rect x="83.79449999999999" y="467.70000000000005" width="147.913" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="157.75099999999998" y="486.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">🌍 全球用户访问</text>
</g>
</svg>