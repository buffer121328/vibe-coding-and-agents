<g class="edge-label" data-from="A" data-to="B" data-label="git push">
  <rect x="134.75099999999998" y="111.9" width="53.884" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="161.69299999999998" y="127.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">git push</text>
</g>
