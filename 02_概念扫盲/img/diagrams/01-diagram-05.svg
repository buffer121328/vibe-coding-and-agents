  <text x="157.75099999999998" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">👨‍💻 本地写代码</text>
</g>
<g class="node" data-id="B" data-label="代码托管仓库 (GitHub/GitLab)" data-shape="rectangle">
  <rect x="47.11500000000001" y="185.2" width="221.27199999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="157.75099999999998" y="203.64999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">代码托管仓库 (GitHub/GitLab)</text>
</g>
