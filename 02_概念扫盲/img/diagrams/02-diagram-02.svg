  <text x="187.76149999999998" y="223.64999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">我的专属副本仓库 (随便魔改不影响官方)</text>
</g>
<g class="node" data-id="LocalCode" data-label="本地写代码并测试成功" data-shape="rectangle">
  <rect x="239.06724999999994" y="374.40000000000003" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="334.14224999999993" y="392.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">本地写代码并测试成功</text>
