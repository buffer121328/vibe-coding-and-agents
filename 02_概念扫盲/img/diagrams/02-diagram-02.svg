  <text x="761.3262499999998" y="223.64999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">官方维护团队审核代码无误后，一键 Merge 合并进主干，向全球发布！</text>
</g>
