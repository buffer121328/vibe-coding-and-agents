</g>
<g class="edge-label" data-from="MyFork" data-to="LocalCode" data-label="2. 我修改并添加了支持微信扫码的新功能">
  <rect x="72.76149999999997" y="293.1" width="229.70800000000006" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="187.6155" y="308.25" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">2. 我修改并添加了支持微信扫码的新功能</text>
</g>
<g class="edge-label" data-from="LocalCode" data-to="Original" data-label="3. Pull Request / PR (向官方提交改良提案)">
