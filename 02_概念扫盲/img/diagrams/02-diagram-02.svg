<g class="node" data-id="Author" data-label="官方维护团队审核代码无误后，一键 Merge 合并进主干，向全球发布！" data-shape="rectangle">
  <rect x="500.01174999999995" y="177.2" width="500.6289999999999" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="750.3262499999998" y="195.64999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">官方维护团队审核代码无误后，一键 Merge 合并进主干，向全球发布！</text>
</g>
