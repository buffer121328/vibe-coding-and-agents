</g>
<g class="node" data-id="Original" data-label="全球官方开源仓库 (比如 Dify 官方项目)" data-shape="rectangle">
  <rect x="190.27275000000003" y="40" width="285.7389999999999" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="333.14225" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">全球官方开源仓库 (比如 Dify 官方项目)</text>
</g>
<g class="node" data-id="MyFork" data-label="我的专属副本仓库 (随便魔改不影响官方)" data-shape="rectangle">
  <rect x="40" y="177.2" width="303.52299999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="191.76149999999998" y="195.64999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">我的专属副本仓库 (随便魔改不影响官方)</text>
</g>
<g class="node" data-id="LocalCode" data-label="本地写代码并测试成功" data-shape="rectangle">
  <rect x="238.06725" y="314.40000000000003" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="333.14225" y="332.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">本地写代码并测试成功</text>
