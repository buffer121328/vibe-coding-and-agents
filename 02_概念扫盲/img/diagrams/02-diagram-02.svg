<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040.6407499999998 391.3" width="1040.6407499999998" height="391.3" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Original" data-to="MyFork" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="1. Fork (复印一份到我自己的云端账号)" points="285.51908333333336,76.9 285.51908333333336,104.9 191.76149999999996,104.9 191.76149999999998,177.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="MyFork" data-to="LocalCode" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="2. 我修改并添加了支持微信扫码的新功能" points="191.76149999999998,214.10000000000002 191.76149999999996,302.40000000000003 301.4505833333333,302.40000000000003 301.4505833333333,314.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="LocalCode" data-to="Original" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="3. Pull Request / PR (向官方提交改良提案)" points="364.83391666666665,314.40000000000003 364.83391666666665,302.40000000000003 474.52299999999997,302.40000000000003 474.52299999999997,242.10000000000002 380.7654166666666,242.10000000000002 380.7654166666666,76.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Original" data-to="MyFork" data-label="1. Fork (复印一份到我自己的云端账号)">
  <rect x="86.26149999999996" y="111.9" width="210.106" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="191.31449999999995" y="127.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">1. Fork (复印一份到我自己的云端账号)</text>
</g>
<g class="edge-label" data-from="MyFork" data-to="LocalCode" data-label="2. 我修改并添加了支持微信扫码的新功能">
  <rect x="76.76149999999997" y="249.1" width="229.70800000000006" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="191.6155" y="264.25" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">2. 我修改并添加了支持微信扫码的新功能</text>
</g>
<g class="edge-label" data-from="LocalCode" data-to="Original" data-label="3. Pull Request / PR (向官方提交改良提案)">
