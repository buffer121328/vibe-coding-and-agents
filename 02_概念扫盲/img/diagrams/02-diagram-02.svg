  <text x="334.14224999999993" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">全球官方开源仓库 (比如 Dify 官方项目)</text>
</g>
<g class="node" data-id="MyFork" data-label="我的专属副本仓库 (随便魔改不影响官方)" data-shape="rectangle">
