<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423.825 495.2" width="423.825" height="495.2" style="--bg:#0d1117;--fg:#e6edf3;--line:#3d444d;--accent:#4493f8;--muted:#9198a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="F1" data-label="1. 全量微调 (Full Fine-Tuning) —— 整栋大楼推倒重装水电">
  <rect x="36" y="36" width="281.42999999999995" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="281.42999999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">1. 全量微调 (Full Fine-Tuning) —— 整栋大楼推倒重装水电</text>
</g>
<g class="subgraph" data-id="F2" data-label="2. LoRA 微调 (低秩适配) —— 在墙外加装一套明线排插">
  <rect x="36" y="173.8" width="340.71" height="130.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="173.8" width="340.71" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="187.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">2. LoRA 微调 (低秩适配) —— 在墙外加装一套明线排插</text>
</g>
<g class="subgraph" data-id="F3" data-label="3. QLoRA 微调 —— 拿轻量化材料装排插">
  <rect x="36" y="328.5" width="351.825" height="130.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="328.5" width="351.825" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="342.5" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">3. QLoRA 微调 —— 拿轻量化材料装排插</text>
</g>
<g class="node" data-id="A1" data-label="重新计算几百亿个参数
需要几十张专业显卡，成本极高" data-shape="rectangle">
  <rect x="52" y="80" width="249.42999999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="176.71499999999997" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="176.71499999999997" dy="-3.9000000000000012">重新计算几百亿个参数</tspan><tspan x="176.71499999999997" dy="16.900000000000002">需要几十张专业显卡，成本极高</tspan></text>
</g>
<g class="node" data-id="A2" data-label="冻结原始大模型权重
只在旁边挂一个轻量级的小插片 (几十MB)
家用显卡即可轻松跑通！" data-shape="rectangle">
  <rect x="52" y="217.8" width="308.71" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="206.355" y="253.15" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="206.355" dy="-12.350000000000001">冻结原始大模型权重</tspan><tspan x="206.355" dy="16.900000000000002">只在旁边挂一个轻量级的小插片 (几十MB)</tspan><tspan x="206.355" dy="16.900000000000002">家用显卡即可轻松跑通！</tspan></text>
</g>
<g class="node" data-id="A3" data-label="先给大模型做 4-bit 极限压缩
再套上 LoRA 外挂
显存需求再降 50%，一台笔记本就能微调！" data-shape="rectangle">
  <rect x="52" y="372.5" width="319.825" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="211.9125" y="407.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="211.9125" dy="-12.350000000000001">先给大模型做 4-bit 极限压缩</tspan><tspan x="211.9125" dy="16.900000000000002">再套上 LoRA 外挂</tspan><tspan x="211.9125" dy="16.900000000000002">显存需求再降 50%，一台笔记本就能微调！</tspan></text>
</g>
</svg>