只在旁边挂一个轻量级的小插片 (几十MB)
家用显卡即可轻松跑通！" data-shape="rectangle">
  <rect x="56" y="221.8" width="308.71" height="70.7" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="210.355" y="257.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="210.355" dy="-12.350000000000001">冻结原始大模型权重</tspan><tspan x="210.355" dy="16.900000000000002">只在旁边挂一个轻量级的小插片 (几十MB)</tspan><tspan x="210.355" dy="16.900000000000002">家用显卡即可轻松跑通！</tspan></text>
</g>
<g class="node" data-id="A3" data-label="先给大模型做 4-bit 极限压缩
再套上 LoRA 外挂
显存需求再降 50%，一台笔记本就能微调！" data-shape="rectangle">
  <rect x="56" y="376.5" width="319.825" height="70.7" rx="0" ry="0" fill="#FFF4DC" stroke="#B47A1F" stroke-width="0.75" />
  <text x="215.9125" y="411.85" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="215.9125" dy="-12.350000000000001">先给大模型做 4-bit 极限压缩</tspan><tspan x="215.9125" dy="16.900000000000002">再套上 LoRA 外挂</tspan><tspan x="215.9125" dy="16.900000000000002">显存需求再降 50%，一台笔记本就能微调！</tspan></text>
</g>
</svg>