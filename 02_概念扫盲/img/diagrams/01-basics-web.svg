<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 837.422 440" width="837.422" height="440" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="User" x1="70" y1="70" x2="70" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Browser" x1="226.255" y1="70" x2="226.255" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DNS" x1="396.1645" y1="70" x2="396.1645" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Server" x1="570.52" y1="70" x2="570.52" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="API" x1="749.3215" y1="70" x2="749.3215" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="User" data-to="Browser" data-label="输入 github.com 并回车" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="226.255" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="148.1275" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">输入 github.com 并回车</text>
</g>
<g class="message" data-from="Browser" data-to="DNS" data-label="这个域名对应哪个 IP？" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="226.255" y1="130" x2="396.1645" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="311.20975" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">这个域名对应哪个 IP？</text>
</g>
<g class="message" data-from="DNS" data-to="Browser" data-label="返回服务器的 IP 门牌号" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="396.1645" y1="170" x2="226.255" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="311.20975" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回服务器的 IP 门牌号</text>
</g>
<g class="message" data-from="Browser" data-to="Server" data-label="连接 443 端口并发送 HTTP 请求" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="226.255" y1="210" x2="570.52" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="398.3875" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">连接 443 端口并发送 HTTP 请求</text>
</g>
<g class="message" data-from="Server" data-to="API" data-label="按接口规则处理这张点菜单" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="570.52" y1="250" x2="749.3215" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="659.92075" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">按接口规则处理这张点菜单</text>
</g>
<g class="message" data-from="API" data-to="Server" data-label="返回处理结果与数据" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="749.3215" y1="290" x2="570.52" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="659.92075" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回处理结果与数据</text>
</g>
<g class="message" data-from="Server" data-to="Browser" data-label="返回 HTTP 响应" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="570.52" y1="330" x2="226.255" y2="330" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="398.3875" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回 HTTP 响应</text>
</g>
<g class="message" data-from="Browser" data-to="User" data-label="把数据渲染成看得见的网页" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="226.255" y1="370" x2="70" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="148.1275" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">把数据渲染成看得见的网页</text>
</g>
<g class="actor" data-id="User" data-label="用户" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">用户</text>
</g>
<g class="actor" data-id="Browser" data-label="浏览器（客户端）" data-type="participant">
  <rect x="150" y="30" width="152.51" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="226.255" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">浏览器（客户端）</text>
</g>
<g class="actor" data-id="DNS" data-label="DNS 查号台" data-type="participant">
  <rect x="342.51" y="30" width="107.30899999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="396.1645" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">DNS 查号台</text>
</g>
<g class="actor" data-id="Server" data-label="服务器（IP + 端口）" data-type="participant">
  <rect x="489.81899999999996" y="30" width="161.402" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="570.52" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">服务器（IP + 端口）</text>
</g>
<g class="actor" data-id="API" data-label="API 服务窗口" data-type="participant">
  <rect x="691.221" y="30" width="116.20099999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="749.3215" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">API 服务窗口</text>
</g>
</svg>