  <rect x="161.154" y="176.9" width="483.72399999999993" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="173.154" y="190.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Loop 工程 (自主迭代控制循环)</text>
</g>
<polyline class="edge" data-from="HarnessSys" data-to="LoopSys" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="403.01599999999996,136.9 403.01599999999996,176.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
