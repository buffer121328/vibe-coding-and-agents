</g>
<polyline class="edge" data-from="HarnessSys" data-to="LoopSys" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="409.01599999999996,132.9 409.01599999999996,188.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
