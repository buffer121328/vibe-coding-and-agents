<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.8389999999999 673" width="572.8389999999999" height="673" style="--bg:#eceff4;--fg:#2e3440;--line:#aab1c0;--accent:#5e81ac;--muted:#7b88a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Hardware" data-label="电脑硬件厨房">
  <rect x="36" y="330.5" width="500.83899999999994" height="215.60000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="330.5" width="500.83899999999994" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="344.5" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">电脑硬件厨房</text>
</g>
<polyline class="edge" data-from="App" data-to="OS" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="286.23425,72.9 286.23425,120.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="OS" data-to="Process" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="286.23425,174.70000000000002 286.23425,222.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Process" data-to="CPU" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="286.23425,276.5 286.23425,325.5 161.5245,325.5 161.5245,374.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Process" data-to="RAM" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="286.23425,276.5 286.23425,325.5 410.94399999999996,325.5 410.94399999999996,374.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<polyline class="edge" data-from="GPU" data-to="Screen" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="161.5245,530.1 161.5245,600.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="RAM" data-to="Disk" data-style="solid" data-arrow-start="true" data-arrow-end="true" points="410.94399999999996,428.3 410.94399999999996,476.3" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<polyline class="edge" data-from="CPU" data-to="GPU" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="161.5245,428.3 161.5245,476.3" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="App" data-label="你点开一个 App" data-shape="rectangle">
  <rect x="215.24175" y="36" width="141.985" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="286.23425" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">你点开一个 App</text>
</g>
<g class="node" data-id="OS" data-label="操作系统：后厨总调度
分配算力、内存、文件与网络" data-shape="rectangle">
  <rect x="168.92925" y="120.9" width="234.60999999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="286.23425" y="147.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="286.23425" dy="-3.9000000000000012">操作系统：后厨总调度</tspan><tspan x="286.23425" dy="16.900000000000002">分配算力、内存、文件与网络</tspan></text>
</g>
<g class="node" data-id="Process" data-label="进程：正在工作的班组
每个运行中的程序都有自己的任务" data-shape="rectangle">
  <rect x="154.10924999999997" y="222.70000000000002" width="264.25" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="286.23425" y="249.60000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="286.23425" dy="-3.9000000000000012">进程：正在工作的班组</tspan><tspan x="286.23425" dy="16.900000000000002">每个运行中的程序都有自己的任务</tspan></text>
</g>
<g class="node" data-id="Screen" data-label="屏幕显示结果" data-shape="rectangle">
  <rect x="96.08949999999999" y="600.1" width="130.87" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="161.5245" y="618.5500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">屏幕显示结果</text>
</g>
<g class="node" data-id="CPU" data-label="CPU：掌勺大厨
不停执行计算" data-shape="rectangle">
  <rect x="90.16149999999999" y="374.5" width="142.726" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="161.5245" y="401.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="161.5245" dy="-3.9000000000000012">CPU：掌勺大厨</tspan><tspan x="161.5245" dy="16.900000000000002">不停执行计算</tspan></text>
</g>
<g class="node" data-id="RAM" data-label="内存 RAM：灶台
临时摆放正在使用的数据" data-shape="rectangle">
  <rect x="308.45899999999995" y="374.5" width="204.96999999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="410.94399999999996" y="401.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="410.94399999999996" dy="-3.9000000000000012">内存 RAM：灶台</tspan><tspan x="410.94399999999996" dy="16.900000000000002">临时摆放正在使用的数据</tspan></text>
</g>
<g class="node" data-id="Disk" data-label="硬盘：食材冷库
长期保存文件，断电也不丢" data-shape="rectangle">
  <rect x="301.049" y="476.3" width="219.78999999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="410.94399999999996" y="503.2" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="410.94399999999996" dy="-3.9000000000000012">硬盘：食材冷库</tspan><tspan x="410.94399999999996" dy="16.900000000000002">长期保存文件，断电也不丢</tspan></text>
</g>
<g class="node" data-id="GPU" data-label="GPU：摆盘师傅
绘制画面，也能并行加速 AI" data-shape="rectangle">
  <rect x="52" y="476.3" width="219.04899999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="161.5245" y="503.2" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="161.5245" dy="-3.9000000000000012">GPU：摆盘师傅</tspan><tspan x="161.5245" dy="16.900000000000002">绘制画面，也能并行加速 AI</tspan></text>
</g>
</svg>