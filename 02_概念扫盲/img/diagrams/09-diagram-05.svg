<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831.3619999999999 210.7" width="831.3619999999999" height="210.7" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Blackboard" data-label="1. 共享黑板模式 (Shared Blackboard)">
  <rect x="40" y="40" width="385.16999999999996" height="130.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="385.16999999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">1. 共享黑板模式 (Shared Blackboard)</text>
</g>
<g class="subgraph" data-id="Messaging" data-label="2. 点对点飞鸽传书 (Message Passing)">
  <rect x="449.16999999999996" y="40" width="342.19199999999995" height="130.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="449.16999999999996" y="40" width="342.19199999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="461.16999999999996" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">2. 点对点飞鸽传书 (Message Passing)</text>
</g>
<g class="node" data-id="B1" data-label="所有 Agent 围在一块大黑板前
谁有了新进展就写在黑板上，其他人随时抬头看
代表：LangGraph 的全局 State" data-shape="rectangle">
  <rect x="56" y="84" width="353.16999999999996" height="70.7" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="232.58499999999998" y="119.35" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="232.58499999999998" dy="-12.350000000000001">所有 Agent 围在一块大黑板前</tspan><tspan x="232.58499999999998" dy="16.900000000000002">谁有了新进展就写在黑板上，其他人随时抬头看</tspan><tspan x="232.58499999999998" dy="16.900000000000002">代表：LangGraph 的全局 State</tspan></text>
</g>
<g class="node" data-id="M1" data-label="Agent 之间互相发微信私聊消息
明确指定 Recipient 接收人 ID 进行消息投递
代表：AutoGen / A2A 协议" data-shape="rectangle">
  <rect x="465.16999999999996" y="84" width="310.19199999999995" height="70.7" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="620.266" y="119.35" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="620.266" dy="-12.350000000000001">Agent 之间互相发微信私聊消息</tspan><tspan x="620.266" dy="16.900000000000002">明确指定 Recipient 接收人 ID 进行消息投递</tspan><tspan x="620.266" dy="16.900000000000002">代表：AutoGen / A2A 协议</tspan></text>
</g>
</svg>