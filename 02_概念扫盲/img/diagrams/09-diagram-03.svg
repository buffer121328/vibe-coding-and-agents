  <text x="127.36999999999999" y="162.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="127.36999999999999" dy="-3.9000000000000012">2. 架构设计 Agent</tspan><tspan x="127.36999999999999" dy="16.900000000000002">(输出 API 接口定义)</tspan></text>
</g>
