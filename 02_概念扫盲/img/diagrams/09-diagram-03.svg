  <text x="127.36999999999999" y="62.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="127.36999999999999" dy="-3.9000000000000012">1. 需求分析 Agent</tspan><tspan x="127.36999999999999" dy="16.900000000000002">(输出标准 PRD 文档)</tspan></text>
