<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 409.746 900.0999999999999" width="409.746" height="900.0999999999999" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="S1" data-label="1. 工作区 (Working Tree)">
  <rect x="86.388" y="36" width="236.96999999999997" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="86.388" y="36" width="236.96999999999997" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="98.388" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">1. 工作区 (Working Tree)</text>
</g>
<g class="subgraph" data-id="S2" data-label="2. 暂存区 (Staging Area)">
  <rect x="51.56100000000001" y="274.1" width="306.62399999999997" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="51.56100000000001" y="274.1" width="306.62399999999997" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="63.56100000000001" y="288.1" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">2. 暂存区 (Staging Area)</text>
</g>
<g class="subgraph" data-id="S3" data-label="3. 本地仓库 (Local Repo)">
  <rect x="36" y="512.2" width="337.746" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="512.2" width="337.746" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="526.2" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">3. 本地仓库 (Local Repo)</text>
</g>
<g class="subgraph" data-id="S4" data-label="4. 远程仓库 (GitHub)">
  <rect x="62.67599999999999" y="750.3" width="284.394" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="62.67599999999999" y="750.3" width="284.394" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="74.67599999999999" y="764.3" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">4. 远程仓库 (GitHub)</text>
</g>
<polyline class="edge" data-from="W" data-to="S" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="git add" points="204.873,133.8 204.873,318.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S" data-to="L" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="git commit" points="204.873,371.90000000000003 204.873,556.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="L" data-to="R" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="git push" points="204.873,610 204.873,794.3" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="W" data-to="S" data-label="git add">
  <rect x="180.873" y="196.8" width="47.944" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="204.845" y="211.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">git add</text>
</g>
<g class="edge-label" data-from="S" data-to="L" data-label="git commit">
  <rect x="173.873" y="434.90000000000003" width="61.01200000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="204.379" y="450.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">git commit</text>
</g>
<g class="edge-label" data-from="L" data-to="R" data-label="git push">
  <rect x="177.873" y="673" width="53.884" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="204.815" y="688.15" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">git push</text>
</g>
<g class="node" data-id="W" data-label="你的办公桌
随时在上面写字涂改代码" data-shape="rectangle">
  <rect x="102.388" y="80" width="204.96999999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="204.873" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="204.873" dy="-3.9000000000000012">你的办公桌</tspan><tspan x="204.873" dy="16.900000000000002">随时在上面写字涂改代码</tspan></text>
</g>
<g class="node" data-id="S" data-label="打包快递纸箱
执行 git add：把满意的修改装进纸箱" data-shape="rectangle">
  <rect x="67.561" y="318.1" width="274.62399999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="204.873" y="345" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="204.873" dy="-3.9000000000000012">打包快递纸箱</tspan><tspan x="204.873" dy="16.900000000000002">执行 git add：把满意的修改装进纸箱</tspan></text>
</g>
<g class="node" data-id="L" data-label="自家地下室货架
执行 git commit：给纸箱贴上封条编号存档" data-shape="rectangle">
  <rect x="52" y="556.2" width="305.746" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="204.873" y="583.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="204.873" dy="-3.9000000000000012">自家地下室货架</tspan><tspan x="204.873" dy="16.900000000000002">执行 git commit：给纸箱贴上封条编号存档</tspan></text>
</g>
<g class="node" data-id="R" data-label="全球云端总仓库
执行 git push：顺丰寄到云端备份" data-shape="rectangle">
  <rect x="78.67599999999999" y="794.3" width="252.39399999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="204.873" y="821.1999999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="204.873" dy="-3.9000000000000012">全球云端总仓库</tspan><tspan x="204.873" dy="16.900000000000002">执行 git push：顺丰寄到云端备份</tspan></text>
</g>
</svg>