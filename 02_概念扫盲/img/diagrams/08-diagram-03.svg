  <text x="264.455" y="164.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="264.455" dy="-12.350000000000001">【阶段一：初赛海选 (Hybrid Search)】</tspan><tspan x="264.455" dy="16.900000000000002">1. 向量语义检索 (找出所有关于苹果手机维修的文档)</tspan><tspan x="264.455" dy="16.900000000000002">2. 传统关键词检索 (精准锁定 &#39;iPhone 16 Pro Max&#39; 关键词)</tspan></text>
