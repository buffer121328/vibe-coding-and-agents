  <rect x="36" y="348.5" width="456.90999999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="264.455" y="375.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="264.455" dy="-3.9000000000000012">【阶段二：决赛评委精细打分 (Rerank 重排模型)】</tspan><tspan x="264.455" dy="16.900000000000002">用算力更强的重排小模型，逐字对比上下文逻辑与提问的契合度</tspan></text>
</g>
<g class="node" data-id="Top3" data-label="最终挑出 3 篇最精准的官方报价表喂给大模型！" data-shape="rectangle">
  <rect x="89.35199999999998" y="458.3" width="350.206" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="264.455" y="476.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">最终挑出 3 篇最精准的官方报价表喂给大模型！</text>
