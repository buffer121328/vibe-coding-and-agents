<polyline class="edge" data-from="Top100" data-to="Reranker" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="268.455,264.5 268.455,304.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
