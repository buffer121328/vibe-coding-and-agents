<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 511.1259999999999 434.8" width="511.1259999999999" height="434.8" style="--bg:#0d1117;--fg:#e6edf3;--line:#3d444d;--accent:#4493f8;--muted:#9198a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="DebateRing" data-label="法庭辩论与攻防角斗场">
  <rect x="122.25799999999995" y="36" width="266.61" height="279.90000000000003" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="122.25799999999995" y="36" width="266.61" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="134.25799999999995" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">法庭辩论与攻防角斗场</text>
</g>
<polyline class="edge" data-from="DebateRing" data-to="Judge" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="255.56299999999996,315.90000000000003 255.56299999999996,361.90000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="true" data-arrow-end="true" data-label="多轮质疑与交锋挑刺" points="255.56299999999996,133.8 255.56299999999996,246.10000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<g class="edge-label" data-from="A" data-to="B" data-label="多轮质疑与交锋挑刺">
  <rect x="193.06299999999996" y="174.8" width="124.57000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="255.34799999999996" y="189.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">多轮质疑与交锋挑刺</text>
</g>
<g class="node" data-id="Judge" data-label="⚖️ 裁判 / 仲裁者 Agent 投票评判，敲定最无懈可击的终极方案" data-shape="rectangle">
  <rect x="36" y="361.90000000000003" width="439.1259999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="255.56299999999996" y="380.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">⚖️ 裁判 / 仲裁者 Agent 投票评判，敲定最无懈可击的终极方案</text>
</g>
<g class="node" data-id="A" data-label="🔴 正方 / 创作者 Agent
提出方案与代码实现" data-shape="rectangle">
  <rect x="166.78649999999996" y="80" width="177.55299999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="255.56299999999993" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="255.56299999999993" dy="-3.9000000000000012">🔴 正方 / 创作者 Agent</tspan><tspan x="255.56299999999993" dy="16.900000000000002">提出方案与代码实现</tspan></text>
</g>
<g class="node" data-id="B" data-label="🔵 反方 / 审查者 Agent
专门寻找安全漏洞与边界死角" data-shape="rectangle">
  <rect x="138.25799999999995" y="246.10000000000002" width="234.60999999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="255.56299999999993" y="273" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="255.56299999999993" dy="-3.9000000000000012">🔵 反方 / 审查者 Agent</tspan><tspan x="255.56299999999993" dy="16.900000000000002">专门寻找安全漏洞与边界死角</tspan></text>
</g>
</svg>