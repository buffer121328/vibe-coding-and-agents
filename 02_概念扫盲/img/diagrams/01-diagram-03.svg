<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 803.2039999999998 391" width="803.2039999999998" height="391" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="C1" data-label="【缓存中间件 Redis】—— 老师抄在黑板角落的常考公式">
  <rect x="40" y="40" width="289.5809999999999" height="311" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="289.5809999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">【缓存中间件 Redis】—— 老师抄在黑板角落的常考公式</text>
</g>
<g class="subgraph" data-id="Q1" data-label="【消息队列 Kafka】—— 奶茶店的接单小票传送带">
  <rect x="353.5809999999999" y="40" width="409.62299999999993" height="250.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="353.5809999999999" y="40" width="409.62299999999993" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="365.5809999999999" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">【消息队列 Kafka】—— 奶茶店的接单小票传送带</text>
</g>
<polyline class="edge" data-from="U1" data-to="R1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="184.79049999999995,120.9 184.79049999999995,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="R1" data-to="D1" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="无需再去慢慢翻磁盘数据库" points="184.79049999999995,197.8 184.79049999999995,298.1" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="O1" data-to="K1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="558.3924999999999,120.9 558.3924999999999,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="K1" data-to="S3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="558.3924999999999,197.8 558.3924999999999,237.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="R1" data-to="D1" data-label="无需再去慢慢翻磁盘数据库">
  <rect x="104.29049999999997" y="232.8" width="160.21" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="184.39549999999997" y="247.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">无需再去慢慢翻磁盘数据库</text>
</g>
<g class="node" data-id="U1" data-label="100 万人同时查首页热搜" data-shape="rectangle">
  <rect x="87.12199999999997" y="84" width="195.33699999999996" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="184.79049999999995" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">100 万人同时查首页热搜</text>
</g>
<g class="node" data-id="R1" data-label="直接从超高速内存中秒取 (0.001秒)" data-shape="rectangle">
  <rect x="56" y="160.9" width="257.5809999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="184.79049999999995" y="179.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">直接从超高速内存中秒取 (0.001秒)</text>
</g>
<g class="node" data-id="D1" data-label="数据库免于崩溃" data-shape="rectangle">
  <rect x="111.94549999999995" y="298.1" width="145.69" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="184.79049999999995" y="316.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">数据库免于崩溃</text>
</g>
<g class="node" data-id="O1" data-label="双十一瞬间涌入 10 万笔订单" data-shape="rectangle">
  <rect x="448.4974999999999" y="84" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="558.3924999999999" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">双十一瞬间涌入 10 万笔订单</text>
</g>
<g class="node" data-id="K1" data-label="全部先扔进排队传送带暂存" data-shape="rectangle">
  <rect x="448.4974999999999" y="160.9" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="558.3924999999999" y="179.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">全部先扔进排队传送带暂存</text>
</g>
<g class="node" data-id="S3" data-label="后厨大厨按自己的速度慢慢做 (削峰填谷，平稳运行)" data-shape="rectangle">
  <rect x="369.5809999999999" y="237.8" width="377.62299999999993" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="558.3924999999999" y="256.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">后厨大厨按自己的速度慢慢做 (削峰填谷，平稳运行)</text>
</g>
</svg>