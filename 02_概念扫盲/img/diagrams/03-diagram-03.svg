<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 649.084 338.1" width="649.084" height="338.1" style="--bg:#1e1e2e;--fg:#cdd6f4;--line:#585b70;--accent:#cba6f7;--muted:#6c7086;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="AttentionFlow" data-label="自注意力全景扫描：'小猫爬上了树梢，因为【它】看见了小鸟'">
  <rect x="36" y="36" width="577.084" height="266.1" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="577.084" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">自注意力全景扫描：&#39;小猫爬上了树梢，因为【它】看见了小鸟&#39;</text>
</g>
<polyline class="edge" data-from="It" data-to="Cat" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="95% 超强注意力雷达关联" points="322.31899999999996,116.9 322.31899999999996,249.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="It" data-to="Tree" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="3% 微弱注意力" points="355.0365,116.9 355.0365,128.9 519.4224999999999,128.9 519.4224999999999,249.2" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="It" data-to="Bird" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="2% 微弱注意力" points="289.6015,116.9 289.6015,128.9 127.43849999999999,128.9 127.4385,249.2" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="It" data-to="Cat" data-label="95% 超强注意力雷达关联">
  <rect x="249.31900000000002" y="167.9" width="145.36" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="321.999" y="183.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">95% 超强注意力雷达关联</text>
</g>
<g class="edge-label" data-from="It" data-to="Tree" data-label="3% 微弱注意力">
  <rect x="473.42249999999996" y="167.9" width="91.9" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="519.3725" y="183.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">3% 微弱注意力</text>
</g>
<g class="edge-label" data-from="It" data-to="Bird" data-label="2% 微弱注意力">
  <rect x="81.43849999999999" y="167.9" width="91.9" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="127.3885" y="183.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">2% 微弱注意力</text>
</g>
<g class="node" data-id="It" data-label="代词：【它】" data-shape="rectangle">
  <rect x="256.884" y="80" width="130.87" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="322.319" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">代词：【它】</text>
</g>
<g class="node" data-id="Cat" data-label="主体：小猫 (The Cat)" data-shape="rectangle">
  <rect x="236.877" y="249.2" width="170.88399999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="322.31899999999996" y="267.65" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">主体：小猫 (The Cat)</text>
</g>
<g class="node" data-id="Tree" data-label="物体：树梢 (Tree)" data-shape="rectangle">
  <rect x="441.76099999999997" y="249.2" width="155.32299999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="519.4224999999999" y="267.65" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">物体：树梢 (Tree)</text>
</g>
<g class="node" data-id="Bird" data-label="目标：小鸟 (Bird)" data-shape="rectangle">
  <rect x="52" y="249.2" width="150.877" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="127.4385" y="267.65" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">目标：小鸟 (Bird)</text>
</g>
</svg>