<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507.55799999999994 392.1" width="507.55799999999994" height="392.1" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="MemoryArch" data-label="人类记忆分类 ➔ AI Agent 记忆系统映射">
  <rect x="36" y="36" width="435.55799999999994" height="320.1" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="435.55799999999994" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">人类记忆分类 ➔ AI Agent 记忆系统映射</text>
</g>
<g class="node" data-id="M1" data-label="1. 情景记忆 (Episodic Memory)
【生活例子】：记得上周二和朋友吃了海底捞牛油锅
【AI 表现】：记住上次会话中用户抱怨过哪个接口太慢" data-shape="rectangle">
  <rect x="53.66725000000001" y="174.7" width="396.8889999999999" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="252.11174999999997" y="210.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="252.11174999999997" dy="-12.350000000000001">1. 情景记忆 (Episodic Memory)</tspan><tspan x="252.11174999999997" dy="16.900000000000002">【生活例子】：记得上周二和朋友吃了海底捞牛油锅</tspan><tspan x="252.11174999999997" dy="16.900000000000002">【AI 表现】：记住上次会话中用户抱怨过哪个接口太慢</tspan></text>
</g>
<g class="node" data-id="M2" data-label="2. 语义记忆 (Semantic Memory)
【生活例子】：记住'地球绕着太阳转'的客观事实
【AI 表现】：记住整个项目的数据库表结构与设计模式" data-shape="rectangle">
  <rect x="53.66725000000001" y="269.40000000000003" width="396.8889999999999" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="252.11174999999997" y="304.75000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="252.11174999999997" dy="-12.350000000000001">2. 语义记忆 (Semantic Memory)</tspan><tspan x="252.11174999999997" dy="16.900000000000002">【生活例子】：记住&#39;地球绕着太阳转&#39;的客观事实</tspan><tspan x="252.11174999999997" dy="16.900000000000002">【AI 表现】：记住整个项目的数据库表结构与设计模式</tspan></text>
</g>
<g class="node" data-id="M3" data-label="3. 程序记忆 (Procedural Memory)
【生活例子】：学会游泳、骑自行车后的身体'肌肉记忆'
【AI 表现】：封装好的 Agent Skill 自动化执行工作流" data-shape="rectangle">
  <rect x="53.66725000000001" y="80" width="403.55799999999994" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="255.44624999999996" y="115.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="255.44624999999996" dy="-12.350000000000001">3. 程序记忆 (Procedural Memory)</tspan><tspan x="255.44624999999996" dy="16.900000000000002">【生活例子】：学会游泳、骑自行车后的身体&#39;肌肉记忆&#39;</tspan><tspan x="255.44624999999996" dy="16.900000000000002">【AI 表现】：封装好的 Agent Skill 自动化执行工作流</tspan></text>
</g>
</svg>