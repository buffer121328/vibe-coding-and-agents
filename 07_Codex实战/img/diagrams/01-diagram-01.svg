(已并入 ChatGPT 桌面端)" data-shape="rectangle">
  <rect x="71.82175" y="534.5" width="196.07799999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="169.86075" y="561.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="169.86075" dy="-3.9000000000000012">OpenAI Codex</tspan><tspan x="169.86075" dy="16.900000000000002">(已并入 ChatGPT 桌面端)</tspan></text>
</g>
<g class="node" data-id="ClaudeCode" data-label="Claude Code" data-shape="rectangle">
  <rect x="71.82175" y="630.3" width="116.79099999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="130.21724999999998" y="648.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Claude Code</text>
</g>
<g class="node" data-id="DSHarness" data-label="OpenCode / Hermes Agent" data-shape="rectangle">
  <rect x="71.82175" y="455.6" width="194.59599999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="169.11974999999995" y="474.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">OpenCode / Hermes Agent</text>
</g>
<g class="node" data-id="CursorGrok" data-label="Cursor / Grok Build" data-shape="rectangle">
  <rect x="71.82175" y="709.2" width="154.582" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="149.11275" y="727.6500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Cursor / Grok Build</text>
</g>
</svg>