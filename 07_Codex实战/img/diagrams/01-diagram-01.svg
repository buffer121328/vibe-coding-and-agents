  <text x="149.11275" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">DeepSeek V4 系列</text>
</g>
<g class="node" data-id="Grok" data-label="xAI Grok 4.x 系列" data-shape="rectangle">
