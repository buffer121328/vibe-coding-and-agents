  <text x="779.8864999999998" y="446.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="779.8864999999998" dy="-3.9000000000000012">访问 ChatGPT 桌面端 / chatgpt.com</tspan><tspan x="779.8864999999998" dy="16.900000000000002">➔ 登录账号 ➔ 进入 Codex 标签页 / 升级 Plan ➔ 填写账单地址与卡号 ➔ 极速激活！</tspan></text>
