  <rect x="40" y="210.7" width="1467.7729999999997" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="210.7" width="1467.7729999999997" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="224.7" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">2. 网络节点防护铁律 (极度重要 ⚠️)</text>
</g>
<g class="subgraph" data-id="BindingStep" data-label="3. 绑定与开通">
  <rect x="489.0469999999999" y="347.6" width="569.6789999999999" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="489.0469999999999" y="347.6" width="569.6789999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="501.0469999999999" y="361.6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">3. 绑定与开通</text>
</g>
<polyline class="edge" data-from="CardStep" data-to="NetworkStep" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="773.8864999999998,170.7 773.8864999999998,210.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="NetworkStep" data-to="BindingStep" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="773.8864999999998,307.6 773.8864999999998,347.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
