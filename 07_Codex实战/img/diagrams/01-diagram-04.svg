<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1559.7729999999997 525.4" width="1559.7729999999997" height="525.4" style="--bg:#eceff4;--fg:#2e3440;--line:#aab1c0;--accent:#5e81ac;--muted:#7b88a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="CardStep" data-label="1. 支付介质准备">
  <rect x="601.3804999999999" y="36" width="357.01199999999994" height="130.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="601.3804999999999" y="36" width="357.01199999999994" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="613.3804999999999" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">1. 支付介质准备</text>
</g>
<g class="subgraph" data-id="NetworkStep" data-label="2. 网络节点防护铁律 (极度重要 ⚠️)">
  <rect x="36" y="222.7" width="1487.7729999999997" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="222.7" width="1487.7729999999997" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="236.7" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">2. 网络节点防护铁律 (极度重要 ⚠️)</text>
</g>
<g class="subgraph" data-id="BindingStep" data-label="3. 绑定与开通">
  <rect x="495.0469999999999" y="375.6" width="569.6789999999999" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="495.0469999999999" y="375.6" width="569.6789999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="507.0469999999999" y="389.6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">3. 绑定与开通</text>
</g>
<polyline class="edge" data-from="CardStep" data-to="NetworkStep" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="779.8864999999998,166.7 779.8864999999998,222.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="NetworkStep" data-to="BindingStep" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="779.8864999999998,319.6 779.8864999999998,375.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
