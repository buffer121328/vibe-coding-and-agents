<polyline class="edge" data-from="LocalRoute" data-to="P3" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="358.92599999999993,193.04999999999998 400.92599999999993,193.04999999999998 400.92599999999993,224.25 442.926,224.25" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
