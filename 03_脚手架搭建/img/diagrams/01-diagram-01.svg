<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 583.1399999999999 281.6" width="583.1399999999999" height="281.6" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Mindset" data-label="【YES 工程师 vs 交响乐指挥官】">
  <rect x="36" y="36" width="511.1399999999999" height="209.60000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="511.1399999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">【YES 工程师 vs 交响乐指挥官】</text>
</g>
<g class="node" data-id="YesMan" data-label="❌ YES 工程师
看不懂代码 ➔ 闭眼狂点 Accept ➔ 遇到 Bug 一头雾水 ➔ 系统崩盘" data-shape="rectangle">
  <rect x="64.04124999999999" y="80" width="430.9749999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="279.52874999999995" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="279.52874999999995" dy="-3.9000000000000012">❌ YES 工程师</tspan><tspan x="279.52874999999995" dy="16.900000000000002">看不懂代码 ➔ 闭眼狂点 Accept ➔ 遇到 Bug 一头雾水 ➔ 系统崩盘</tspan></text>
</g>
<g class="node" data-id="Commander" data-label="✅ Vibe Coder 指挥官
懂核心内功 ➔ 扫一眼识别逻辑缺陷 ➔ 精准提要求让 AI 修正 ➔ 稳步交付" data-shape="rectangle">
  <rect x="64.04124999999999" y="175.8" width="479.1399999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="303.6112499999999" y="202.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="303.6112499999999" dy="-3.9000000000000012">✅ Vibe Coder 指挥官</tspan><tspan x="303.6112499999999" dy="16.900000000000002">懂核心内功 ➔ 扫一眼识别逻辑缺陷 ➔ 精准提要求让 AI 修正 ➔ 稳步交付</tspan></text>
</g>
</svg>