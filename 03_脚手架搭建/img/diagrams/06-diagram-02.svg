<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431.83899999999994 404.5" width="431.83899999999994" height="404.5" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Market" data-to="Download" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="215.91949999999997,89.80000000000001 215.91949999999997,145.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Download" data-to="Config" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="215.91949999999997,182.70000000000002 215.91949999999997,238.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Config" data-to="Agent" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="215.91949999999997,275.6 215.91949999999997,331.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Market" data-label="从 Agent Skills Hub 挑选技能
(例如：security-audit 安全审计技能)" data-shape="rectangle">
  <rect x="83.05349999999999" y="36" width="265.73199999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="215.91949999999997" y="62.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="215.91949999999997" dy="-3.9000000000000012">从 Agent Skills Hub 挑选技能</tspan><tspan x="215.91949999999997" dy="16.900000000000002">(例如：security-audit 安全审计技能)</tspan></text>
</g>
<g class="node" data-id="Download" data-label="一键下载解压到项目 .skills/ 目录" data-shape="rectangle">
  <rect x="92.31599999999999" y="145.8" width="247.20699999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="215.91949999999997" y="164.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">一键下载解压到项目 .skills/ 目录</text>
</g>
<g class="node" data-id="Config" data-label="在项目 AGENTS.md 中登记技能触发词" data-shape="rectangle">
  <rect x="74.90250000000003" y="238.70000000000002" width="282.0339999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="215.91949999999997" y="257.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">在项目 AGENTS.md 中登记技能触发词</text>
</g>
<g class="node" data-id="Agent" data-label="Agent 识别到关键词，秒级激活专家级操作能力！" data-shape="rectangle">
  <rect x="36" y="331.6" width="359.83899999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="215.91949999999997" y="350.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent 识别到关键词，秒级激活专家级操作能力！</text>
</g>
</svg>