<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940.2109999999998 350" width="940.2109999999998" height="350" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Dev" x1="124.039" y1="70" x2="124.039" y2="320" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Cloud" x1="388.42599999999993" y1="70" x2="388.42599999999993" y2="320" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Bill" x1="620.2089999999998" y1="70" x2="620.2089999999998" y2="320" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Dev" data-to="Cloud" data-label="发送请求 + 附带专属 API Key 门禁卡" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="124.039" y1="90" x2="388.42599999999993" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="256.23249999999996" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">发送请求 + 附带专属 API Key 门禁卡</text>
</g>
<g class="message" data-from="Cloud" data-to="Bill" data-label="验证 Key 是否有效？账户是否有余额？" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="388.42599999999993" y1="130" x2="620.2089999999998" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="504.3174999999999" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">验证 Key 是否有效？账户是否有余额？</text>
</g>
<g class="message" data-from="Bill" data-to="Cloud" data-label="验证通过，余额充足" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="620.2089999999998" y1="170" x2="388.42599999999993" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="504.3174999999999" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">验证通过，余额充足</text>
</g>
<g class="message" data-from="Cloud" data-to="Dev" data-label="秒级返回生成的代码与回答" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="388.42599999999993" y1="210" x2="124.039" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="256.23249999999996" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">秒级返回生成的代码与回答</text>
</g>
<g class="message" data-from="Bill" data-to="Bill" data-label="扣除本次消耗的 500 Token 算力费用 (约 0.001 元)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="620.2089999999998,250 650.2089999999998,250 650.2089999999998,270 620.2089999999998,270" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="658.2089999999998" y="260" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">扣除本次消耗的 500 Token 算力费用 (约 0.001 元)</text>
</g>
<g class="actor" data-id="Dev" data-label="你的电脑 / Agent (Cursor)" data-type="actor">
  <g transform="translate(106.039,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="124.039" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">你的电脑 / Agent (Cursor)</text>
</g>
<g class="actor" data-id="Cloud" data-label="云端大模型平台 (DeepSeek / OpenAI)" data-type="participant">
  <rect x="258.078" y="30" width="260.6959999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="388.42599999999993" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">云端大模型平台 (DeepSeek / OpenAI)</text>
</g>
<g class="actor" data-id="Bill" data-label="计费水表系统" data-type="participant">
  <rect x="558.7739999999999" y="30" width="122.86999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="620.2089999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">计费水表系统</text>
</g>
</svg>