  <text x="208.06349999999998" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="208.06349999999998" dy="-3.9000000000000012">1. Propose (提出提案)</tspan><tspan x="208.06349999999998" dy="16.900000000000002">在 changes/ 目录下编写新功能的 Spec 蓝图</tspan></text>
</g>
