  <text x="208.06349999999998" y="254.50000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="208.06349999999998" dy="-3.9000000000000012">3. Apply (Agent 实施)</tspan><tspan x="208.06349999999998" dy="16.900000000000002">Agent 严格照着 Spec 跨文件编写代码并跑测试</tspan></text>
