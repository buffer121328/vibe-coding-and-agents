  <text x="208.06349999999998" y="348.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="208.06349999999998" dy="-3.9000000000000012">4. Sync (同步主规范)</tspan><tspan x="208.06349999999998" dy="16.900000000000002">将测试通过的新特性合并进 specs/ 永久主库</tspan></text>
</g>
<g class="node" data-id="E" data-label="5. Archive (归档结项)
将本次 changes 提案归档，保持工作区干净" data-shape="rectangle">
  <rect x="47.78049999999999" y="415.20000000000005" width="320.566" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="208.06349999999998" y="442.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="208.06349999999998" dy="-3.9000000000000012">5. Archive (归档结项)</tspan><tspan x="208.06349999999998" dy="16.900000000000002">将本次 changes 提案归档，保持工作区干净</tspan></text>
