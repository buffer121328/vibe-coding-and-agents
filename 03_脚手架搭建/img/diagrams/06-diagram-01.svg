<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574.4685 501.70000000000005" width="574.4685" height="501.70000000000005" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="HookFlow" data-label="Hooks 拦截与触发工作流">
  <rect x="40" y="40" width="494.46849999999995" height="421.70000000000005" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="494.46849999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Hooks 拦截与触发工作流</text>
</g>
<polyline class="edge" data-from="Event" data-to="Pre" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="274.63725,120.9 274.63725,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Pre" data-to="Run" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="检查通过" points="327.44741666666664,214.70000000000002 327.44741666666664,226.70000000000002 382.26800000000003,226.70000000000002 382.26800000000003,315" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Pre" data-to="Block" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="检查不通过" points="221.82708333333335,214.70000000000002 221.82708333333335,226.70000000000002 167.00650000000002,226.70000000000002 167.00650000000002,315" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Run" data-to="Post" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="382.26800000000003,351.90000000000003 382.26800000000003,391.90000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Pre" data-to="Run" data-label="检查通过">
  <rect x="349.26800000000003" y="249.70000000000002" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="381.853" y="264.85" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">检查通过</text>
</g>
<g class="edge-label" data-from="Pre" data-to="Block" data-label="检查不通过">
  <rect x="128.0065" y="249.70000000000002" width="77.05000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="166.5315" y="264.85" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">检查不通过</text>
</g>
<g class="node" data-id="Event" data-label="准备执行动作 (例如：提交代码 / Agent 调用终端)" data-shape="rectangle">
  <rect x="100.64575000000002" y="84" width="347.98299999999995" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="274.63725" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">准备执行动作 (例如：提交代码 / Agent 调用终端)</text>
</g>
<g class="node" data-id="Pre" data-label="🚨 Pre-Hook (前置拦截钩子)
自动运行代码语法检查 / 拦截高危删库命令" data-shape="rectangle">
  <rect x="116.20675" y="160.9" width="316.861" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="274.63725" y="187.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="274.63725" dy="-3.9000000000000012">🚨 Pre-Hook (前置拦截钩子)</tspan><tspan x="274.63725" dy="16.900000000000002">自动运行代码语法检查 / 拦截高危删库命令</tspan></text>
</g>
<g class="node" data-id="Run" data-label="正式执行核心动作" data-shape="rectangle">
  <rect x="302.01300000000003" y="315" width="160.51" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="382.26800000000003" y="333.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">正式执行核心动作</text>
</g>
<g class="node" data-id="Block" data-label="❌ 当场拦截并报错提示修正" data-shape="rectangle">
  <rect x="56" y="315" width="222.013" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="167.00650000000002" y="333.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">❌ 当场拦截并报错提示修正</text>
</g>
<g class="node" data-id="Post" data-label="✨ Post-Hook (后置收尾钩子)
自动格式化代码 / 记录操作审计日志" data-shape="rectangle">
  <rect x="246.0675" y="391.90000000000003" width="272.40099999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="382.268" y="418.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="382.268" dy="-3.9000000000000012">✨ Post-Hook (后置收尾钩子)</tspan><tspan x="382.268" dy="16.900000000000002">自动格式化代码 / 记录操作审计日志</tspan></text>
</g>
</svg>