<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 564.4685 517.7" width="564.4685" height="517.7" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="HookFlow" data-label="Hooks 拦截与触发工作流">
  <rect x="36" y="36" width="492.46849999999995" height="445.70000000000005" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="492.46849999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Hooks 拦截与触发工作流</text>
</g>
<polyline class="edge" data-from="Event" data-to="Pre" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="269.63725,116.9 269.63725,162.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Pre" data-to="Run" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="检查通过" points="322.44741666666664,216.70000000000002 322.44741666666664,228.70000000000002 376.26800000000003,228.70000000000002 376.26800000000003,329" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Pre" data-to="Block" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="检查不通过" points="216.82708333333335,216.70000000000002 216.82708333333335,228.70000000000002 163.00650000000002,228.70000000000002 163.00650000000002,329" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Run" data-to="Post" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="376.26800000000003,365.90000000000003 376.26800000000003,411.90000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Pre" data-to="Run" data-label="检查通过">
  <rect x="343.26800000000003" y="257.70000000000005" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="375.853" y="272.85" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">检查通过</text>
</g>
<g class="edge-label" data-from="Pre" data-to="Block" data-label="检查不通过">
  <rect x="124.00649999999999" y="257.70000000000005" width="77.05000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="162.5315" y="272.85" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">检查不通过</text>
</g>
<g class="node" data-id="Event" data-label="准备执行动作 (例如：提交代码 / Agent 调用终端)" data-shape="rectangle">
  <rect x="95.64575000000002" y="80" width="347.98299999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="269.63725" y="98.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">准备执行动作 (例如：提交代码 / Agent 调用终端)</text>
</g>
<g class="node" data-id="Pre" data-label="🚨 Pre-Hook (前置拦截钩子)
自动运行代码语法检查 / 拦截高危删库命令" data-shape="rectangle">
  <rect x="111.20675" y="162.9" width="316.861" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="269.63725" y="189.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="269.63725" dy="-3.9000000000000012">🚨 Pre-Hook (前置拦截钩子)</tspan><tspan x="269.63725" dy="16.900000000000002">自动运行代码语法检查 / 拦截高危删库命令</tspan></text>
</g>
<g class="node" data-id="Run" data-label="正式执行核心动作" data-shape="rectangle">
  <rect x="296.01300000000003" y="329" width="160.51" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="376.26800000000003" y="347.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">正式执行核心动作</text>
</g>
<g class="node" data-id="Block" data-label="❌ 当场拦截并报错提示修正" data-shape="rectangle">
  <rect x="52" y="329" width="222.013" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="163.00650000000002" y="347.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">❌ 当场拦截并报错提示修正</text>
</g>
<g class="node" data-id="Post" data-label="✨ Post-Hook (后置收尾钩子)
自动格式化代码 / 记录操作审计日志" data-shape="rectangle">
  <rect x="240.06750000000002" y="411.90000000000003" width="272.40099999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="376.26800000000003" y="438.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="376.26800000000003" dy="-3.9000000000000012">✨ Post-Hook (后置收尾钩子)</tspan><tspan x="376.26800000000003" dy="16.900000000000002">自动格式化代码 / 记录操作审计日志</tspan></text>
</g>
</svg>