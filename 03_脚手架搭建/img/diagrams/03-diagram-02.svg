  <rect x="36" y="105.45000000000002" width="210.29399999999998" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="105.45000000000002" width="210.29399999999998" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="119.45000000000002" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">你的电脑全局 Python 环境</text>
</g>
