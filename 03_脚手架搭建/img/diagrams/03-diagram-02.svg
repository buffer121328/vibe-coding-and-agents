  <rect x="298.294" y="36" width="221.40899999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="310.294" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">项目 A 独立房间 (.venv-a)</text>
</g>
