</g>
<polyline class="edge" data-from="Global" data-to="ProjA" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="246.29399999999998,137.75 286.294,137.75 286.294,84.45 298.294,84.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Global" data-to="ProjB" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="246.29399999999998,170.05 286.294,170.05 286.294,223.35000000000002 298.294,223.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
