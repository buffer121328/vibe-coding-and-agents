</g>
<polyline class="edge" data-from="Global" data-to="ProjA" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="250.29399999999998,132.75 278.294,132.75 278.294,88.45 290.294,88.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Global" data-to="ProjB" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="250.29399999999998,165.05 278.294,165.05 278.294,209.35000000000002 290.294,209.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
