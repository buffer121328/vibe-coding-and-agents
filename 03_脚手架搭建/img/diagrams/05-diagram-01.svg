  <text x="550.613" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">代码风格混乱、前后不一致</text>
</g>
<g class="node" data-id="S1" data-label="编写规格说明书 (Spec)" data-shape="rectangle">
  <rect x="56" y="204.9" width="186.44499999999996" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="149.22249999999997" y="223.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">编写规格说明书 (Spec)</text>
</g>
<g class="node" data-id="S2" data-label="人类审阅确认技术选型与接口契约" data-shape="rectangle">
  <rect x="269.10699999999997" y="204.9" width="264.25" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="401.23199999999997" y="223.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">人类审阅确认技术选型与接口契约</text>
</g>
<g class="node" data-id="S3" data-label="Agent 严格按 Spec 编写代码并自动化验收" data-shape="rectangle">
  <rect x="586.6949999999999" y="204.9" width="306.48699999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="739.9385" y="223.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent 严格按 Spec 编写代码并自动化验收</text>
</g>
</svg>