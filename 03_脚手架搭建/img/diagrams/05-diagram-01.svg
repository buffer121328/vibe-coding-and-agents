  <text x="341.5815" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">AI 脑补瞎猜架构</text>
</g>
<g class="node" data-id="T3" data-label="代码风格混乱、前后不一致" data-shape="rectangle">
