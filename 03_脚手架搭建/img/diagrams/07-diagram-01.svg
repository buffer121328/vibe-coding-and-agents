  <text x="343.567" y="236.5" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">国内高速专线（毫秒级）</text>
</g>
<g class="edge-label" data-from="Proxy" data-to="Official2" data-label="专线内网转发">
  <rect x="811.327" y="221.35" width="88.93" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="855.792" y="236.5" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">专线内网转发</text>
</g>
<g class="node" data-id="User1" data-label="你的电脑 / 终端 Agent" data-shape="rectangle">
