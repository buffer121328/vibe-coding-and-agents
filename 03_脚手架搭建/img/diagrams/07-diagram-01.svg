  <text x="623.4335" y="237.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">中转上游服务器（香港/日本专线节点）</text>
</g>
<g class="node" data-id="Official2" data-label="官方云端大模型 API" data-shape="rectangle">
  <rect x="948.2570000000001" y="218.9" width="168.66099999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1032.5875" y="237.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">官方云端大模型 API</text>
</g>
</svg>