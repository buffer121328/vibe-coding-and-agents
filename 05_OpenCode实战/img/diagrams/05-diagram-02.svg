<polyline class="edge" data-from="S2" data-to="S3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="427.984,286.55 478.502,286.55" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S3" data-to="S4" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="681.249,286.55 733.249,286.55" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S2" data-to="S2" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="独立验收/秒级回滚" points="322.9533333333333,268.1 322.9533333333333,258.1 375.46866666666665,258.1 375.46866666666665,268.1" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
