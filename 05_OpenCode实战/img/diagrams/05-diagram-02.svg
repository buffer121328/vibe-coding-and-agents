  <text x="349.211" y="286.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Phase 2: 后端与DB</text>
</g>
<g class="node" data-id="S3" data-label="Phase 3: 前端与Markdown" data-shape="rectangle">
  <rect x="478.502" y="268.1" width="202.74699999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="579.8755" y="286.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Phase 3: 前端与Markdown</text>
