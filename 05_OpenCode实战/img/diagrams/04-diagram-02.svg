<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1417.0349999999999 324.70000000000005" width="1417.0349999999999" height="324.70000000000005" style="--bg:#0d1117;--fg:#e6edf3;--line:#3d444d;--accent:#4493f8;--muted:#9198a1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="OldWay" data-label="5.3 原生双模切换 (需人类介入切换)">
  <rect x="36" y="36" width="679.0329999999999" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="679.0329999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">5.3 原生双模切换 (需人类介入切换)</text>
</g>
<g class="subgraph" data-id="NewWay" data-label="5.4 omo-slim Orchestrator 模式 (全自治闭环)">
  <rect x="36" y="191.8" width="1345.0349999999999" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="191.8" width="1345.0349999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="205.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">5.4 omo-slim Orchestrator 模式 (全自治闭环)</text>
</g>
<polyline class="edge" data-from="Plan" data-to="Switch" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="234.73999999999998,106.9 286.74,106.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Switch" data-to="Build" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="464.29299999999995,106.9 516.2929999999999,106.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="OrchInput" data-to="AutoPlan" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="360.71,254.25 412.71,254.25" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="AutoPlan" data-to="AutoDispatch" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="704.377,254.25 756.377,254.25" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="AutoDispatch" data-to="AutoTest" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1041.375,254.25 1093.375,254.25" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Plan" data-label="1. 手动切到 Plan 模式
(提问、澄清、出方案)" data-shape="rectangle">
  <rect x="52" y="80" width="182.73999999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="143.37" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="143.37" dy="-3.9000000000000012">1. 手动切到 Plan 模式</tspan><tspan x="143.37" dy="16.900000000000002">(提问、澄清、出方案)</tspan></text>
</g>
<g class="node" data-id="Switch" data-label="🧑 人类手动切换模式" data-shape="rectangle">
  <rect x="286.74" y="88.45" width="177.55299999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="375.5165" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">🧑 人类手动切换模式</text>
</g>
<g class="node" data-id="Build" data-label="2. 手动切到 Build 模式
(生成代码、落地实现)" data-shape="rectangle">
  <rect x="516.2929999999999" y="80" width="182.73999999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="607.6629999999999" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="607.6629999999999" dy="-3.9000000000000012">2. 手动切到 Build 模式</tspan><tspan x="607.6629999999999" dy="16.900000000000002">(生成代码、落地实现)</tspan></text>
</g>
<g class="node" data-id="OrchInput" data-label="人类直接说出最终意图 (Orchestrator 模式)" data-shape="rectangle">
  <rect x="52" y="235.8" width="308.71" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="206.355" y="254.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">人类直接说出最终意图 (Orchestrator 模式)</text>
</g>
<g class="node" data-id="AutoPlan" data-label="🤖 AI 内部自主拟定执行蓝图与 TodoList" data-shape="rectangle">
  <rect x="412.71" y="235.8" width="291.6669999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="558.5435" y="254.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">🤖 AI 内部自主拟定执行蓝图与 TodoList</text>
</g>
<g class="node" data-id="AutoDispatch" data-label="👥 自动调度 Designer / Oracle 协同交付" data-shape="rectangle">
  <rect x="756.377" y="235.8" width="284.998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="898.876" y="254.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">👥 自动调度 Designer / Oracle 协同交付</text>
</g>
<g class="node" data-id="AutoTest" data-label="🌐 自动调用 Agent-Browser 自测验收" data-shape="rectangle">
  <rect x="1093.375" y="235.8" width="271.65999999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1229.205" y="254.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">🌐 自动调用 Agent-Browser 自测验收</text>
</g>
</svg>