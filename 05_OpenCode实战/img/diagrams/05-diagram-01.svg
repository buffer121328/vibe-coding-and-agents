  <rect x="43.41" y="36" width="348.861" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="55.41" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">1. 基建与规则中枢 (Infrastructure &amp; Brain)</text>
