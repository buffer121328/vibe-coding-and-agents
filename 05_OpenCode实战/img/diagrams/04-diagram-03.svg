<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332.54499999999996 525" width="332.54499999999996" height="525" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="166.27249999999998,89.80000000000001 166.27249999999998,135.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="166.27249999999998,189.60000000000002 166.27249999999998,235.60000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="166.27249999999998,289.40000000000003 166.27249999999998,335.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="166.27249999999998,389.20000000000005 166.27249999999998,435.20000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="DOM 节点
(海报卡片区)" data-shape="rectangle">
  <rect x="104.54249999999999" y="36" width="123.46" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="166.27249999999998" y="62.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="166.27249999999998" dy="-3.9000000000000012">DOM 节点</tspan><tspan x="166.27249999999998" dy="16.900000000000002">(海报卡片区)</tspan></text>
</g>
<g class="node" data-id="B" data-label="html2canvas 快照
(遍历计算后样式并绘制到 Canvas)" data-shape="rectangle">
  <rect x="36" y="135.8" width="260.54499999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="166.27249999999998" y="162.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="166.27249999999998" dy="-3.9000000000000012">html2canvas 快照</tspan><tspan x="166.27249999999998" dy="16.900000000000002">(遍历计算后样式并绘制到 Canvas)</tspan></text>
</g>
<g class="node" data-id="C" data-label="Canvas 按 2x 放大绘制
(Retina 高分屏适配)" data-shape="rectangle">
  <rect x="74.53199999999998" y="235.60000000000002" width="183.481" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="166.27249999999998" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="166.27249999999998" dy="-3.9000000000000012">Canvas 按 2x 放大绘制</tspan><tspan x="166.27249999999998" dy="16.900000000000002">(Retina 高分屏适配)</tspan></text>
</g>
<g class="node" data-id="D" data-label="canvas.toDataURL('image/png')
生成 base64" data-shape="rectangle">
  <rect x="53.043000000000006" y="335.40000000000003" width="226.45899999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="166.27249999999998" y="362.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="166.27249999999998" dy="-3.9000000000000012">canvas.toDataURL(&#39;image/png&#39;)</tspan><tspan x="166.27249999999998" dy="16.900000000000002">生成 base64</tspan></text>
</g>
<g class="node" data-id="E" data-label="创建 a 标签的 download 属性
触发浏览器保存图片" data-shape="rectangle">
  <rect x="57.11849999999998" y="435.20000000000005" width="218.308" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="166.27249999999998" y="462.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="166.27249999999998" dy="-3.9000000000000012">创建 a 标签的 download 属性</tspan><tspan x="166.27249999999998" dy="16.900000000000002">触发浏览器保存图片</tspan></text>
</g>
</svg>