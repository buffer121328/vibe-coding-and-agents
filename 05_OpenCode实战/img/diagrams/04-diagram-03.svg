<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340.54499999999996 509.00000000000006" width="340.54499999999996" height="509.00000000000006" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="170.27249999999998,93.80000000000001 170.27249999999998,133.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="170.27249999999998,187.60000000000002 170.27249999999998,227.60000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="170.27249999999998,281.40000000000003 170.27249999999998,321.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="170.27249999999998,375.20000000000005 170.27249999999998,415.20000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="DOM 节点
(海报卡片区)" data-shape="rectangle">
  <rect x="108.54249999999999" y="40" width="123.46" height="53.800000000000004" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="170.27249999999998" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="170.27249999999998" dy="-3.9000000000000012">DOM 节点</tspan><tspan x="170.27249999999998" dy="16.900000000000002">(海报卡片区)</tspan></text>
</g>
<g class="node" data-id="B" data-label="html2canvas 快照
(遍历计算后样式并绘制到 Canvas)" data-shape="rectangle">
  <rect x="40" y="133.8" width="260.54499999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="170.27249999999998" y="160.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="170.27249999999998" dy="-3.9000000000000012">html2canvas 快照</tspan><tspan x="170.27249999999998" dy="16.900000000000002">(遍历计算后样式并绘制到 Canvas)</tspan></text>
</g>
<g class="node" data-id="C" data-label="Canvas 按 2x 放大绘制
(Retina 高分屏适配)" data-shape="rectangle">
  <rect x="78.53199999999998" y="227.60000000000002" width="183.481" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="170.27249999999998" y="254.50000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="170.27249999999998" dy="-3.9000000000000012">Canvas 按 2x 放大绘制</tspan><tspan x="170.27249999999998" dy="16.900000000000002">(Retina 高分屏适配)</tspan></text>
</g>
<g class="node" data-id="D" data-label="canvas.toDataURL('image/png')
生成 base64" data-shape="rectangle">
  <rect x="57.043000000000006" y="321.40000000000003" width="226.45899999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="170.27249999999998" y="348.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="170.27249999999998" dy="-3.9000000000000012">canvas.toDataURL(&#39;image/png&#39;)</tspan><tspan x="170.27249999999998" dy="16.900000000000002">生成 base64</tspan></text>
</g>
<g class="node" data-id="E" data-label="创建 a 标签的 download 属性
触发浏览器保存图片" data-shape="rectangle">
  <rect x="61.11849999999998" y="415.20000000000005" width="218.308" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="170.27249999999998" y="442.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="170.27249999999998" dy="-3.9000000000000012">创建 a 标签的 download 属性</tspan><tspan x="170.27249999999998" dy="16.900000000000002">触发浏览器保存图片</tspan></text>
</g>
</svg>