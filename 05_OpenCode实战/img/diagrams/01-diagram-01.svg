<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712.442 460.5" width="712.442" height="460.5" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Core" data-label="OpenCode 统一底层核心 (OpenCode Core)">
  <rect x="65.64000000000001" y="36" width="581.1619999999999" height="206.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="65.64000000000001" y="36" width="581.1619999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="77.64000000000001" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">OpenCode 统一底层核心 (OpenCode Core)</text>
</g>
<g class="subgraph" data-id="Client" data-label="双端协同交互形态">
  <rect x="36" y="310.70000000000005" width="640.442" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="310.70000000000005" width="640.442" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="324.70000000000005" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">双端协同交互形态</text>
</g>
<polyline class="edge" data-from="Engine" data-to="CLI" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="357.703,226.70000000000002 357.703,290.70000000000005 192.64649999999997,290.70000000000005 192.64649999999997,354.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Engine" data-to="Desktop" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="357.703,226.70000000000002 357.703,290.70000000000005 513.8675000000001,290.70000000000005 513.8675000000001,354.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Config" data-to="Engine" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="211.9125,142.25 211.9125,166.025 357.703,166.025 357.703,189.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Router" data-to="Engine" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="503.4934999999999,125.35000000000001 503.4934999999999,166.025 357.703,166.025 357.703,189.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Config" data-label="全局配置文件
(~/.config/opencode/opencode.jsonc)" data-shape="rectangle">
  <rect x="81.64000000000001" y="88.45" width="260.54499999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="211.9125" y="115.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="211.9125" dy="-3.9000000000000012">全局配置文件</tspan><tspan x="211.9125" dy="16.900000000000002">(~/.config/opencode/opencode.jsonc)</tspan></text>
</g>
<g class="node" data-id="Engine" data-label="智能体调度引擎 &amp; 沙箱执行器" data-shape="rectangle">
  <rect x="241.88" y="189.8" width="231.646" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="357.703" y="208.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">智能体调度引擎 &amp; 沙箱执行器</text>
</g>
<g class="node" data-id="Router" data-label="多模型中转路由 &amp; MCP/Skills 外挂" data-shape="rectangle">
  <rect x="376.18499999999995" y="88.45" width="254.61699999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="503.4934999999999" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">多模型中转路由 &amp; MCP/Skills 外挂</text>
</g>
<g class="node" data-id="CLI" data-label="OpenCode CLI
(命令行极速黑客模式 / 远程 SSH 友好)" data-shape="rectangle">
  <rect x="52" y="354.70000000000005" width="281.29299999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="192.64649999999997" y="381.6" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="192.64649999999997" dy="-3.9000000000000012">OpenCode CLI</tspan><tspan x="192.64649999999997" dy="16.900000000000002">(命令行极速黑客模式 / 远程 SSH 友好)</tspan></text>
</g>
<g class="node" data-id="Desktop" data-label="OpenCode Desktop
(图形化驾驶舱 / 可视化 Diff / 沉浸式交互)" data-shape="rectangle">
  <rect x="367.293" y="354.70000000000005" width="293.149" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="513.8675000000001" y="381.6" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="513.8675000000001" dy="-3.9000000000000012">OpenCode Desktop</tspan><tspan x="513.8675000000001" dy="16.900000000000002">(图形化驾驶舱 / 可视化 Diff / 沉浸式交互)</tspan></text>
</g>
</svg>