  <rect x="622.256" y="218.9" width="335.386" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="789.949" y="237.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">周末 48 小时极速交付生产级 SaaS 并上线收款</text>
