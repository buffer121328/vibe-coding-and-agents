  <text x="112.6185" y="237.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">好点子 (Idea)</text>
</g>
<g class="node" data-id="S2" data-label="1 个懂业务的产品经理/独立开发者 + 3 个 AI Agent" data-shape="rectangle">
  <rect x="225.237" y="218.9" width="345.01899999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="397.74649999999997" y="237.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">1 个懂业务的产品经理/独立开发者 + 3 个 AI Agent</text>
