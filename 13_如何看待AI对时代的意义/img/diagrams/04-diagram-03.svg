<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436.42199999999997 497.00000000000006" width="436.42199999999997" height="497.00000000000006" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="PersonalMoat" data-label="🛡️ 抵抗 AI 浪潮冲击的五大硬核护城河">
  <rect x="36" y="36" width="364.42199999999997" height="425.00000000000006" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="364.42199999999997" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🛡️ 抵抗 AI 浪潮冲击的五大硬核护城河</text>
</g>
<g class="node" data-id="M1" data-label="1. 高质量的底层技术硬功
(高并发/分布式事务/内核调优/极端排障)" data-shape="rectangle">
  <rect x="63.4855" y="157.8" width="297.59499999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="212.283" y="184.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="212.283" dy="-3.9000000000000012">1. 高质量的底层技术硬功</tspan><tspan x="212.283" dy="16.900000000000002">(高并发/分布式事务/内核调优/极端排障)</tspan></text>
</g>
<g class="node" data-id="M2" data-label="2. 思想架构与系统品味 (Taste)
(优雅解耦/边界划分/知道什么是好代码)" data-shape="rectangle">
  <rect x="63.4855" y="235.60000000000002" width="293.89" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="210.4305" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="210.4305" dy="-3.9000000000000012">2. 思想架构与系统品味 (Taste)</tspan><tspan x="210.4305" dy="16.900000000000002">(优雅解耦/边界划分/知道什么是好代码)</tspan></text>
</g>
<g class="node" data-id="M3" data-label="3. 第一性原理思维 (First Principles)
(穿透花哨术语，直击物理与数学本质)" data-shape="rectangle">
  <rect x="63.4855" y="80" width="286.47999999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="206.72549999999998" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="206.72549999999998" dy="-3.9000000000000012">3. 第一性原理思维 (First Principles)</tspan><tspan x="206.72549999999998" dy="16.900000000000002">(穿透花哨术语，直击物理与数学本质)</tspan></text>
</g>
<g class="node" data-id="M4" data-label="4. 对抗性批判思考 (Adversarial Thinking)
(挑剔 AI 幻觉，识别微妙逻辑漏洞与安全隐患)" data-shape="rectangle">
  <rect x="63.4855" y="313.40000000000003" width="332.42199999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="229.6965" y="340.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="229.6965" dy="-3.9000000000000012">4. 对抗性批判思考 (Adversarial Thinking)</tspan><tspan x="229.6965" dy="16.900000000000002">(挑剔 AI 幻觉，识别微妙逻辑漏洞与安全隐患)</tspan></text>
</g>
<g class="node" data-id="M5" data-label="5. 真实商业洞察与人性的温度 (Empathy)
(理解用户真实委屈与痛点，商业闭环能力)" data-shape="rectangle">
  <rect x="63.4855" y="391.20000000000005" width="316.11999999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="221.54549999999998" y="418.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="221.54549999999998" dy="-3.9000000000000012">5. 真实商业洞察与人性的温度 (Empathy)</tspan><tspan x="221.54549999999998" dy="16.900000000000002">(理解用户真实委屈与痛点，商业闭环能力)</tspan></text>
</g>
</svg>