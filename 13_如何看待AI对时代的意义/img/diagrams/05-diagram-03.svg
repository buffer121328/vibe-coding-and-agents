<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479.4 497.00000000000006" width="479.4" height="497.00000000000006" style="--bg:#282a36;--fg:#f8f8f2;--line:#6272a4;--accent:#bd93f9;--muted:#6272a4;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Principles" data-label="🛡️ AI 时代五条不变的红线心法">
  <rect x="36" y="36" width="407.4" height="425.00000000000006" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="407.4" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🛡️ AI 时代五条不变的红线心法</text>
</g>
<g class="node" data-id="P1" data-label="1. 违法的不碰
(法律是最低底线，刑法/网安法/个保法/深合成规定)" data-shape="rectangle">
  <rect x="63.11500000000001" y="157.8" width="371.69499999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="248.96249999999998" y="184.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="248.96249999999998" dy="-3.9000000000000012">1. 违法的不碰</tspan><tspan x="248.96249999999998" dy="16.900000000000002">(法律是最低底线，刑法/网安法/个保法/深合成规定)</tspan></text>
</g>
<g class="node" data-id="P2" data-label="2. 害人的不碰
(攻击他人系统、伤害他人身心的工具再强大也不用)" data-shape="rectangle">
  <rect x="63.11500000000001" y="235.60000000000002" width="375.4" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="250.815" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="250.815" dy="-3.9000000000000012">2. 害人的不碰</tspan><tspan x="250.815" dy="16.900000000000002">(攻击他人系统、伤害他人身心的工具再强大也不用)</tspan></text>
</g>
<g class="node" data-id="P3" data-label="3. 骗人的不碰
(造假、造谣、深度伪造误导，迟早反噬自己)" data-shape="rectangle">
  <rect x="63.11500000000001" y="80" width="330.93999999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="228.58499999999998" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="228.58499999999998" dy="-3.9000000000000012">3. 骗人的不碰</tspan><tspan x="228.58499999999998" dy="16.900000000000002">(造假、造谣、深度伪造误导，迟早反噬自己)</tspan></text>
</g>
<g class="node" data-id="P4" data-label="4. 让人上瘾/失控的不碰
(成瘾设计、情感操纵，长期是双输)" data-shape="rectangle">
  <rect x="103.87" y="313.40000000000003" width="271.65999999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="239.7" y="340.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="239.7" dy="-3.9000000000000012">4. 让人上瘾/失控的不碰</tspan><tspan x="239.7" dy="16.900000000000002">(成瘾设计、情感操纵，长期是双输)</tspan></text>
</g>
<g class="node" data-id="P5" data-label="5. 拿不准时，先问、别先做
(不确定是否越线，就是还没到该动手的时候)" data-shape="rectangle">
  <rect x="63.11500000000001" y="391.20000000000005" width="330.93999999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="228.58499999999998" y="418.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="228.58499999999998" dy="-3.9000000000000012">5. 拿不准时，先问、别先做</tspan><tspan x="228.58499999999998" dy="16.900000000000002">(不确定是否越线，就是还没到该动手的时候)</tspan></text>
</g>
</svg>