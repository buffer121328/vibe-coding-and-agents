<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486.80999999999995 515.2" width="486.80999999999995" height="515.2" style="--bg:#282a36;--fg:#f8f8f2;--line:#6272a4;--accent:#bd93f9;--muted:#6272a4;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="AnxietyFunnel" data-label="🌪️ 焦虑营销割韭菜的标准商业四步法">
  <rect x="36" y="36" width="414.80999999999995" height="443.20000000000005" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="414.80999999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🌪️ 焦虑营销割韭菜的标准商业四步法</text>
</g>
<polyline class="edge" data-from="F1" data-to="F2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="243.40499999999997,133.8 243.40499999999997,189.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="F2" data-to="F3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="243.40499999999997,243.60000000000002 243.40499999999997,299.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="F3" data-to="F4" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="243.40499999999997,353.40000000000003 243.40499999999997,409.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="F1" data-label="第一步：极度夸大危机
'AI 明天就会消灭 90% 岗位，你马上就要失业！'" data-shape="rectangle">
  <rect x="72.3775" y="80" width="342.05499999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="243.40499999999997" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="243.40499999999997" dy="-3.9000000000000012">第一步：极度夸大危机</tspan><tspan x="243.40499999999997" dy="16.900000000000002">&#39;AI 明天就会消灭 90% 岗位，你马上就要失业！&#39;</tspan></text>
</g>
<g class="node" data-id="F2" data-label="第二步：摧毁专业自信
'你过去学的所有算法、语法、架构全部作废了！'" data-shape="rectangle">
  <rect x="63.855999999999995" y="189.8" width="359.09799999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="243.40499999999997" y="216.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="243.40499999999997" dy="-3.9000000000000012">第二步：摧毁专业自信</tspan><tspan x="243.40499999999997" dy="16.900000000000002">&#39;你过去学的所有算法、语法、架构全部作废了！&#39;</tspan></text>
</g>
<g class="node" data-id="F3" data-label="第三步：抛出虚假稻草
'加入我的三天速成密训营 / 购买 999 元核心资料包'" data-shape="rectangle">
  <rect x="61.26249999999999" y="299.6" width="364.28499999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="243.40499999999997" y="326.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="243.40499999999997" dy="-3.9000000000000012">第三步：抛出虚假稻草</tspan><tspan x="243.40499999999997" dy="16.900000000000002">&#39;加入我的三天速成密训营 / 购买 999 元核心资料包&#39;</tspan></text>
</g>
<g class="node" data-id="F4" data-label="第四步：收割变现完成
打开一看全是东拼西凑的百度百科与通用提示词清单" data-shape="rectangle">
  <rect x="52" y="409.40000000000003" width="382.80999999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="243.40499999999997" y="436.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="243.40499999999997" dy="-3.9000000000000012">第四步：收割变现完成</tspan><tspan x="243.40499999999997" dy="16.900000000000002">打开一看全是东拼西凑的百度百科与通用提示词清单</tspan></text>
</g>
</svg>