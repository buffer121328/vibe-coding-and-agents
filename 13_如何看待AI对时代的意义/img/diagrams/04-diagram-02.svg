<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420.11999999999995 315.4" width="420.11999999999995" height="315.4" style="--bg:#282a36;--fg:#f8f8f2;--line:#6272a4;--accent:#bd93f9;--muted:#6272a4;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Extremes" data-label="⚠️ AI 时代的两大认知误区">
  <rect x="36" y="36" width="348.11999999999995" height="243.4" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="348.11999999999995" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">⚠️ AI 时代的两大认知误区</text>
</g>
<g class="node" data-id="E1" data-label="❌ 极端一：傲慢与排斥
'AI 写的全是垃圾，我坚决不用！'
(结果：被善用工具的高效同行降维打击)" data-shape="rectangle">
  <rect x="55.705" y="80" width="301.29999999999995" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="206.35499999999996" y="115.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="206.35499999999996" dy="-12.350000000000001">❌ 极端一：傲慢与排斥</tspan><tspan x="206.35499999999996" dy="16.900000000000002">&#39;AI 写的全是垃圾，我坚决不用！&#39;</tspan><tspan x="206.35499999999996" dy="16.900000000000002">(结果：被善用工具的高效同行降维打击)</tspan></text>
</g>
<g class="node" data-id="E2" data-label="❌ 极端二：迷信与盲从
'AI 无所不能，我什么底层都不用学了！'
(结果：变成毫无排障与审查能力的空心人)" data-shape="rectangle">
  <rect x="55.705" y="192.7" width="316.11999999999995" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="213.765" y="228.04999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="213.765" dy="-12.350000000000001">❌ 极端二：迷信与盲从</tspan><tspan x="213.765" dy="16.900000000000002">&#39;AI 无所不能，我什么底层都不用学了！&#39;</tspan><tspan x="213.765" dy="16.900000000000002">(结果：变成毫无排障与审查能力的空心人)</tspan></text>
</g>
</svg>