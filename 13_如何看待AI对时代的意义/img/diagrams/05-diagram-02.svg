  <text x="214.69124999999997" y="340.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="214.69124999999997" dy="-3.9000000000000012">4. 深度伪造用于敲诈/羞辱</tspan><tspan x="214.69124999999997" dy="16.900000000000002">(AI 换脸生成不雅内容勒索、泼脏水)</tspan></text>
</g>
