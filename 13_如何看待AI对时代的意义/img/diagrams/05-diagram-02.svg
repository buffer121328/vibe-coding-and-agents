  <rect x="79.23174999999999" y="391.20000000000005" width="359.83899999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="259.15124999999995" y="418.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="259.15124999999995" dy="-3.9000000000000012">5. 操纵他人决策谋私利</tspan><tspan x="259.15124999999995" dy="16.900000000000002">(AI 批量生成好评差评、虚假口碑、操纵投资情绪)</tspan></text>
</g>
</svg>