  <text x="262.85624999999993" y="184.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="262.85624999999993" dy="-3.9000000000000012">1. 歧视性决策</tspan><tspan x="262.85624999999993" dy="16.900000000000002">(AI 筛简历搞性别/地域/年龄歧视、算法歧视性定价)</tspan></text>
</g>
