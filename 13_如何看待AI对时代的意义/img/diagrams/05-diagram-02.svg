  <text x="269.15475" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="269.15475" dy="-3.9000000000000012">2. 情感操纵与成瘾设计</tspan><tspan x="269.15475" dy="16.900000000000002">(AI 诱导未成年人沉迷、用&#39;AI 恋人&#39;情感操控索取财物)</tspan></text>
