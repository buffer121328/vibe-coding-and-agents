<polyline class="edge" data-from="Part2" data-to="Part3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="330.84299999999996,319.6 330.84299999999996,375.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Part3" data-to="Part4" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="330.84299999999996,489.40000000000003 330.84299999999996,545.4000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
