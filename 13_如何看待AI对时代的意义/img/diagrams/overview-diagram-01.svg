  <rect x="89.352" y="205.8" width="482.9819999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="101.352" y="219.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">第二部分：理性反思 —— 结构性阵痛与岗位洗牌</text>
