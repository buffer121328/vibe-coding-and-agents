  <text x="290.38874999999996" y="172.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="290.38874999999996" dy="-3.9000000000000012">🧠 LLM + with_structured_output()</tspan><tspan x="290.38874999999996" dy="16.900000000000002">(底座 Function Calling 强制结构化)</tspan></text>
</g>
<g class="node" data-id="Output" data-label="✅ 强类型 Python 对象 (Pydantic Instance)
