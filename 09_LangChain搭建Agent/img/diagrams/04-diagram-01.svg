  <rect x="142.33225000000004" y="255.60000000000002" width="296.1129999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="290.38874999999996" y="282.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="290.38874999999996" dy="-3.9000000000000012">✅ 强类型 Python 对象 (Pydantic Instance)</tspan><tspan x="290.38874999999996" dy="16.900000000000002">data.company_name / data.sentiment_score</tspan></text>
</g>
<g class="node" data-id="Downstream" data-label="💾 直接入库 (PostgreSQL / Redis / 业务 API)" data-shape="rectangle">
  <rect x="137.88625000000002" y="365.40000000000003" width="305.00499999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="290.38874999999996" y="383.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">💾 直接入库 (PostgreSQL / Redis / 业务 API)</text>
