<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 593.7449999999999 438.3" width="593.7449999999999" height="438.3" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Raw" data-to="LLM" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="151.4525,89.80000000000001 151.4525,117.80000000000001 290.38874999999996,117.80000000000001 290.38874999999996,145.8" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Schema" data-to="LLM" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="429.32499999999993,89.80000000000001 429.32499999999993,117.80000000000001 290.38874999999996,117.80000000000001 290.38874999999996,145.8" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="LLM" data-to="Output" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="290.38874999999996,199.60000000000002 290.38874999999996,255.60000000000002" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Output" data-to="Downstream" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="290.38874999999996,309.40000000000003 290.38874999999996,365.40000000000003" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<g class="node" data-id="Raw" data-label="📰 非结构化原始文本
(长篇财报新闻/用户嘈杂留言)" data-shape="rectangle">
  <rect x="36" y="36" width="230.90499999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="151.4525" y="62.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="151.4525" dy="-3.9000000000000012">📰 非结构化原始文本</tspan><tspan x="151.4525" dy="16.900000000000002">(长篇财报新闻/用户嘈杂留言)</tspan></text>
</g>
<g class="node" data-id="Schema" data-label="📋 Pydantic BaseModel
