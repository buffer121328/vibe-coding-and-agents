  <rect x="300.905" y="36" width="256.84" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="429.32499999999993" y="62.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="429.32499999999993" dy="-3.9000000000000012">📋 Pydantic BaseModel</tspan><tspan x="429.32499999999993" dy="16.900000000000002">(定义字段、类型注解、数值边界)</tspan></text>
</g>
