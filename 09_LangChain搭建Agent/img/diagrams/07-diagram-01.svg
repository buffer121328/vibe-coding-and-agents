<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1722 343.6" width="1722" height="343.6" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="LLMLifecycle" data-label="🔄 LLM / Agent 执行生命周期事件流">
  <rect x="20" y="-8" width="630" height="327.6" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="20" y="-8" width="630" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="32" y="6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">🔄 LLM / Agent 执行生命周期事件流</text>
</g>
<g class="subgraph" data-id="CustomCallbacks" data-label="🔍 BaseCallbackHandler 监听探针">
  <rect x="674" y="-8" width="1024" height="113.8" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="674" y="-8" width="1024" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="686" y="6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">🔍 BaseCallbackHandler 监听探针</text>
</g>
<polyline class="edge" data-from="E1" data-to="E2" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="335,72.9 335,127.35000000000001 204.5,127.35000000000001 204.5,181.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E2" data-to="E3" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="204.5,218.70000000000002 204.5,242.70000000000005 335,242.70000000000005 335,266.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E1" data-to="E4" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="335,72.9 335,127.35000000000001 515.5,127.35000000000001 515.5,181.8" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="E1" data-to="E4" data-label="异常">
  <rect x="407.25" y="116.35000000000001" width="36" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="425.25" y="127.35000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">异常</text>
</g>
<polyline class="edge" data-from="LLMLifecycle" data-to="CustomCallbacks" data-style="thick" data-arrow-start="true" data-arrow-end="true" points="650,40 674,40" fill="none" stroke="var(--_line)" stroke-width="2" marker-start="url(#arrowhead-start)" marker-end="url(#arrowhead)" />
<g class="node" data-id="E1" data-label="1. on_llm_start (发起请求，触发敏感信息脱敏与计时)" data-shape="rectangle">
  <rect x="156.5" y="36" width="357" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="335" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="335" dy="4.55">1. on_llm_start (发起请求，触发敏感信息脱敏与计时)</tspan></text>
</g>
<g class="node" data-id="E2" data-label="2. on_tool_start / end (工具调用拦截与参数审计)" data-shape="rectangle">
  <rect x="36" y="181.8" width="337" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="204.5" y="200.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="204.5" dy="4.55">2. on_tool_start / end (工具调用拦截与参数审计)</tspan></text>
</g>
<g class="node" data-id="E3" data-label="3. on_llm_end (请求完毕，捕获 Token 消耗与计费)" data-shape="rectangle">
  <rect x="161" y="266.70000000000005" width="348" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="335" y="285.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="335" dy="4.55">3. on_llm_end (请求完毕，捕获 Token 消耗与计费)</tspan></text>
</g>
<g class="node" data-id="E4" data-label="4. on_llm_error (异常捕获与报警)" data-shape="rectangle">
  <rect x="397" y="181.8" width="237" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="515.5" y="200.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="515.5" dy="4.55">4. on_llm_error (异常捕获与报警)</tspan></text>
</g>
<g class="node" data-id="C1" data-label="📊 PerformanceAndCostCallback (耗时与 Token 账单)" data-shape="rectangle">
  <rect x="690" y="36" width="379" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="879.5" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="879.5" dy="4.55">📊 PerformanceAndCostCallback (耗时与 Token 账单)</tspan></text>
</g>
<g class="node" data-id="C2" data-label="🛡️ SensitiveDataRedactCallback (隐私正则脱敏)" data-shape="rectangle">
  <rect x="1093" y="36" width="340" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1263" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1263" dy="4.55">🛡️ SensitiveDataRedactCallback (隐私正则脱敏)</tspan></text>
</g>
<g class="node" data-id="C3" data-label="🎛️ AgentMiddleware 观测钩子\n(before_model / after_model)" data-shape="rectangle">
  <rect x="1457" y="36" width="225" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1569.5" y="62.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1569.5" dy="-3.8999999999999995">🎛️ AgentMiddleware 观测钩子</tspan><tspan x="1569.5" dy="16.9">(before_model / after_model)</tspan></text>
</g>
</svg>
