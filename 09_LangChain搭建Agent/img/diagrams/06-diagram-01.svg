  <text x="188.79749999999999" y="292.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="188.79749999999999" dy="-3.9000000000000012">✂️ trim_messages 智能滑动窗口裁剪</tspan><tspan x="188.79749999999999" dy="16.900000000000002">(保留 System 指令 + 裁剪最早多余 Token)</tspan></text>
</g>
