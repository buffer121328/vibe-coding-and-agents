<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554.3245 436.5" width="554.3245" height="436.5" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="CheckpointStore" data-label="🗄️ Checkpointer 会话隔离存储库">
  <rect x="82.9095" y="122.9" width="409.62399999999997" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="82.9095" y="122.9" width="409.62399999999997" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="94.9095" y="136.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🗄️ Checkpointer 会话隔离存储库</text>
</g>
<polyline class="edge" data-from="Trim" data-to="Agent" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="188.7975,319.6 188.7975,359.6" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="U1" data-to="H1" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="169.161,76.9 169.161,104.9 188.7975,104.9 188.7975,166.9" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="U2" data-to="H2" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="409.246,76.9 409.246,104.9 389.6095,104.9 389.6095,166.9" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="H1" data-to="Trim" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="188.79749999999999,203.8 188.7975,265.8" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
