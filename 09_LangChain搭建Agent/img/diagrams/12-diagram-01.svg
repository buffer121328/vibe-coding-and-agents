  <rect x="40" y="376.5" width="240.67499999999998" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="390.5" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🤖 Agent 执行</text>
</g>
<g class="subgraph" data-id="Output" data-label="🚪 输出侧 (确定性 + 模型性护栏)">
