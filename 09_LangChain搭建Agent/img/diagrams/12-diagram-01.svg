<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300.11795806884766 862.8" width="300.11795806884766" height="862.8" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Input" data-label="🚪 输入侧 (确定性护栏)">
  <rect x="20" y="-8" width="221" height="300.5" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="20" y="-8" width="221" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="32" y="6" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">🚪 输入侧 (确定性护栏)</text>
</g>
<g class="subgraph" data-id="Core" data-label="🤖 Agent 执行">
  <rect x="20" y="324.5" width="236" height="198.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="20" y="324.5" width="236" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="32" y="338.5" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">🤖 Agent 执行</text>
</g>
<g class="subgraph" data-id="Output" data-label="🚪 输出侧 (确定性 + 模型性护栏)">
  <rect x="26.117958068847656" y="555.2" width="234" height="283.5999999999999" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="26.117958068847656" y="555.2" width="234" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="38.117958068847656" y="569.2" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.2">🚪 输出侧 (确定性 + 模型性护栏)</text>
</g>
<polyline class="edge" data-from="IN" data-to="BF" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="130.5,72.9 130.5,120.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="BF" data-to="PII1" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="130.5,174.7 130.5,222.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="PII1" data-to="AG" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="130.5,276.5 130.5,322.5 272,322.5 272,386.95 203,386.95" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="AG" data-to="HITL" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="138,405.4 138,453.4" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="HITL" data-to="PII2" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="138,507.2 138,553.2 276.11795806884766,553.2 276.11795806884766,617.6500000000001 233.61795806884766,617.6500000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="PII2" data-to="AF" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="143.11795806884766,636.1 143.11795806884766,684.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="AF" data-to="OUT" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="143.11795806884766,737.9 143.11795806884766,785.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="IN" data-label="用户输入" data-shape="rectangle">
  <rect x="85.5" y="36" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="130.5" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="130.5" dy="4.55">用户输入</tspan></text>
</g>
<g class="node" data-id="BF" data-label="before_agent 黑名单拦截\n(关键词命中即收尾)" data-shape="rectangle">
  <rect x="36" y="120.9" width="189" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="130.5" y="147.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="130.5" dy="-3.8999999999999995">before_agent 黑名单拦截</tspan><tspan x="130.5" dy="16.9">(关键词命中即收尾)</tspan></text>
</g>
<g class="node" data-id="PII1" data-label="PIIMiddleware 输入脱敏\n(邮箱/信用卡/API Key)" data-shape="rectangle">
  <rect x="40" y="222.7" width="181" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="130.5" y="249.6" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="130.5" dy="-3.8999999999999995">PIIMiddleware 输入脱敏</tspan><tspan x="130.5" dy="16.9">(邮箱/信用卡/API Key)</tspan></text>
</g>
<g class="node" data-id="AG" data-label="模型 + 工具调用" data-shape="rectangle">
  <rect x="73" y="368.5" width="130" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="138" y="386.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="138" dy="4.55">模型 + 工具调用</tspan></text>
</g>
<g class="node" data-id="HITL" data-label="HumanInTheLoop 高危审批\n(发邮件/删库需人工签字)" data-shape="rectangle">
  <rect x="36" y="453.4" width="204" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="138" y="480.29999999999995" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="138" dy="-3.8999999999999995">HumanInTheLoop 高危审批</tspan><tspan x="138" dy="16.9">(发邮件/删库需人工签字)</tspan></text>
</g>
<g class="node" data-id="PII2" data-label="PIIMiddleware 输出脱敏" data-shape="rectangle">
  <rect x="52.617958068847656" y="599.2" width="181" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="143.11795806884766" y="617.6500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="143.11795806884766" dy="4.55">PIIMiddleware 输出脱敏</tspan></text>
</g>
<g class="node" data-id="AF" data-label="after_agent 安全复核\n(LLM 判定 SAFE/UNSAFE)" data-shape="rectangle">
  <rect x="42.117958068847656" y="684.1" width="202" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="143.11795806884766" y="711" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="143.11795806884766" dy="-3.8999999999999995">after_agent 安全复核</tspan><tspan x="143.11795806884766" dy="16.9">(LLM 判定 SAFE/UNSAFE)</tspan></text>
</g>
<g class="node" data-id="OUT" data-label="最终回复" data-shape="rectangle">
  <rect x="98.11795806884766" y="785.9" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="143.11795806884766" y="804.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="143.11795806884766" dy="4.55">最终回复</tspan></text>
</g>
</svg>
