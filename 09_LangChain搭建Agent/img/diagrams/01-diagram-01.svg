  <text x="541.6524999999999" y="404.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">DeepSeek / 火山方舟</text>
</g>
<g class="node" data-id="M3" data-label="Anthropic (Claude 系列)" data-shape="rectangle">
  <rect x="52" y="385.8" width="182.73999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="143.37" y="404.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Anthropic (Claude 系列)</text>
</g>
