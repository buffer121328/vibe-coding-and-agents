  <rect x="661.4649999999999" y="385.8" width="149.39499999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="736.1624999999999" y="404.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">本地 SLM / Ollama</text>
