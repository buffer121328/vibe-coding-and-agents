<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840.8599999999999 450.7" width="840.8599999999999" height="450.7" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="UserLayer" data-label="👤 开发者调用层">
  <rect x="264.15399999999994" y="40" width="312.552" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="264.15399999999994" y="40" width="312.552" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="276.15399999999994" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">👤 开发者调用层</text>
</g>
<g class="subgraph" data-id="CoreLayer" data-label="🧩 LangChain 1.0 标准化抽象层 (langchain-core)">
  <rect x="56.67249999999996" y="176.9" width="727.515" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="56.67249999999996" y="176.9" width="727.515" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="68.67249999999996" y="190.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🧩 LangChain 1.0 标准化抽象层 (langchain-core)</text>
</g>
<g class="subgraph" data-id="ProviderLayer" data-label="🌐 底层多厂商模型层 (OpenAI / DeepSeek / Anthropic / Gemini / Ollama)">
  <rect x="40" y="313.8" width="760.8599999999999" height="96.9" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="313.8" width="760.8599999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="327.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">🌐 底层多厂商模型层 (OpenAI / DeepSeek / Anthropic / Gemini / Ollama)</text>
</g>
<polyline class="edge" data-from="UserLayer" data-to="CoreLayer" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="420.42999999999995,136.9 420.42999999999995,176.9" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="CoreLayer" data-to="ProviderLayer" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="420.42999999999995,273.8 420.42999999999995,313.8" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
