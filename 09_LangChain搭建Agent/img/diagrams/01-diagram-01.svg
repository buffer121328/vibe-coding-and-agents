  <text x="545.3575" y="251.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">ChatPromptTemplate</text>
</g>
<g class="node" data-id="Parser" data-label="OutputParser" data-shape="rectangle">
  <rect x="68.67249999999996" y="232.9" width="121.978" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="129.66149999999996" y="251.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">OutputParser</text>
</g>
