  <text x="154.23594665527344" y="62.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="154.23594665527344" dy="-3.8999999999999995">before_agent</tspan><tspan x="154.23594665527344" dy="16.9">(启动前·每次调用一次)</tspan></text>
