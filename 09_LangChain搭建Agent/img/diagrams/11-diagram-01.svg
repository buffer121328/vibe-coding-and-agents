  <text x="154.23594665527344" y="368.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="154.23594665527344" dy="-3.8999999999999995">after_model</tspan><tspan x="154.23594665527344" dy="16.9">(模型响应后)</tspan></text>
</g>
<g class="node" data-id="TC" data-label="⚙️ 工具调用\nwrap_tool_call 包裹" data-shape="rectangle">
  <rect x="76.73594665527344" y="443.20000000000005" width="155" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="154.23594665527344" y="470.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="154.23594665527344" dy="-3.8999999999999995">⚙️ 工具调用</tspan><tspan x="154.23594665527344" dy="16.9">wrap_tool_call 包裹</tspan></text>
</g>
<g class="node" data-id="AA" data-label="after_agent\n(结束后·每次调用一次)" data-shape="rectangle">
  <rect x="69.23594665527344" y="545" width="170" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="154.23594665527344" y="571.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="154.23594665527344" dy="-3.8999999999999995">after_agent</tspan><tspan x="154.23594665527344" dy="16.9">(结束后·每次调用一次)</tspan></text>
</g>
