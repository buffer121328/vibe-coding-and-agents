<polyline class="edge" data-from="TC" data-to="BM" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="231.73594665527344,470.1 305.7078399658203,470.1 305.7078399658203,164.70000000000002 213.73594665527344,164.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="TC" data-to="BM" data-label="需要更多工具">
  <rect x="265.7078399658203" y="306.40000000000003" width="80" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
