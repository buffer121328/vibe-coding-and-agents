  <text x="154.23594665527344" y="164.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="154.23594665527344" dy="-3.8999999999999995">before_model</tspan><tspan x="154.23594665527344" dy="16.9">(模型调用前)</tspan></text>
</g>
