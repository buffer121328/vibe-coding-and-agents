  <rect x="69.23594665527344" y="239.60000000000002" width="170" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="154.23594665527344" y="266.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="154.23594665527344" dy="-3.8999999999999995">🧠 模型调用</tspan><tspan x="154.23594665527344" dy="16.9">wrap_model_call 包裹</tspan></text>
