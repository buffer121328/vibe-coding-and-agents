  <text x="528.0124999999999" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">通宵肉眼排错找 Bug</text>
</g>
<g class="node" data-id="B1" data-label="构思产品创意与功能" data-shape="rectangle">
  <rect x="56" y="204.9" width="175.32999999999998" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="143.665" y="223.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">构思产品创意与功能</text>
</g>
<g class="node" data-id="B2" data-label="输入清晰意图指挥 Agent" data-shape="rectangle">
  <rect x="271.33" y="204.9" width="196.81899999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="369.73949999999996" y="223.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">输入清晰意图指挥 Agent</text>
</g>
<g class="node" data-id="B3" data-label="直接看运行效果验收迭代" data-shape="rectangle">
  <rect x="508.14899999999994" y="204.9" width="204.96999999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="610.6339999999999" y="223.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">直接看运行效果验收迭代</text>
</g>
</svg>