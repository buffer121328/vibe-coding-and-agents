  <text x="321.945" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">手打繁琐套话代码</text>
</g>
<g class="node" data-id="A3" data-label="通宵肉眼排错找 Bug" data-shape="rectangle">
