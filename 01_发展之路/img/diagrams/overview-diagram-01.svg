  <rect x="63.41699999999997" y="255.60000000000002" width="379.10499999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="252.96949999999995" y="282.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="252.96949999999995" dy="-3.9000000000000012">3. AI 插件辅助时代</tspan><tspan x="252.96949999999995" dy="16.900000000000002">Copilot / Continue / 住在代码软件里 / 智能联想按 Tab 键</tspan></text>
</g>
<g class="node" data-id="D" data-label="4. Agent 自主编程时代
Cursor / Devin / Claude Code / 自带手脚 / 自己改多个文件跑测试" data-shape="rectangle">
  <rect x="36" y="365.40000000000003" width="433.9389999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="252.96949999999995" y="392.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="252.96949999999995" dy="-3.9000000000000012">4. Agent 自主编程时代</tspan><tspan x="252.96949999999995" dy="16.900000000000002">Cursor / Devin / Claude Code / 自带手脚 / 自己改多个文件跑测试</tspan></text>
</g>
<g class="node" data-id="E" data-label="5. 🌊 Vibe Coding 时代
Bolt.new / Lovable / Dify / 动嘴提需求当总指挥 / 几分钟出产品" data-shape="rectangle">
  <rect x="44.521499999999975" y="475.20000000000005" width="416.89599999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="252.96949999999995" y="502.1" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="252.96949999999995" dy="-3.9000000000000012">5. 🌊 Vibe Coding 时代</tspan><tspan x="252.96949999999995" dy="16.900000000000002">Bolt.new / Lovable / Dify / 动嘴提需求当总指挥 / 几分钟出产品</tspan></text>
</g>
</svg>