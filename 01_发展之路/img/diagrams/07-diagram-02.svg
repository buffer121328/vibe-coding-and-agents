<g class="node" data-id="A" data-label="意图要讲清楚 (Intent)" data-shape="rectangle">
  <rect x="97.90974999999999" y="40" width="171.62499999999997" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="183.72224999999997" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">意图要讲清楚 (Intent)</text>
</g>
