  <text x="179.60750000000002" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">人肉当侦探：一行行肉眼找茬</text>
</g>
<g class="node" data-id="F" data-label="去 Google / Stack Overflow 到处搜" data-shape="rectangle">
  <rect x="157.46400000000006" y="205.2" width="243.50199999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="279.21500000000003" y="223.64999999999998" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">去 Google / Stack Overflow 到处搜</text>
</g>
<g class="node" data-id="G" data-label="提交代码并庆祝上线" data-shape="rectangle">
  <rect x="201.50966666666667" y="560.2" width="175.32999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="289.17466666666667" y="578.6500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">提交代码并庆祝上线</text>
