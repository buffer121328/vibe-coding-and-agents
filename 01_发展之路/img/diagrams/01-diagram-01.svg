<polyline class="edge" data-from="E" data-to="F" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="依然找不到原因" points="218.70916666666668,72.9 218.70916666666668,116.9 279.21500000000003,116.9 279.21500000000003,205.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="F" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="279.21500000000003,242.1 279.21500000000003,270.1 404.628,270.1 404.628,298.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="G" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="奇迹般跑通" points="289.17466666666667,427.9 289.17466666666667,560.2" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="D" data-to="E" data-label="报错爆红 / 崩溃">
  <rect x="32" y="341.7" width="95.46400000000003" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="79.73200000000001" y="356.84999999999997" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">报错爆红 / 崩溃</text>
