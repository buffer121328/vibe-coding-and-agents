<g class="edge-label" data-from="T" data-to="R" data-label="低置信：全库并发兜底">
  <rect x="67.75" y="335.05" width="124" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="129.75" y="346.05" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">低置信：全库并发兜底</text>
</g>
<polyline class="edge" data-from="K" data-to="R" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="110,364.5 110,410.5 155.5,410.5 155.5,456.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
