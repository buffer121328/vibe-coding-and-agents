  <text x="155.5" y="474.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="155.5" dy="4.55">🧩 11.5 RRF 融合 + 重排统一裁决</tspan></text>
</g>
<g class="node" data-id="A" data-label="💡 上下文喂给 LLM 生成" data-shape="rectangle">
  <rect x="36" y="585.4" width="186" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="129" y="603.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="129" dy="4.55">💡 上下文喂给 LLM 生成</tspan></text>
</g>
<g class="node" data-id="S1" data-label="SPLADE 稀疏学习\n—— 会扩词的 BM25" data-shape="rectangle">
  <rect x="36" y="36" width="160" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="116" y="62.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="116" dy="-3.8999999999999995">SPLADE 稀疏学习</tspan><tspan x="116" dy="16.9">—— 会扩词的 BM25</tspan></text>
</g>
<g class="node" data-id="S2" data-label="ColBERT 迟交互\n—— 词级向量 + MaxSim" data-shape="rectangle">
  <rect x="220" y="36" width="187" height="53.8" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
