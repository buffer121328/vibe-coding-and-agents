<polyline class="edge" data-from="W" data-to="T" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="319.5,105.8 319.5,143.8 104,143.8 104,181.8" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="W" data-to="T" data-label="按需选用、先评测再迁移">
  <rect x="144.25" y="132.8" width="135" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="211.75" y="143.8" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">按需选用、先评测再迁移</text>
</g>
