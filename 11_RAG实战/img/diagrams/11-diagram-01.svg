  <text x="712.5" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="712.5" dy="4.55">❓ 用户问题</tspan></text>
</g>
<g class="node" data-id="T" data-label="🚦 多库分诊台\n(轻量语义分类器)" data-shape="diamond">
