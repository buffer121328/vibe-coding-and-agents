  <text x="104" y="208.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="104" dy="-3.8999999999999995">🚦 多库分诊台</tspan><tspan x="104" dy="16.9">(轻量语义分类器)</tspan></text>
