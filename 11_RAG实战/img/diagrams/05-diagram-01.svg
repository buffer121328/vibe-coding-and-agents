<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356.99799999999993 480.5" width="356.99799999999993" height="480.5" style="--bg:#1e1e2e;--fg:#cdd6f4;--line:#585b70;--accent:#cba6f7;--muted:#6c7086;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Q" data-to="M" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="178.49899999999997,72.9 178.49899999999997,128.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="M" data-to="F" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="178.49899999999997,165.8 178.49899999999997,221.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="F" data-to="P" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="178.49899999999997,258.70000000000005 178.49899999999997,314.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="P" data-to="O" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="178.49899999999997,351.6 178.49899999999997,407.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Q" data-label="❓ 用户问题" data-shape="rectangle">
  <rect x="119.36249999999997" y="36" width="118.273" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="178.49899999999997" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">❓ 用户问题</text>
</g>
<g class="node" data-id="M" data-label="多路召回 (Dense Top-20 + BM25 Top-20)" data-shape="rectangle">
  <rect x="36" y="128.9" width="284.99799999999993" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="178.49899999999997" y="147.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">多路召回 (Dense Top-20 + BM25 Top-20)</text>
</g>
<g class="node" data-id="F" data-label="RRF 融合粗排 (Top-10)" data-shape="rectangle">
  <rect x="89.72249999999998" y="221.8" width="177.55299999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="178.49899999999997" y="240.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">RRF 融合粗排 (Top-10)</text>
</g>
<g class="node" data-id="P" data-label="Cross-Encoder 重排精排 (Top-3)" data-shape="rectangle">
  <rect x="58.229999999999976" y="314.70000000000005" width="240.53799999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="178.49899999999997" y="333.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Cross-Encoder 重排精排 (Top-3)</text>
</g>
<g class="node" data-id="O" data-label="最终上下文喂给 LLM" data-shape="rectangle">
  <rect x="90.09299999999998" y="407.6" width="176.81199999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="178.49899999999997" y="426.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">最终上下文喂给 LLM</text>
</g>
</svg>