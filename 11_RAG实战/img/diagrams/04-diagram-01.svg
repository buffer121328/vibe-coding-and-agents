  <rect x="536.17" y="96.9" width="189.40899999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="630.8744999999999" y="123.80000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="630.8744999999999" dy="-3.9000000000000012">暴力扫描 KNN</tspan><tspan x="630.8744999999999" dy="16.900000000000002">100% 精确但慢，当基线</tspan></text>
</g>
</svg>