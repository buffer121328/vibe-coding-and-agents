  <text x="154.78699999999998" y="123.80000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="154.78699999999998" dy="-3.9000000000000012">HNSW (层次化可导航小世界图)</tspan><tspan x="154.78699999999998" dy="16.900000000000002">快 + 准，内存友好</tspan></text>
</g>
