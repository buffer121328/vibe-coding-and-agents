<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940.9010000000001 218.70000000000002" width="940.9010000000001" height="218.70000000000002" style="--bg:#1e1e2e;--fg:#cdd6f4;--line:#585b70;--accent:#cba6f7;--muted:#6c7086;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="S1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="470.821,72.9 470.821,84.9 172.9415,84.9 172.9415,96.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A" data-to="S2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="470.821,72.9 470.821,84.9 470.821,84.9 470.821,128.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A" data-to="S3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="470.821,72.9 470.821,84.9 768.33,84.9 768.33,96.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="🧠 Agentic RAG 范式" data-shape="rectangle">
  <rect x="388.7135" y="36" width="164.21499999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="470.821" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">🧠 Agentic RAG 范式</text>
</g>
<g class="node" data-id="S1" data-label="Self-RAG：边想边查边评
(反思 Token 控制是否检索/是否忠实)" data-shape="rectangle">
  <rect x="36" y="96.9" width="273.883" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="172.9415" y="123.80000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="172.9415" dy="-3.9000000000000012">Self-RAG：边想边查边评</tspan><tspan x="172.9415" dy="16.900000000000002">(反思 Token 控制是否检索/是否忠实)</tspan></text>
</g>
<g class="node" data-id="S2" data-label="CRAG：检索结果置信度分级
(正确/错误/模糊 → 提炼/联网/融合)" data-shape="rectangle">
  <rect x="343.88300000000004" y="128.9" width="253.87599999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="470.821" y="155.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="470.821" dy="-3.9000000000000012">CRAG：检索结果置信度分级</tspan><tspan x="470.821" dy="16.900000000000002">(正确/错误/模糊 → 提炼/联网/融合)</tspan></text>
</g>
<g class="node" data-id="S3" data-label="Adaptive RAG：按难度路由
(简单直接答 / 中等查一次 / 困难多跳)" data-shape="rectangle">
  <rect x="631.759" y="96.9" width="273.142" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="768.33" y="123.80000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="768.33" dy="-3.9000000000000012">Adaptive RAG：按难度路由</tspan><tspan x="768.33" dy="16.900000000000002">(简单直接答 / 中等查一次 / 困难多跳)</tspan></text>
</g>
</svg>