<polyline class="edge" data-from="CHOICE" data-to="A" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="124,218.70000000000002 124,264.70000000000005 139.5,264.70000000000005 139.5,310.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
