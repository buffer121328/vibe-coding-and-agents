<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398.631 377.40000000000003" width="398.631" height="377.40000000000003" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Channels" data-label="Dify 三大对外集成通道">
  <rect x="36" y="36" width="326.631" height="305.40000000000003" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="326.631" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Dify 三大对外集成通道</text>
</g>
<g class="node" data-id="C1" data-label="🖥️ Web App 独立免登录网页
(支持分享 / Iframe 嵌入 / 自定义域名)" data-shape="rectangle">
  <rect x="59.965749999999986" y="175.8" width="266.47299999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="193.20224999999996" y="202.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="193.20224999999996" dy="-3.9000000000000012">🖥️ Web App 独立免登录网页</tspan><tspan x="193.20224999999996" dy="16.900000000000002">(支持分享 / Iframe 嵌入 / 自定义域名)</tspan></text>
</g>
<g class="node" data-id="C2" data-label="🔌 后端服务 RESTful API
(支持 Python / Java / Go 微服务对接)" data-shape="rectangle">
  <rect x="59.965749999999986" y="271.6" width="262.76800000000003" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="191.34975" y="298.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="191.34975" dy="-3.9000000000000012">🔌 后端服务 RESTful API</tspan><tspan x="191.34975" dy="16.900000000000002">(支持 Python / Java / Go 微服务对接)</tspan></text>
</g>
<g class="node" data-id="C3" data-label="🤖 MCP 协议端点 (Model Context Protocol)
(支持 Cursor / Claude Code 等 Agent 直连)" data-shape="rectangle">
  <rect x="59.965749999999986" y="80" width="294.631" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="207.28124999999997" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="207.28124999999997" dy="-3.9000000000000012">🤖 MCP 协议端点 (Model Context Protocol)</tspan><tspan x="207.28124999999997" dy="16.900000000000002">(支持 Cursor / Claude Code 等 Agent 直连)</tspan></text>
</g>
</svg>