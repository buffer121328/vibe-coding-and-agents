  <text x="224.88" y="206.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="224.88" dy="-3.9000000000000012">改进方案专家</tspan><tspan x="224.88" dy="16.900000000000002">(知识盲区 + 最差回答剖析 + Action Items)</tspan></text>
