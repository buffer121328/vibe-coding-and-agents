<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432.566 420.5" width="432.566" height="420.5" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="TrapMatrix" data-label="工作流 5 大高频翻车陷阱">
  <rect x="40" y="40" width="352.566" height="340.5" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="352.566" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">工作流 5 大高频翻车陷阱</text>
</g>
<g class="node" data-id="T1" data-label="🚨 陷阱 1：状态死锁 (State Deadlock)" data-shape="rectangle">
  <rect x="69.7085" y="144.9" width="265.73199999999997" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="202.5745" y="163.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">🚨 陷阱 1：状态死锁 (State Deadlock)</text>
</g>
<g class="node" data-id="T2" data-label="💥 陷阱 2：沙箱 NoneType 运行时崩溃" data-shape="rectangle">
  <rect x="69.7085" y="205.8" width="283.51599999999996" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="211.4665" y="224.25" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">💥 陷阱 2：沙箱 NoneType 运行时崩溃</text>
</g>
<g class="node" data-id="T3" data-label="⚠️ 陷阱 3：HTML 实体与代码块污染插件" data-shape="rectangle">
  <rect x="69.7085" y="84" width="308.71" height="36.900000000000006" rx="0" ry="0" fill="#FFF4DC" stroke="#B47A1F" stroke-width="0.75" />
  <text x="224.06349999999998" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">⚠️ 陷阱 3：HTML 实体与代码块污染插件</text>
</g>
<g class="node" data-id="T4" data-label="❌ 陷阱 4：结构化输出 JSON Schema 违背" data-shape="rectangle">
  <rect x="69.7085" y="266.7" width="306.48699999999997" height="36.900000000000006" rx="0" ry="0" fill="#F0EBFA" stroke="#7357A6" stroke-width="0.75" />
  <text x="222.952" y="285.15" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">❌ 陷阱 4：结构化输出 JSON Schema 违背</text>
</g>
<g class="node" data-id="T5" data-label="⏳ 陷阱 5：多轮对话重复解析导致性能雪崩" data-shape="rectangle">
  <rect x="69.7085" y="327.6" width="320.566" height="36.900000000000006" rx="0" ry="0" fill="#FCE9E6" stroke="#B65C4A" stroke-width="0.75" />
  <text x="229.99149999999997" y="346.05" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">⏳ 陷阱 5：多轮对话重复解析导致性能雪崩</text>
</g>
</svg>