<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925.4689999999998 330.70000000000005" width="925.4689999999998" height="330.70000000000005" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="PlainText" data-label="传统纯文本生成 (不可控)">
  <rect x="40" y="40" width="391.09799999999996" height="250.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="391.09799999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">传统纯文本生成 (不可控)</text>
</g>
<g class="subgraph" data-id="StructuredMode" data-label="结构化输出模式 (100% 确定性)">
  <rect x="455.09799999999996" y="40" width="430.3709999999999" height="250.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="455.09799999999996" y="40" width="430.3709999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="467.09799999999996" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">结构化输出模式 (100% 确定性)</text>
</g>
<polyline class="edge" data-from="T1" data-to="T2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="235.54899999999998,120.9 235.54899999999998,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="T2" data-to="T3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="235.54899999999998,197.8 235.54899999999998,237.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S1" data-to="S2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="670.2834999999999,120.9 670.2834999999999,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="S2" data-to="S3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="670.2834999999999,197.8 670.2834999999999,237.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="T1" data-label="模型自由预测下一个 Token" data-shape="rectangle">
  <rect x="127.50649999999999" y="84" width="216.08499999999998" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="235.54899999999998" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">模型自由预测下一个 Token</text>
</g>
<g class="node" data-id="T2" data-label="可能输出标点、空格、客套话、Markdown 代码块" data-shape="rectangle">
  <rect x="56" y="160.9" width="359.09799999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="235.54899999999998" y="179.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">可能输出标点、空格、客套话、Markdown 代码块</text>
</g>
<g class="node" data-id="T3" data-label="下游程序解析概率性报错崩溃" data-shape="rectangle">
  <rect x="118.24399999999999" y="237.8" width="234.60999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="235.54899999999998" y="256.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">下游程序解析概率性报错崩溃</text>
</g>
<g class="node" data-id="S1" data-label="定义 JSON Schema 契约" data-shape="rectangle">
  <rect x="574.838" y="84" width="190.89099999999996" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="670.2835" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">定义 JSON Schema 契约</text>
</g>
<g class="node" data-id="S2" data-label="引擎在解码时强制将不符合 Schema 的 Token 概率置为 0" data-shape="rectangle">
  <rect x="471.09799999999996" y="160.9" width="398.3709999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="670.2834999999999" y="179.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">引擎在解码时强制将不符合 Schema 的 Token 概率置为 0</text>
</g>
<g class="node" data-id="S3" data-label="100% 输出符合类型约束的合法 JSON 数据对象" data-shape="rectangle">
  <rect x="503.70199999999994" y="237.8" width="333.16299999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="670.2834999999999" y="256.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">100% 输出符合类型约束的合法 JSON 数据对象</text>
</g>
</svg>