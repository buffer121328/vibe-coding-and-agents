<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 643.01 330.70000000000005" width="643.01" height="330.70000000000005" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Layers" data-label="Dify 平台三层全景架构">
  <rect x="40" y="40" width="563.01" height="250.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="563.01" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Dify 平台三层全景架构</text>
</g>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="321.505,120.9 321.505,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="321.505,197.8 321.505,237.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="顶层交互层 (Web Apps / SDK / RESTful API / Dify CLI)" data-shape="rectangle">
  <rect x="144.92000000000004" y="84" width="353.1699999999999" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="321.505" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">顶层交互层 (Web Apps / SDK / RESTful API / Dify CLI)</text>
</g>
<g class="node" data-id="B" data-label="核心引擎层 (Prompt 工程 / 工作流 Workflow / 知识库 RAG / Agent 闭环 / 插件市场)" data-shape="rectangle">
  <rect x="56" y="160.9" width="531.01" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="321.505" y="179.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">核心引擎层 (Prompt 工程 / 工作流 Workflow / 知识库 RAG / Agent 闭环 / 插件市场)</text>
</g>
<g class="node" data-id="C" data-label="底层基础设施 (大语言模型 OpenAI/Claude/DeepSeek / 向量数据库 / 容器沙箱)" data-shape="rectangle">
  <rect x="61.18700000000001" y="237.8" width="520.636" height="36.900000000000006" rx="0" ry="0" fill="#FFF4DC" stroke="#B47A1F" stroke-width="0.75" />
  <text x="321.505" y="256.25" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">底层基础设施 (大语言模型 OpenAI/Claude/DeepSeek / 向量数据库 / 容器沙箱)</text>
</g>
</svg>