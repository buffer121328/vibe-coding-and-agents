<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 525.342 341.40000000000003" width="525.342" height="341.40000000000003" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Dilemma" data-label="低代码平台的深水区工程矛盾">
  <rect x="36" y="36" width="453.342" height="269.40000000000003" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="453.342" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">低代码平台的深水区工程矛盾</text>
</g>
<g class="node" data-id="D1" data-label="🤖 单一 Agent 节点的黑盒不可控
(工具调用返回值结构不兼容 / 陷入 ReAct 死循环)" data-shape="rectangle">
  <rect x="93.31075000000001" y="157.8" width="349.465" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="268.04325" y="184.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="268.04325" dy="-3.9000000000000012">🤖 单一 Agent 节点的黑盒不可控</tspan><tspan x="268.04325" dy="16.900000000000002">(工具调用返回值结构不兼容 / 陷入 ReAct 死循环)</tspan></text>
</g>
<g class="node" data-id="D2" data-label="⛓️ LLM 间结构化输出类型断层
(后节点无法直读前节点 schema / 强校验报错)" data-shape="rectangle">
  <rect x="93.31075000000001" y="235.60000000000002" width="327.97599999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="257.29875" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="257.29875" dy="-3.9000000000000012">⛓️ LLM 间结构化输出类型断层</tspan><tspan x="257.29875" dy="16.900000000000002">(后节点无法直读前节点 schema / 强校验报错)</tspan></text>
</g>
<g class="node" data-id="D3" data-label="☁️ 云端 SaaS 的调试权缺失
(无法改动底层适配源码，只能靠在 DSL 中显式加节点兜底)" data-shape="rectangle">
  <rect x="52" y="80" width="421.342" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="262.671" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="262.671" dy="-3.9000000000000012">☁️ 云端 SaaS 的调试权缺失</tspan><tspan x="262.671" dy="16.900000000000002">(无法改动底层适配源码，只能靠在 DSL 中显式加节点兜底)</tspan></text>
</g>
</svg>