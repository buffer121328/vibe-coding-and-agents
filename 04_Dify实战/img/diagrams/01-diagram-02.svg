  <text x="252.96300000000002" y="480.891" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">IF/ELSE 条件分支</text>
</g>
<g class="node" data-id="N6" data-label="Tool / HTTP 请求 (发通知/调外部 API)" data-shape="rectangle">
