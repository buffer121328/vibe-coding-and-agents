<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432.7169999999999 419.20000000000005" width="432.7169999999999" height="419.20000000000005" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="ToolsMatrix" data-label="Dify 四大工具来源矩阵">
  <rect x="36" y="36" width="360.7169999999999" height="347.20000000000005" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="360.7169999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Dify 四大工具来源矩阵</text>
</g>
<g class="node" data-id="T1" data-label="1. 工具插件 (Tool Plugins)
内置原生工具 + Marketplace 社区插件" data-shape="rectangle">
  <rect x="64.41175" y="157.8" width="279.06999999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="203.94674999999995" y="184.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="203.94674999999995" dy="-3.9000000000000012">1. 工具插件 (Tool Plugins)</tspan><tspan x="203.94674999999995" dy="16.900000000000002">内置原生工具 + Marketplace 社区插件</tspan></text>
</g>
<g class="node" data-id="T2" data-label="2. MCP 协议扩展 (Model Context Protocol)
Anthropic 统一开放上下文与工具标准" data-shape="rectangle">
  <rect x="64.41175" y="235.60000000000002" width="290.1849999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="209.50424999999996" y="262.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="209.50424999999996" dy="-3.9000000000000012">2. MCP 协议扩展 (Model Context Protocol)</tspan><tspan x="209.50424999999996" dy="16.900000000000002">Anthropic 统一开放上下文与工具标准</tspan></text>
</g>
<g class="node" data-id="T3" data-label="3. 工作流作为工具 (Workflow as Tool)
将自建的复杂 Workflow 封装成可复用工具" data-shape="rectangle">
  <rect x="64.41175" y="80" width="307.96899999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="218.39624999999995" y="106.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="218.39624999999995" dy="-3.9000000000000012">3. 工作流作为工具 (Workflow as Tool)</tspan><tspan x="218.39624999999995" dy="16.900000000000002">将自建的复杂 Workflow 封装成可复用工具</tspan></text>
</g>
<g class="node" data-id="T4" data-label="4. Swagger / OpenAPI 接口
一键将企业内部 REST API 规范导入为 AI 工具" data-shape="rectangle">
  <rect x="64.41175" y="313.40000000000003" width="328.7169999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="228.77024999999998" y="340.3" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="228.77024999999998" dy="-3.9000000000000012">4. Swagger / OpenAPI 接口</tspan><tspan x="228.77024999999998" dy="16.900000000000002">一键将企业内部 REST API 规范导入为 AI 工具</tspan></text>
</g>
</svg>