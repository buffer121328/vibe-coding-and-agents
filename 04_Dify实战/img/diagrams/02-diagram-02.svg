<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729.4849999999999 739.7299999999999" width="729.4849999999999" height="739.7299999999999" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Decision" data-label="应用形态架构决策树">
  <rect x="36" y="36" width="657.4849999999999" height="667.7299999999999" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="36" y="36" width="657.4849999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="50" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">应用形态架构决策树</text>
</g>
<polyline class="edge" data-from="Q" data-to="WF" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="否 (单次输入立即计算输出)" points="310.21708333333333,431.3583333333333 310.21708333333333,513.6299999999999 215.61749999999998,513.6299999999999 215.61749999999998,633.93" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Q" data-to="CF" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="是 (需要多轮交互与状态流转)" points="450.76041666666663,431.35833333333323 450.76041666666663,513.6299999999999 545.3599999999999,513.6299999999999 545.3599999999999,633.93" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Q" data-to="WF" data-label="否 (单次输入立即计算输出)">
  <rect x="137.11749999999998" y="552.6299999999999" width="156.05200000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="215.1435" y="567.7799999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">否 (单次输入立即计算输出)</text>
</g>
<g class="edge-label" data-from="Q" data-to="CF" data-label="是 (需要多轮交互与状态流转)">
  <rect x="461.3599999999999" y="552.6299999999999" width="167.93200000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="545.3259999999999" y="567.7799999999999" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">是 (需要多轮交互与状态流转)</text>
</g>
<g class="node" data-id="Q" data-label="你的业务场景需要用户反复多轮对话并记忆上下文吗？" data-shape="diamond">
  <polygon points="380.48875,79.99999999999997 591.3037499999999,290.81499999999994 380.48875,501.6299999999999 169.67375,290.81499999999994" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="380.48875" y="290.81499999999994" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">你的业务场景需要用户反复多轮对话并记忆上下文吗？</text>
</g>
<g class="node" data-id="WF" data-label="选【工作流 Workflow】
(发票识别/网页摘要/批量数据清洗/定时任务)" data-shape="rectangle">
  <rect x="52" y="633.93" width="327.23499999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="215.61749999999998" y="660.8299999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="215.61749999999998" dy="-3.9000000000000012">选【工作流 Workflow】</tspan><tspan x="215.61749999999998" dy="16.900000000000002">(发票识别/网页摘要/批量数据清洗/定时任务)</tspan></text>
</g>
<g class="node" data-id="CF" data-label="选【对话流 Chatflow】
(智能客服/模拟面试官/交互式私教)" data-shape="rectangle">
  <rect x="413.2349999999999" y="633.93" width="264.25" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="545.3599999999999" y="660.8299999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="545.3599999999999" dy="-3.9000000000000012">选【对话流 Chatflow】</tspan><tspan x="545.3599999999999" dy="16.900000000000002">(智能客服/模拟面试官/交互式私教)</tspan></text>
</g>
</svg>