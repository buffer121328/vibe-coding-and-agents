<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 913.477 270.70000000000005" width="913.477" height="270.70000000000005" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Ways" data-label="Dify 三大创建路径选型指南">
  <rect x="40" y="40" width="833.477" height="190.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="833.477" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Dify 三大创建路径选型指南</text>
</g>
<polyline class="edge" data-from="W" data-to="Opt1" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="453.404,120.9 453.404,140.9 453.404,140.9 453.404,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="W" data-to="Opt2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="453.404,120.9 453.404,140.9 727.2045,140.9 727.2045,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="W" data-to="Opt3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="453.404,120.9 453.404,140.9 182.938,140.9 182.938,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="W" data-label="点击 '+ 创建' 按钮" data-shape="rectangle">
  <rect x="377.9655" y="84" width="150.877" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="453.404" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">点击 &#39;+ 创建&#39; 按钮</text>
</g>
<g class="node" data-id="Opt1" data-label="📄 方式一：创建空白应用
(从 0 开始自定义专属业务架构)" data-shape="rectangle">
  <rect x="333.876" y="160.9" width="239.05599999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="453.404" y="187.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="453.404" dy="-3.9000000000000012">📄 方式一：创建空白应用</tspan><tspan x="453.404" dy="16.900000000000002">(从 0 开始自定义专属业务架构)</tspan></text>
</g>
<g class="node" data-id="Opt2" data-label="🗂️ 方式二：从应用模板创建
(官方/社区成熟现成方案一键克隆)" data-shape="rectangle">
  <rect x="596.932" y="160.9" width="260.54499999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="727.2045" y="187.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="727.2045" dy="-3.9000000000000012">🗂️ 方式二：从应用模板创建</tspan><tspan x="727.2045" dy="16.900000000000002">(官方/社区成熟现成方案一键克隆)</tspan></text>
</g>
<g class="node" data-id="Opt3" data-label="📑 方式三：导入 DSL 文件
(直接拖拽 .yml 编排文件快速复刻)" data-shape="rectangle">
  <rect x="56" y="160.9" width="253.87599999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.938" y="187.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="182.938" dy="-3.9000000000000012">📑 方式三：导入 DSL 文件</tspan><tspan x="182.938" dy="16.900000000000002">(直接拖拽 .yml 编排文件快速复刻)</tspan></text>
</g>
</svg>