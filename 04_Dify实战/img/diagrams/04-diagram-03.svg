  <text x="246.664" y="419.1" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="246.664" dy="-3.9000000000000012">DeepSeek 云端官方 API 开放平台</tspan><tspan x="246.664" dy="16.900000000000002">(算力底座: DeepSeek-V3 / DeepSeek-R1)</tspan></text>
</g>
</svg>