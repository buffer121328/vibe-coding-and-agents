  <text x="246.664" y="265" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D"><tspan x="246.664" dy="-3.9000000000000012">langgenius/deepseek 模型插件</tspan><tspan x="246.664" dy="16.900000000000002">(驱动层: 负责封装 DeepSeek API 通信协议与模型列表)</tspan></text>
