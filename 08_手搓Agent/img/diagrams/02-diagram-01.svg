<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505.24616666666657 862.67" width="505.24616666666657" height="862.67" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="Loop" data-label="ReAct 核心自愈循环 (while not finished)">
  <rect x="40" y="122.9" width="321.9771666666666" height="539.6700000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="122.9" width="321.9771666666666" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="136.9" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">ReAct 核心自愈循环 (while not finished)</text>
</g>
<polyline class="edge" data-from="Start" data-to="LoopStart" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="297.9948333333333,76.9 297.9948333333333,487.87 261.22549999999995,487.87 261.22549999999995,515.87" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="Finish" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="是：结论明确" points="236.37149999999997,389.7583333333334 236.37149999999997,427.57000000000005 344.9771666666666,427.57000000000005 344.9771666666666,768.87" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="LoopStart" data-to="Action" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="244.35383333333328,552.77 244.35383333333328,592.77" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Action" data-to="Obs" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="156.51749999999998,592.77 156.51749999999998,564.77 119.74816666666665,564.77 119.74816666666665,232.70000000000002 128.76933333333332,232.70000000000002 128.76933333333332,220.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Obs" data-to="Check" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="201.53866666666664,220.70000000000002 201.53866666666664,232.70000000000002 210.5598333333333,232.70000000000002 210.5598333333333,260.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Check" data-to="LoopStart" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="否：信息不足/报错" points="184.74816666666663,389.7583333333334 184.74816666666663,487.87 227.48216666666661,487.87 227.48216666666661,515.87" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Check" data-to="Finish" data-label="是：结论明确">
  <rect x="300.47716666666656" y="703.57" width="88.93" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="344.9421666666666" y="718.72" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">是：结论明确</text>
</g>
<g class="edge-label" data-from="Check" data-to="LoopStart" data-label="否：信息不足/报错">
  <rect x="126.74816666666663" y="450.57000000000005" width="115.66000000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="184.57816666666665" y="465.72" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">否：信息不足/报错</text>
</g>
<g class="node" data-id="Start" data-label="用户输入复杂问题" data-shape="stadium">
  <rect x="217.7398333333333" y="40" width="160.51" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="297.9948333333333" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">用户输入复杂问题</text>
</g>
<g class="node" data-id="Finish" data-label="4. 🎯 Final Answer (最终交付)
'整合所有观察，给出完整解答'" data-shape="rectangle">
  <rect x="224.70816666666664" y="768.87" width="240.53799999999995" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="344.9771666666666" y="795.77" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="344.9771666666666" dy="-3.9000000000000012">4. 🎯 Final Answer (最终交付)</tspan><tspan x="344.9771666666666" dy="16.900000000000002">&#39;整合所有观察，给出完整解答&#39;</tspan></text>
</g>
<g class="node" data-id="LoopStart" data-label="LoopStart" data-shape="rectangle">
  <rect x="193.7388333333333" y="515.87" width="101.22999999999999" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="244.35383333333328" y="534.32" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">LoopStart</text>
</g>
<g class="node" data-id="Action" data-label="&quot;2. ⚡ Action (行动)
'选择工具并构造参数：calculate[1+1" data-shape="rectangle">
  <rect x="68.6811666666667" y="592.77" width="263.5089999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="200.43566666666663" y="619.67" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="200.43566666666663" dy="-3.9000000000000012">&quot;2. ⚡ Action (行动)</tspan><tspan x="200.43566666666663" dy="16.900000000000002">&#39;选择工具并构造参数：calculate[1+1</tspan></text>
</g>
<g class="node" data-id="Obs" data-label="3. 👀 Observation (观察)
'拿到真实环境返回结果：2'" data-shape="rectangle">
  <rect x="56" y="166.9" width="218.30799999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="165.154" y="193.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="165.154" dy="-3.9000000000000012">3. 👀 Observation (观察)</tspan><tspan x="165.154" dy="16.900000000000002">&#39;拿到真实环境返回结果：2&#39;</tspan></text>
</g>
<g class="node" data-id="Check" data-label="是否已经得出
最终答案？" data-shape="diamond">
  <polygon points="210.5598333333333,260.70000000000005 287.9948333333333,338.13500000000005 210.5598333333333,415.57000000000005 133.1248333333333,338.13500000000005" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="210.5598333333333" y="338.13500000000005" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="210.5598333333333" dy="-3.9000000000000012">是否已经得出</tspan><tspan x="210.5598333333333" dy="16.900000000000002">最终答案？</tspan></text>
</g>
</svg>