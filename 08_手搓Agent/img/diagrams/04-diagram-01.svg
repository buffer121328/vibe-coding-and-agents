<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704.084 440" width="704.084" height="440" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="User" x1="76.615" y1="70" x2="76.615" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Agent" x1="235.40949999999998" y1="70" x2="235.40949999999998" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Registry" x1="430.1425" y1="70" x2="430.1425" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Model" x1="613.39" y1="70" x2="613.39" y2="410" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="User" data-to="Agent" data-label="查询员工 101 并计算其税后收入" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="76.615" y1="90" x2="235.40949999999998" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="156.01225" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">查询员工 101 并计算其税后收入</text>
</g>
<g class="message" data-from="Agent" data-to="Model" data-label="发送请求 + Tools JSON Schema 列表" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="235.40949999999998" y1="130" x2="613.39" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="424.39975" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">发送请求 + Tools JSON Schema 列表</text>
</g>
<g class="message" data-from="Model" data-to="Agent" data-label="返回 tool_calls: [get_user_info(user_id=101)]" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="613.39" y1="170" x2="235.40949999999998" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="424.39975" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回 tool_calls: [get_user_info(user_id=101)]</text>
</g>
<g class="message" data-from="Agent" data-to="Registry" data-label="dispatch(&quot;get_user_info&quot;, {&quot;user_id&quot;: 101})" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="235.40949999999998" y1="210" x2="430.1425" y2="210" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="332.77599999999995" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">dispatch(&quot;get_user_info&quot;, {&quot;user_id&quot;: 101})</text>
</g>
<g class="message" data-from="Registry" data-to="Agent" data-label="返回结果: &quot;张三 (架构师)&quot;" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="430.1425" y1="250" x2="235.40949999999998" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="332.77599999999995" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回结果: &quot;张三 (架构师)&quot;</text>
</g>
<g class="message" data-from="Agent" data-to="Model" data-label="将结果作为 role: &quot;tool&quot; 消息回填" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="235.40949999999998" y1="290" x2="613.39" y2="290" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="424.39975" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">将结果作为 role: &quot;tool&quot; 消息回填</text>
</g>
<g class="message" data-from="Model" data-to="Agent" data-label="综合工具结果输出自然语言回复" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="613.39" y1="330" x2="235.40949999999998" y2="330" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="424.39975" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">综合工具结果输出自然语言回复</text>
</g>
<g class="message" data-from="Agent" data-to="User" data-label="员工 101 是张三，其税后收入为..." data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="235.40949999999998" y1="370" x2="76.615" y2="370" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="156.01225" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">员工 101 是张三，其税后收入为...</text>
</g>
<g class="actor" data-id="User" data-label="用户提问" data-type="actor">
  <g transform="translate(58.614999999999995,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="76.615" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">用户提问</text>
</g>
<g class="actor" data-id="Agent" data-label="Agent 核心调度器" data-type="participant">
  <rect x="163.22999999999996" y="30" width="144.359" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="235.40949999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Agent 核心调度器</text>
</g>
<g class="actor" data-id="Registry" data-label="ToolRegistry (分发机)" data-type="participant">
  <rect x="347.589" y="30" width="165.107" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="430.1425" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ToolRegistry (分发机)</text>
</g>
<g class="actor" data-id="Model" data-label="智谱 BigModel" data-type="participant">
  <rect x="552.696" y="30" width="121.388" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="613.39" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">智谱 BigModel</text>
</g>
</svg>