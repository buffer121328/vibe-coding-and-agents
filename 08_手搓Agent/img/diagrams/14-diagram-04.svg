<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440.9722499999999 423.9" width="440.9722499999999" height="423.9" style="--bg:#282a36;--fg:#f8f8f2;--line:#6272a4;--accent:#bd93f9;--muted:#6272a4;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Req" data-to="Main" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="154.046,72.9 154.046,118.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Main" data-to="Success" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="正常响应" points="114.69733333333332,155.8 114.69733333333332,189.8 66.73724999999999,189.8 66.73724999999999,339 132.4813333333333,339 132.4813333333333,351" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Main" data-to="Fallback" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="网络超时 / 5xx 服务宕机" points="193.39466666666664,155.8 193.39466666666664,189.8 241.35474999999997,189.8 241.35474999999997,268.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Fallback" data-to="Success" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="241.35474999999997,305 241.35474999999997,339 175.61066666666665,339 175.61066666666665,351" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Main" data-to="Success" data-label="正常响应">
  <rect x="33.737249999999996" y="196.8" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="66.32225" y="211.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">正常响应</text>
</g>
<g class="edge-label" data-from="Main" data-to="Fallback" data-label="网络超时 / 5xx 服务宕机">
  <rect x="171.85474999999997" y="196.8" width="138.82600000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="241.26774999999998" y="211.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">网络超时 / 5xx 服务宕机</text>
</g>
<g class="node" data-id="Req" data-label="Agent 请求" data-shape="stadium">
  <rect x="100.09649999999998" y="36" width="107.899" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="154.046" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent 请求</text>
</g>
<g class="node" data-id="Main" data-label="主力引擎：智谱 GLM-5.3-Flash" data-shape="rectangle">
  <rect x="36" y="118.9" width="236.09199999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="154.046" y="137.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">主力引擎：智谱 GLM-5.3-Flash</text>
</g>
<g class="node" data-id="Success" data-label="返回 Token 流" data-shape="stadium">
  <rect x="89.35199999999998" y="351" width="129.388" height="36.900000000000006" rx="18.450000000000003" ry="18.450000000000003" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="154.046" y="369.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">返回 Token 流</text>
</g>
<g class="node" data-id="Fallback" data-label="自动无缝降级：火山方舟 DeepSeek-V4-Flash" data-shape="rectangle">
  <rect x="77.73724999999999" y="268.1" width="327.23499999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="241.35474999999997" y="286.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">自动无缝降级：火山方舟 DeepSeek-V4-Flash</text>
</g>
</svg>