<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763.6289999999999 298.70000000000005" width="763.6289999999999" height="298.70000000000005" style="--bg:#F8FAFC;--fg:#17324D;--line:#6B7A90;--accent:#2F6F9F;--muted:#52667A;--surface:#EAF2FB;--border:#6B8FB3;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto%20Sans%20SC:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="BadState" data-label="❌ 排版错乱典型现象">
  <rect x="40" y="40" width="251.78999999999996" height="218.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="251.78999999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">❌ 排版错乱典型现象</text>
</g>
<g class="subgraph" data-id="GoodAction" data-label="✅ 30 秒急救解决绝招">
  <rect x="331.78999999999996" y="40" width="391.839" height="218.70000000000002" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="331.78999999999996" y="40" width="391.839" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="343.78999999999996" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">✅ 30 秒急救解决绝招</text>
</g>
<polyline class="edge" data-from="BadState" data-to="GoodAction" data-style="thick" data-arrow-start="false" data-arrow-end="true" points="291.78999999999996,149.35000000000002 331.78999999999996,149.35000000000002" fill="none" stroke="var(--_line)" stroke-width="2" marker-end="url(#arrowhead)" />
<g class="node" data-id="B1" data-label="中间代码与右侧沙箱重叠" data-shape="rectangle">
  <rect x="59.705" y="144.9" width="204.96999999999997" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="162.19" y="163.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">中间代码与右侧沙箱重叠</text>
</g>
<g class="node" data-id="B2" data-label="三栏被挤成上下竖向单列" data-shape="rectangle">
  <rect x="59.705" y="205.8" width="204.96999999999997" height="36.900000000000006" rx="0" ry="0" fill="#E7F5F1" stroke="#2B8A78" stroke-width="0.75" />
  <text x="162.19" y="224.25" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">三栏被挤成上下竖向单列</text>
</g>
<g class="node" data-id="B3" data-label="黑色背景和文字同色看不清" data-shape="rectangle">
  <rect x="59.705" y="84" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="#FFF4DC" stroke="#B47A1F" stroke-width="0.75" />
  <text x="169.59999999999997" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">黑色背景和文字同色看不清</text>
</g>
<g class="node" data-id="G1" data-label="按快捷键 Cmd - (Mac) 或 Ctrl - (Win) 缩小至 80%~90%" data-shape="rectangle">
  <rect x="350.56874999999997" y="144.9" width="350.947" height="36.900000000000006" rx="0" ry="0" fill="#F0EBFA" stroke="#7357A6" stroke-width="0.75" />
  <text x="526.04225" y="163.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">按快捷键 Cmd - (Mac) 或 Ctrl - (Win) 缩小至 80%~90%</text>
</g>
<g class="node" data-id="G2" data-label="浏览器窗口最大化 / 全屏浏览 (推荐 1280px+ 宽度)" data-shape="rectangle">
  <rect x="350.56874999999997" y="205.8" width="348.72399999999993" height="36.900000000000006" rx="0" ry="0" fill="#FCE9E6" stroke="#B65C4A" stroke-width="0.75" />
  <text x="524.93075" y="224.25" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">浏览器窗口最大化 / 全屏浏览 (推荐 1280px+ 宽度)</text>
</g>
<g class="node" data-id="G3" data-label="临时关闭 Dark Reader 等第三方网页强制反色插件" data-shape="rectangle">
  <rect x="350.56874999999997" y="84" width="359.839" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
  <text x="530.48825" y="102.45" text-anchor="middle" font-size="13" font-weight="500" fill="#17324D" dy="4.55">临时关闭 Dark Reader 等第三方网页强制反色插件</text>
</g>
</svg>