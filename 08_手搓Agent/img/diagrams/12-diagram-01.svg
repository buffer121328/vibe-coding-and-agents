  <text x="505.53000000000003" y="377.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">tool_result 工具结果</text>
</g>
<g class="node" data-id="E" data-label="compact 上下文压缩 / error 报错 / finish 完成" data-shape="rectangle">
