  <rect x="40" y="633.4" width="909.06" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="647.4" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">👀 各司其职的订阅者</text>
</g>
<polyline class="edge" data-from="Agent" data-to="BUS" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="494.53,444.5 494.53,534.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="BUS" data-to="Subscribers" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="494.53,571.4 494.53,633.4" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="494.53,120.9 494.53,160.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
