  <rect x="36" y="725.4" width="939.06" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="48" y="739.4" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">👀 各司其职的订阅者</text>
</g>
<polyline class="edge" data-from="Agent" data-to="BUS" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="505.53,504.5 505.53,610.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="BUS" data-to="Subscribers" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="505.53,647.4 505.53,725.4" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="505.53,116.9 505.53,172.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="530.1821666666667,209.8 530.1821666666667,221.8 549.1197500000001,221.8 549.1197500000001,265.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="549.1197500000001,302.70000000000005 549.1197500000001,314.70000000000005 533.1461666666667,314.70000000000005 533.1461666666667,358.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="477.91383333333334,358.70000000000005 477.91383333333334,314.70000000000005 461.94025,314.70000000000005 461.94025,221.8 480.87783333333334,221.8 480.87783333333334,209.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="505.53,395.6 505.53,451.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="agent_start 任务启动" data-shape="rectangle">
