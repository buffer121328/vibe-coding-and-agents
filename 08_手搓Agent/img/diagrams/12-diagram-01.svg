<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="538.11975,274.70000000000005 538.11975,286.70000000000005 522.1461666666667,286.70000000000005 522.1461666666667,314.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="466.9138333333333,314.70000000000005 466.9138333333333,286.70000000000005 450.94024999999993,286.70000000000005 450.94024999999993,209.8 469.8778333333333,209.8 469.8778333333333,197.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="494.53,351.6 494.53,391.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="A" data-label="agent_start 任务启动" data-shape="rectangle">
  <rect x="409.45849999999996" y="84" width="170.143" height="36.900000000000006" rx="0" ry="0" fill="#E8F1FB" stroke="#3A6EA5" stroke-width="0.75" />
