  <text x="494.5299999999999" y="333.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">tool_result 工具结果</text>
</g>
<g class="node" data-id="E" data-label="compact 上下文压缩 / error 报错 / finish 完成" data-shape="rectangle">
  <rect x="339.0635" y="391.6" width="310.93299999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="494.53" y="410.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">compact 上下文压缩 / error 报错 / finish 完成</text>
</g>
<g class="node" data-id="BUS" data-label="把事件分发给精确匹配者 + 通配(*)订阅者，并写入历史" data-shape="rectangle">
