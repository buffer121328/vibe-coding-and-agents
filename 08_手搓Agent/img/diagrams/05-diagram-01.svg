<polyline class="edge" data-from="A2" data-to="B2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="192.503,237.35000000000002 244.503,237.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B2" data-to="C2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="528.76,237.35000000000002 580.76,237.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
