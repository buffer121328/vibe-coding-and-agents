<polyline class="edge" data-from="A2" data-to="B2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="196.503,223.35000000000002 236.503,223.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B2" data-to="C2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="520.76,223.35000000000002 560.76,223.35000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
