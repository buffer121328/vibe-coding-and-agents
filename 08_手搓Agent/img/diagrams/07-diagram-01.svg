<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365.89 565" width="365.89" height="565" style="--bg:#1e1e2e;--fg:#cdd6f4;--line:#585b70;--accent:#cba6f7;--muted:#6c7086;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Call" data-to="Pre" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.945,72.9 182.945,128.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Pre" data-to="Exec" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.945,199.60000000000002 182.945,255.60000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Exec" data-to="Post" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.945,309.40000000000003 182.945,365.40000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Post" data-to="Return" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="182.945,436.1 182.945,492.1" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Call" data-label="Agent 发起工具调用" data-shape="rectangle">
  <rect x="99.3555" y="36" width="167.17899999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.945" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Agent 发起工具调用</text>
</g>
<g class="node" data-id="Pre" data-label="1. 🪝 PreToolUse Hooks
- 参数合法性预检
- 记录起始时间戳 _start_time" data-shape="rectangle">
  <rect x="74.16150000000002" y="128.9" width="217.56699999999995" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.945" y="164.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="182.945" dy="-12.350000000000001">1. 🪝 PreToolUse Hooks</tspan><tspan x="182.945" dy="16.900000000000002">- 参数合法性预检</tspan><tspan x="182.945" dy="16.900000000000002">- 记录起始时间戳 _start_time</tspan></text>
</g>
<g class="node" data-id="Exec" data-label="2. ⚡ 纯粹的业务工具函数执行
(例如: 查询数据库 / 请求外部 API)" data-shape="rectangle">
  <rect x="58.60050000000001" y="255.60000000000002" width="248.68899999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.945" y="282.5" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="182.945" dy="-3.9000000000000012">2. ⚡ 纯粹的业务工具函数执行</tspan><tspan x="182.945" dy="16.900000000000002">(例如: 查询数据库 / 请求外部 API)</tspan></text>
</g>
<g class="node" data-id="Post" data-label="3. 🪝 PostToolUse Hooks
- 自动正则脱敏 (隐藏 sk-xxx / password)
- 计算耗时并追加遥测标记" data-shape="rectangle">
  <rect x="39.70500000000001" y="365.40000000000003" width="286.47999999999996" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.945" y="400.75000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="182.945" dy="-12.350000000000001">3. 🪝 PostToolUse Hooks</tspan><tspan x="182.945" dy="16.900000000000002">- 自动正则脱敏 (隐藏 sk-xxx / password)</tspan><tspan x="182.945" dy="16.900000000000002">- 计算耗时并追加遥测标记</tspan></text>
</g>
<g class="node" data-id="Return" data-label="4. 📦 清洗后的安全结果回填模型上下文" data-shape="rectangle">
  <rect x="36" y="492.1" width="293.89" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="182.945" y="510.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">4. 📦 清洗后的安全结果回填模型上下文</text>
</g>
</svg>