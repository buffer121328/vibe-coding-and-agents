  <text x="195.6105" y="342.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">5. 连续狂点发送导致队列堵塞？</text>
</g>
<g class="node" data-id="F5" data-label="点击『清空重置』刷新 Session，避免并发连击" data-shape="rectangle">
  <rect x="383.221" y="323.6" width="345.01899999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
