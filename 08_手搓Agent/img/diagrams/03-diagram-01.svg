  <text x="260.00199999999995" y="270.7" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="260.00199999999995" dy="-3.9000000000000012">&quot;📋 生成 Todo 清单：</tspan><tspan x="260.00199999999995" dy="16.900000000000002">[1. 明确饮食需求</tspan></text>
</g>
<g class="node" data-id="S1" data-label="执行 Task 1: 明确饮食需求 (状态 -&gt; in_progress -&gt; completed)" data-shape="rectangle">
  <rect x="56" y="409.6" width="408.0039999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="260.00199999999995" y="428.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">执行 Task 1: 明确饮食需求 (状态 -&gt; in_progress -&gt; completed)</text>
</g>
<g class="node" data-id="S2" data-label="执行 Task 2: 设计健康菜单 (带入 Task 1 产出上下文)" data-shape="rectangle">
  <rect x="78.60049999999998" y="486.5" width="362.80299999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="260.00199999999995" y="504.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">执行 Task 2: 设计健康菜单 (带入 Task 1 产出上下文)</text>
</g>
<g class="node" data-id="S3" data-label="执行 Task 3: 制定采购清单 (带入前序累积上下文)" data-shape="rectangle">
  <rect x="84.15799999999999" y="563.4000000000001" width="351.68799999999993" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="260.00199999999995" y="581.8500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">执行 Task 3: 制定采购清单 (带入前序累积上下文)</text>
</g>
<g class="node" data-id="S4" data-label="执行 Task 4: 编排烹饪流程 (终结并汇总交付)" data-shape="rectangle">
  <rect x="98.97799999999998" y="640.3000000000001" width="322.04799999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="260.00199999999995" y="658.7500000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">执行 Task 4: 编排烹饪流程 (终结并汇总交付)</text>
</g>
