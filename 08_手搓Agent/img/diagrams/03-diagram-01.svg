  <text x="256.00199999999995" y="197.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Planner</text>
</g>
<g class="node" data-id="TodoList" data-label="&quot;📋 生成 Todo 清单：
[1. 明确饮食需求" data-shape="rectangle">
