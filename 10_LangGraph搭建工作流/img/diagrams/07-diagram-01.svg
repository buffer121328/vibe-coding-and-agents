<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 553.5 225.8" width="553.5" height="225.8" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Primary" data-to="Flight" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="106,72.9 106,118.9 81,118.9 81,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Primary" data-to="Flight" data-label="转交工具：机票业务">
  <rect x="37" y="107.9" width="113" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="93.5" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">转交工具：机票业务</text>
</g>
<polyline class="edge" data-from="Primary" data-to="Car" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="106,72.9 106,118.9 277,118.9 277,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Primary" data-to="Car" data-label="转交工具：租车业务">
  <rect x="135" y="107.9" width="113" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="191.5" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">转交工具：租车业务</text>
</g>
<polyline class="edge" data-from="Primary" data-to="Hotel" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="106,72.9 106,118.9 423,118.9 423,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Primary" data-to="Hotel" data-label="转交工具：酒店业务">
  <rect x="208" y="107.9" width="113" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="264.5" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">转交工具：酒店业务</text>
</g>
<polyline class="edge" data-from="Flight" data-to="Primary" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="126,183.35 192,183.35 192,54.45 176,54.45" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Flight" data-to="Primary" data-label="任务完成或升级">
  <rect x="146.5" y="107.9" width="91" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="192" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">任务完成或升级</text>
</g>
<polyline class="edge" data-from="Car" data-to="Primary" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="322,183.35 338,183.35 338,54.45 176,54.45" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Car" data-to="Primary" data-label="任务完成或升级">
  <rect x="292.5" y="107.9" width="91" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="338" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">任务完成或升级</text>
</g>
<polyline class="edge" data-from="Hotel" data-to="Primary" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="468,183.35 484,183.35 484,54.45 176,54.45" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Hotel" data-to="Primary" data-label="任务完成或升级">
  <rect x="438.5" y="107.9" width="91" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="484" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">任务完成或升级</text>
</g>
<g class="node" data-id="Primary" data-label="主助理 (前台接待)" data-shape="rectangle">
  <rect x="36" y="36" width="140" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="106" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="106" dy="4.55">主助理 (前台接待)</tspan></text>
</g>
<g class="node" data-id="Flight" data-label="航班专员" data-shape="rectangle">
  <rect x="36" y="164.9" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81" dy="4.55">航班专员</tspan></text>
</g>
<g class="node" data-id="Car" data-label="租车专员" data-shape="rectangle">
  <rect x="232" y="164.9" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="277" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="277" dy="4.55">租车专员</tspan></text>
</g>
<g class="node" data-id="Hotel" data-label="酒店专员" data-shape="rectangle">
  <rect x="378" y="164.9" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="423" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="423" dy="4.55">酒店专员</tspan></text>
</g>
</svg>
