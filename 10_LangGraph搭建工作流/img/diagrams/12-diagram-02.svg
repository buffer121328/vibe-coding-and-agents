<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 354.7" width="520" height="354.7" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Reception" data-to="SQL" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="116.5,72.9 116.5,118.9 81,118.9 81,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Reception" data-to="SQL" data-label="查数据库">
  <rect x="69.75" y="107.9" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="98.75" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">查数据库</text>
</g>
<polyline class="edge" data-from="Reception" data-to="RAG" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="116.5,72.9 116.5,118.9 298.5,118.9 298.5,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Reception" data-to="RAG" data-label="查知识库">
  <rect x="178.5" y="107.9" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="207.5" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">查知识库</text>
</g>
<polyline class="edge" data-from="Reception" data-to="Code" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="116.5,72.9 116.5,118.9 448,118.9 448,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Reception" data-to="Code" data-label="写代码">
  <rect x="258.75" y="107.9" width="47" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="282.25" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">写代码</text>
</g>
<polyline class="edge" data-from="SQL" data-to="FinalA" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="81,201.8 81,293.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="RAG" data-to="FinalA" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="298.5,201.8 298.5,247.8 81,247.8 81,293.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Code" data-to="FinalA" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="448,201.8 448,247.8 81,247.8 81,293.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="Reception" data-label="分诊台 (Router 节点)" data-shape="rectangle">
  <rect x="36" y="36" width="161" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="116.5" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="116.5" dy="4.55">分诊台 (Router 节点)</tspan></text>
</g>
<g class="node" data-id="SQL" data-label="SQL 专员" data-shape="rectangle">
  <rect x="36" y="164.9" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81" dy="4.55">SQL 专员</tspan></text>
</g>
<g class="node" data-id="RAG" data-label="RAG 专员" data-shape="rectangle">
  <rect x="253" y="164.9" width="91" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="298.5" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="298.5" dy="4.55">RAG 专员</tspan></text>
</g>
<g class="node" data-id="Code" data-label="Code 专员" data-shape="rectangle">
  <rect x="400" y="164.9" width="96" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="448" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="448" dy="4.55">Code 专员</tspan></text>
</g>
<g class="node" data-id="FinalA" data-label="答案" data-shape="rectangle">
  <rect x="36" y="293.8" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81" y="312.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81" dy="4.55">答案</tspan></text>
</g>
</svg>
