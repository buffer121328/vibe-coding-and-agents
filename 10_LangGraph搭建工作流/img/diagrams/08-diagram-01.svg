<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 386 483.6" width="386" height="483.6" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="User" data-to="Model" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="81,72.9 81,118.9 106,118.9 106,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Model" data-to="Route" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="106,201.8 106,247.8 101,247.8 101,293.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Model" data-to="Route" data-label="输出 tool_calls">
  <rect x="59.78202819824219" y="236.8" width="87.43594360351562" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="103.5" y="247.8" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">输出 tool_calls</text>
</g>
<polyline class="edge" data-from="Route" data-to="Tools" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="101,330.7 101,376.70000000000005 112,376.70000000000005 112,422.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Route" data-to="Tools" data-label="调用工具">
  <rect x="77.5" y="365.70000000000005" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="106.5" y="376.70000000000005" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">调用工具</text>
</g>
<polyline class="edge" data-from="Tools" data-to="Model" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="188,441.15000000000003 204,441.15000000000003 204,183.35 176,183.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Tools" data-to="Model" data-label="结果回填">
  <rect x="175" y="301.25" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="204" y="312.25" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">结果回填</text>
</g>
<polyline class="edge" data-from="Route" data-to="Finish" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="101,330.7 101,376.70000000000005 303,376.70000000000005 303,422.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Route" data-to="Finish" data-label="直接回答">
  <rect x="173" y="365.70000000000005" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="202" y="376.70000000000005" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">直接回答</text>
</g>
<g class="node" data-id="User" data-label="用户提问" data-shape="rectangle">
  <rect x="36" y="36" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81" dy="4.55">用户提问</tspan></text>
</g>
<g class="node" data-id="Model" data-label="大模型节点 (思考)" data-shape="rectangle">
  <rect x="36" y="164.9" width="140" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="106" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="106" dy="4.55">大模型节点 (思考)</tspan></text>
</g>
<g class="node" data-id="Route" data-label="tools_condition" data-shape="diamond">
  <polygon points="101,281.8 137,312.25 101,342.7 65,312.25" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="101" y="312.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="101" dy="4.55">tools_condition</tspan></text>
</g>
<g class="node" data-id="Tools" data-label="ToolNode 执行工具" data-shape="rectangle">
  <rect x="36" y="422.70000000000005" width="152" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="112" y="441.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="112" dy="4.55">ToolNode 执行工具</tspan></text>
</g>
<g class="node" data-id="Finish" data-label="最终回答 END" data-shape="rectangle">
  <rect x="244" y="422.70000000000005" width="118" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="303" y="441.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="303" dy="4.55">最终回答 END</tspan></text>
</g>
</svg>
