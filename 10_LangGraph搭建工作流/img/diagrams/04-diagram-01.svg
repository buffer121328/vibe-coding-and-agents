<polyline class="edge" data-from="B" data-to="Merge" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="199.615,165.8 199.615,209.8 199.615,209.8 199.615,221.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="Merge" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="320.025,197.8 320.025,209.8 199.615,209.8 199.615,221.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
