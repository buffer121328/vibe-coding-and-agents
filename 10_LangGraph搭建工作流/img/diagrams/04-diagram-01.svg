<g class="node" data-id="Planner" data-label="规划节点" data-shape="rectangle">
  <rect x="149" y="36" width="101.22999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="199.615" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">规划节点</text>
