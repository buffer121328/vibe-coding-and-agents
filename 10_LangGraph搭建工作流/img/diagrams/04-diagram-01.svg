</g>
<g class="node" data-id="END" data-label="END" data-shape="rectangle">
  <rect x="165.30200000000002" y="314.70000000000005" width="68.62599999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="199.615" y="333.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">END</text>
