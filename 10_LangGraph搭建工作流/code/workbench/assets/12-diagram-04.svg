<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265.9049758911133 354.7" width="265.9049758911133" height="354.7" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Plan" data-to="Exec" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="98.5,72.9 98.5,118.9 103,118.9 103,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Exec" data-to="Review" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="103,201.8 103.5,293.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Review" data-to="Exec" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="171,312.25 187,312.25 187,183.35 170,183.35" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Review" data-to="Exec" data-label="needs_fix 打回重做">
  <rect x="132.09502410888672" y="236.8" width="109.80995178222656" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="187" y="247.8" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">needs_fix 打回重做</text>
</g>
<g class="node" data-id="Plan" data-label="Planner 规划师" data-shape="rectangle">
  <rect x="36" y="36" width="125" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="98.5" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="98.5" dy="4.55">Planner 规划师</tspan></text>
</g>
<g class="node" data-id="Exec" data-label="Executor 执行者" data-shape="rectangle">
  <rect x="36" y="164.9" width="134" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="103" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="103" dy="4.55">Executor 执行者</tspan></text>
</g>
<g class="node" data-id="Review" data-label="Reviewer 评审员" data-shape="diamond">
  <polygon points="103.5,281.8 139.5,312.25 103.5,342.7 67.5,312.25" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="103.5" y="312.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="103.5" dy="4.55">Reviewer 评审员</tspan></text>
</g>
</svg>
