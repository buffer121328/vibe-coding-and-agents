<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 483.6" width="466" height="483.6" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="__start__" data-to="reception" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="81,72.9 81.5,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="reception" data-to="code_agent" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="81.5,201.8 81.5,247.8 389,247.8 389,293.8" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="reception" data-to="rag_agent" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="81.5,201.8 81.5,247.8 232.5,247.8 232.5,293.8" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="reception" data-to="sql_agent" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="81.5,201.8 82.5,293.8" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="code_agent" data-to="__end__" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="389,330.7 389,376.70000000000005 81,376.70000000000005 81,422.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="rag_agent" data-to="__end__" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="232.5,330.7 232.5,376.70000000000005 81,376.70000000000005 81,422.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="sql_agent" data-to="__end__" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="82.5,330.7 81,422.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="__start__" data-label="开始" data-shape="rectangle">
  <rect x="36" y="36" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81" dy="4.55">开始</tspan></text>
</g>
<g class="node" data-id="reception" data-label="reception" data-shape="rectangle">
  <rect x="36" y="164.9" width="91" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81.5" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81.5" dy="4.55">reception</tspan></text>
</g>
<g class="node" data-id="sql_agent" data-label="sql_agent" data-shape="rectangle">
  <rect x="36" y="293.8" width="93" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="82.5" y="312.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="82.5" dy="4.55">sql_agent</tspan></text>
</g>
<g class="node" data-id="rag_agent" data-label="rag_agent" data-shape="rectangle">
  <rect x="185" y="293.8" width="95" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="232.5" y="312.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="232.5" dy="4.55">rag_agent</tspan></text>
</g>
<g class="node" data-id="code_agent" data-label="code_agent" data-shape="rectangle">
  <rect x="336" y="293.8" width="106" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="389" y="312.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="389" dy="4.55">code_agent</tspan></text>
</g>
<g class="node" data-id="__end__" data-label="结束" data-shape="rectangle">
  <rect x="36" y="422.70000000000005" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81" y="441.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81" dy="4.55">结束</tspan></text>
</g>
</svg>
