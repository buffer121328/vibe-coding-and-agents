<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 689 225.8" width="689" height="225.8" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="Sup" data-to="Research" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="163.5,72.9 163.5,118.9 81,118.9 81,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Sup" data-to="Research" data-label="派活">
  <rect x="104.25" y="107.9" width="36" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="122.25" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">派活</text>
</g>
<polyline class="edge" data-from="Sup" data-to="Writer" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="163.5,72.9 163.5,118.9 392,118.9 392,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Sup" data-to="Writer" data-label="派活">
  <rect x="259.75" y="107.9" width="36" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="277.75" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">派活</text>
</g>
<polyline class="edge" data-from="Research" data-to="Sup" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="126,183.35 307,183.35 307,54.45 291,54.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Research" data-to="Sup" data-label="交回结果">
  <rect x="278" y="107.9" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="307" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">交回结果</text>
</g>
<polyline class="edge" data-from="Writer" data-to="Sup" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="437,183.35 453,183.35 453,54.45 291,54.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Writer" data-to="Sup" data-label="交回结果">
  <rect x="424" y="107.9" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="453" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">交回结果</text>
</g>
<polyline class="edge" data-from="Sup" data-to="Agg" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="163.5,72.9 163.5,118.9 579,118.9 579,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Sup" data-to="Agg" data-label="全员完工">
  <rect x="342.25" y="107.9" width="58" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="371.25" y="118.9" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">全员完工</text>
</g>
<g class="node" data-id="Sup" data-label="Supervisor 主管 (拆任务/派活/收活)" data-shape="rectangle">
  <rect x="36" y="36" width="255" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="163.5" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="163.5" dy="4.55">Supervisor 主管 (拆任务/派活/收活)</tspan></text>
</g>
<g class="node" data-id="Research" data-label="调研专员" data-shape="rectangle">
  <rect x="36" y="164.9" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="81" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="81" dy="4.55">调研专员</tspan></text>
</g>
<g class="node" data-id="Writer" data-label="写作专员" data-shape="rectangle">
  <rect x="347" y="164.9" width="90" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="392" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="392" dy="4.55">写作专员</tspan></text>
</g>
<g class="node" data-id="Agg" data-label="汇总节点 (Aggregator)" data-shape="rectangle">
  <rect x="493" y="164.9" width="172" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="579" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="579" dy="4.55">汇总节点 (Aggregator)</tspan></text>
</g>
</svg>
