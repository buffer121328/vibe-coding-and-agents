<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 483.6" width="328" height="483.6" style="--bg:#eff1f5;--fg:#4c4f69;--line:#9ca0b0;--accent:#8839ef;--muted:#9ca0b0;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter%2C%20PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter, PingFang SC, Microsoft YaHei, sans-serif', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="__start__" data-to="write_essay" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="99,72.9 99,118.9 93.5,118.9 93.5,164.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="write_essay" data-to="review" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="93.5,201.8 93.5,247.8 142,247.8 142,293.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="review" data-to="__end__" data-style="normal" data-arrow-start="false" data-arrow-end="true" points="142,330.7 142,376.70000000000005 99,376.70000000000005 99,422.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="review" data-to="__end__" data-label="批准">
  <rect x="102.5" y="365.70000000000005" width="36" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="120.5" y="376.70000000000005" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">批准</text>
</g>
<polyline class="edge" data-from="review" data-to="write_essay" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="248,312.25 264,312.25 264,183.35 151,183.35" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="review" data-to="write_essay" data-label="驳回：给理由">
  <rect x="224" y="236.8" width="80" height="22" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="264" y="247.8" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.85">驳回：给理由</text>
</g>
<g class="node" data-id="__start__" data-label="输入：作文题目" data-shape="rectangle">
  <rect x="36" y="36" width="126" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="99" y="54.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="99" dy="4.55">输入：作文题目</tspan></text>
</g>
<g class="node" data-id="write_essay" data-label="@task 写初稿" data-shape="rectangle">
  <rect x="36" y="164.9" width="115" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="93.5" y="183.35" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="93.5" dy="4.55">@task 写初稿</tspan></text>
</g>
<g class="node" data-id="review" data-label="@task 人工审阅（interrupt）" data-shape="rectangle">
  <rect x="36" y="293.8" width="212" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="142" y="312.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="142" dy="4.55">@task 人工审阅（interrupt）</tspan></text>
</g>
<g class="node" data-id="__end__" data-label="产出：最终文稿" data-shape="rectangle">
  <rect x="36" y="422.70000000000005" width="126" height="36.9" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="99" y="441.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="99" dy="4.55">产出：最终文稿</tspan></text>
</g>
</svg>
